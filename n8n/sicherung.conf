# /opt/stack/n8n/sicherung.conf

VOLUMES="n8n_n8n_data"
DB_CONTAINER=""
DB_USER=""
DB_NAME=""
DATEIEN=""
ORDNER=""
# n8n haelt seine SQLite-Datenbank im Volume unter .n8n/database.sqlite.
# Der Volume-Tar reicht hier nicht mit derselben Gewissheit wie bei den
# eigenen Tools; n8n schreibt aber nur bei laufenden Abläufen.
SQLITE=""
HINWEIS="Webhook-Pfade laufen ohne Authentik-Middleware. Zugangsdaten zu
fremden Diensten liegen verschluesselt im Volume - der Schluessel steht in
N8N_ENCRYPTION_KEY und gehoert in den Passwortmanager, sonst ist die
Sicherung nach einem Neuaufbau nicht entschluesselbar."
