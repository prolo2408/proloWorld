# /opt/stack/n8n/sicherung.conf

VOLUMES="n8n_n8n_data"
DB_CONTAINER=""
DB_USER=""
DB_NAME=""
# Die .env traegt N8N_ENCRYPTION_KEY - ohne den ist der Volume-Tar
# daneben nur halb so viel wert.
DATEIEN=".env"
ORDNER=""
# n8n haelt seine SQLite-Datenbank im Volume unter .n8n/database.sqlite.
# Der Volume-Tar reicht hier nicht mit derselben Gewissheit wie bei den
# eigenen Tools; n8n schreibt aber nur bei laufenden Abläufen.
SQLITE=""
HINWEIS="EIGENE ANMELDUNG (prolo.anmeldung=eigene, N-59): n8n steht NICHT
hinter Authentik. Es bringt seine eigene Anmeldung mit - dort gehoert 2FA
eingeschaltet, sonst haengt alles an einem Passwort. Geschuetzt ist es
sonst durch sein eigenes Netz (netz-n8n) und die Ratenbremse am Eingang.
AUFBAU (N-61): zwei Compose-Dateien. docker-compose.yml ist die des
HERSTELLERS und wird bei einer neuen Fassung ersetzt; alles von uns steht
in docker-compose.override.yml. Was dabei herauskommt, zeigt
  cd /opt/stack/n8n && docker compose config
Zugangsdaten zu fremden Diensten liegen verschluesselt im Volume - der
Schluessel steht in N8N_ENCRYPTION_KEY (siehe geheimnisse.conf) und
gehoert in den Passwortmanager, sonst ist die Sicherung nach einem
Neuaufbau nicht entschluesselbar."
