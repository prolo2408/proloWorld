# /opt/stack/n8n/geheimnisse.conf
# Eine Zeile je Wert: NAME|DATEI|FORM|WECHSEL|Erklaerung - und NIE ein Wert.
#
# haende, nicht harmlos: ein neuer Schluessel macht jede hinterlegte
# Zugangsdatei in n8n unlesbar. Das ist kein Wechsel, das ist ein
# Datenverlust. "--verteilen" fuellt ihn, wenn er fehlt; "--neu" ruehrt
# ihn nicht an.
N8N_ENCRYPTION_KEY|.env|env|haende|Verschluesselt die in n8n hinterlegten Zugangsdaten zu fremden Diensten. Ohne ihn ist eine Sicherung nach einem Neuaufbau nicht entschluesselbar. Gehoert in den Passwortmanager.
