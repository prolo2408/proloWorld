# /opt/stack/n8n/aktualisierung.conf

# Fertiges Abbild aus der Registry, kein eigener Quellcode.
TYP="image"

# n8n bringt einen eigenen Bereitschaftspfad mit. Containername und
# INTERNER Port - nicht die oeffentliche Domain, sonst haengt die Pruefung
# an der Anmeldung fest.
PRUEF_URL="http://n8n:5678/healthz"

# n8n richtet beim ersten Start seine Datenbank ein und braucht laenger.
PRUEF_WARTEN=60
