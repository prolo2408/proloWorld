services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.121.0
    container_name: n8n
    # Grenzen nach CLAUDE.md §19 (B-29). Vorher hatte KEIN Container
    # mem_limit, pids_limit, cap_drop oder security_opt. Folgen: ein
    # Speicherleck in einem Tool brachte den GANZEN Server in den OOM-Killer,
    # nicht nur sich selbst; die Container liefen mit dem vollen
    # Standardsatz an Linux-Faehigkeiten, obwohl keiner davon welche
    # braucht; und ohne no-new-privileges ermoeglicht eine Datei mit
    # gesetztem setuid-Bit im Abbild eine Rechteausweitung.
    # n8n fuehrt beliebige Ablaeufe aus und braucht mehr Luft.
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.prolo.me
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.prolo.me/
      N8N_EDITOR_BASE_URL: https://n8n.prolo.me/
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_PROXY_HOPS: 1
      N8N_RUNNERS_ENABLED: true
      N8N_DIAGNOSTICS_ENABLED: false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - netz-n8n
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=netz-n8n"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

      # Oberflaeche: geschuetzt durch Authentik
      - "traefik.http.routers.n8n.rule=Host(`n8n.prolo.me`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.middlewares=authentik@file"
      - "traefik.http.routers.n8n.service=n8n"

      # Webhooks: OHNE Authentik, sonst kommen externe Aufrufe nicht durch
      - "traefik.http.routers.n8n-webhook.rule=Host(`n8n.prolo.me`) && (PathPrefix(`/webhook`) || PathPrefix(`/webhook-test`) || PathPrefix(`/webhook-waiting`) || PathPrefix(`/form`))"
      - "traefik.http.routers.n8n-webhook.entrypoints=websecure"
      - "traefik.http.routers.n8n-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-webhook.priority=100"
      - "traefik.http.routers.n8n-webhook.service=n8n"

volumes:
  n8n_data:

networks:
# Eigenes Netz je Werkzeug (N-45). Vorher hingen Wiki, Bordbuch, n8n und
# Authentik im selben Netz "proxy" - und in einem Docker-Netz erreicht jeder
# Container jeden anderen direkt, ohne Traefik und ohne Anmeldung. Damit war
# der Weg von n8n (fuehrt angeklickte Ablaeufe mit einem HTTP-Baustein aus,
# hat Webhook-Pfade ohne Anmeldung) zum Wiki offen. Jetzt gibt es ihn nicht
# mehr: nur Traefik haengt in allen Netzen, die Werkzeuge in je ihrem.
#
# Anlegen, einmalig je Server:  docker network create netz-n8n
  netz-n8n:
    external: true
