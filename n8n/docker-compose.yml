# /opt/stack/n8n/docker-compose.yml
#
# DIE DATEI DES HERSTELLERS (N-61).
#
# n8n laeuft so, wie n8n es vorschlaegt. Alles, was von uns kommt - Netz,
# Route, Zertifikat, Anmeldung, Grenzen -, steht daneben in
# docker-compose.override.yml. "docker compose" liest beide von selbst.
#
# Kommt eine neue Fassung von n8n, wird NUR diese Datei angefasst: Nummer
# in image: hoch, fertig. Unsere Zeilen bleiben liegen und koennen nicht
# beim Abschreiben verloren gehen.
#
# EINE Abweichung vom Vorschlag des Herstellers: seine ports: - "5678:5678"
# fehlt hier. Sie wuerde n8n direkt auf dem Server veroeffentlichen, an
# Traefik, an der Ratenbremse und an der Firewall vorbei (CLAUDE.md §19).
# Seit N-103 ist die Abweichung nicht mehr noetig: die override-Datei
# nimmt die Zeile mit "ports: !reset []" wieder weg. Bei der naechsten
# Fassung darf diese Datei also 1:1 die des Herstellers sein.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.121.0   # feste Fassung, nie latest (§19)
    environment:
      # Damit n8n weiss, unter welchem Namen es erreichbar ist - sonst
      # zeigen Weiterleitungen und Webhook-Adressen auf sich selbst.
      N8N_HOST: n8n.prolo.me
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.prolo.me/
      N8N_EDITOR_BASE_URL: https://n8n.prolo.me/
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # Genau ein Proxy davor (Traefik). Ohne das nimmt n8n die
      # Absenderadresse aus einer Kopfzeile, die der Aufrufer selbst
      # mitschickt - dieselbe Falle wie X-Forwarded-For (§11, N-48).
      N8N_PROXY_HOPS: 1
      N8N_RUNNERS_ENABLED: true
      N8N_DIAGNOSTICS_ENABLED: false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
