# /opt/stack/traefik/traefik.yml
#
# Statische Konfiguration. Aenderungen hier brauchen einen Neustart des
# Containers; die dynamische Konfiguration liegt in dynamic/.

api:
  # Aus (B-26). Vorher stand hier "true". Erreichbar war es nicht, weil kein
  # Router mit service: api@internal existiert - also eine scharfe Waffe ohne
  # Abzug, bis jemand beim naechsten Umbau api.insecure ergaenzt oder einen
  # Router anlegt. Dann liegt die vollstaendige Routeruebersicht offen.
  #
  # Wer es braucht: Router mit authentik@file UND Bindung an eine eigene
  # Gruppe (CLAUDE.md §17), nicht nur "angemeldet".
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      # Gilt damit fuer ALLE Router - kein Tool kann die
      # Sicherheitskopfzeilen versehentlich auslassen (B-26).
      #
      # Die Reihenfolge ist Absicht und gemessen (N-44):
      #   1. vertrauensgrenze loescht, was der Client an Identitaet
      #      mitschickt. Am EINGANG, nicht je Router - sonst faellt genau
      #      der Router durch, den jemand ohne Anmeldung anlegt.
      #   2. einlass setzt die Marke, an der ein Werkzeug erkennt, dass die
      #      Anfrage wirklich hier durchgekommen ist. Eigene Datei, weil sie
      #      ein Geheimnis enthaelt - siehe dynamic/einlass.yml.beispiel.
      #   3. sicherheitskopf setzt HSTS und den Rest (B-26).
      #
      # Davor stehen ratenbremse und gleichzeitig (N-46): wer zu schnell
      # oder zu oft gleichzeitig anklopft, soll gar nicht erst bis zur
      # Anmeldung kommen. Beide gemessen je Quelladresse.
      #
      # Eingangs-Middlewares laufen VOR denen eines Routers. Die Anmeldung
      # setzt die geleerten Felder danach mit den echten Werten neu - mit
      # Traefik 3.6.13 gegen einen Echo-Dienst nachgemessen.
      middlewares:
        - ratenbremse@file
        - gleichzeitig@file
        - vertrauensgrenze@file
        - einlass@file
        - sicherheitskopf@file
      tls:
        options: streng@file

providers:
  docker:
    # Nicht mehr direkt am Socket (B-02), sondern ueber den Vermittler, der
    # ausschliesslich lesende Aufrufe durchlaesst.
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    # KEINE Vorgabe mehr (N-45): seit jedes Werkzeug sein eigenes Netz hat,
    # gaebe es kein gemeinsames, auf das eine Vorgabe zeigen koennte. Jeder
    # Dienst nennt sein Netz selbst ueber das Label
    # "traefik.docker.network" - netze-pruefen.sh verlangt es von jedem.
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: awiesner@prolo.me
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

# Zugriffsprotokolle (B-26). Vorher gab es KEINE - nach einem Vorfall liess
# sich nicht rekonstruieren, wer wann was aufgerufen hat.
accessLog:
  filePath: /var/log/traefik/zugriff.log
  format: json
  fields:
    headers:
      # drop als Vorgabe ist wesentlich: CLAUDE.md §22 verlangt, dass
      # X-Authentik-Jwt und Cookie nicht ins Protokoll geraten. Mit drop als
      # Vorgabe gilt das auch fuer Kopfzeilen, die spaeter dazukommen - eine
      # Ausschlussliste waere irgendwann unvollstaendig.
      defaultMode: drop
      names:
        User-Agent: keep
