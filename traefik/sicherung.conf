# /opt/stack/traefik/sicherung.conf
#
# Traefik hatte als EINZIGES Werkzeug gar keine (N-76). backup.sh geht die
# sicherung.conf-Dateien durch - ohne eine wurde traefik schlicht
# uebersprungen, und was von ihm gesichert wurde, stand als fester Block
# im Skript. Ein Toolname im zentralen Skript ist genau das, was der
# Grundsatz verbietet: was ein Werkzeug braucht, sagt das Werkzeug.

# Traefik haelt keine benannten Volumes, nur Bind-Mounts aus diesem Ordner.
VOLUMES=""

DB_CONTAINER=""
DB_USER=""
DB_NAME=""

# acme.json: die Zertifikate ALLER Subdomains samt privater Schluessel.
# Nicht im Git (§21) und nicht wiederherstellbar ausser durch Neuausstellung
# bei Let's Encrypt - und deren Mengengrenzen gelten pro Woche. Ohne "?":
# fehlt die Datei, ist das ernst.
DATEIEN="acme.json"

SQLITE=""

# dynamic/ enthaelt einlass.yml mit der Marke der Vertrauensgrenze (N-44).
# Die Datei ist bewusst nicht im Git; ohne Sicherung gibt es sie nach einem
# Verlust nur neu - und dann muss sie in JEDES Werkzeug nachgezogen werden
# (prolo geheimnisse --verteilen), wobei alle Sitzungen ablaufen.
ORDNER="dynamic"

# Was mit Absicht NICHT gesichert wird. Ohne diese Zeilen beanstandet
# werkzeuge/volumes.py sie - und das soll es auch, solange niemand
# hingeschrieben hat, warum.
VOLUMES_OHNE="traefik.yml|liegt im Git - Konfiguration gehoert dorthin (§23)
logrotate.conf|liegt im Git
log|Betriebsprotokoll - faengt nach einer Wiederherstellung neu an"

HINWEIS="Traefik ist der Eingang: ohne ihn ist KEIN Werkzeug erreichbar.
Beim Wiederherstellen zuerst, und acme.json muss root gehoeren und 0600
sein, sonst liefert Traefik sein Notzertifikat aus (N-05).

Die Konfiguration (traefik.yml, dynamic/*.yml) liegt im Git. Aus der
Sicherung kommen nur die beiden Dinge, die dort NICHT liegen duerfen:
acme.json und dynamic/einlass.yml."
