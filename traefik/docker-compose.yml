services:
  traefik:
    image: traefik:v3.6.13
    container_name: traefik
    restart: unless-stopped
    # Grenzen nach CLAUDE.md §19 (B-29). Traefik steht als einziger
    # Dienst direkt am offenen Netz und verdient sie am meisten.
    mem_limit: 256m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 80 und 443 sind privilegierte Ports - ohne diese Faehigkeit kann
      # Traefik sie im Container nicht belegen und startet nicht.
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # KEIN Docker-Socket mehr (B-02): Traefik fragt die Container ueber den
      # Vermittler in /opt/stack/socket-proxy ab, der nur lesende Aufrufe
      # durchlaesst. ":ro" auf dem Socket waere truegerisch - es schuetzt die
      # Datei, nicht die API dahinter.
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      # WICHTIG: acme.json und log/ muessen root gehoeren.
      #
      # Traefik laeuft im Container als root, aber cap_drop: ALL oben nimmt
      # ihm CAP_DAC_OVERRIDE - die Faehigkeit, mit der root sonst jede
      # Dateirechtepruefung umgeht. Ohne sie gelten fuer root die normalen
      # Rechtebits. Gehoert acme.json einem anderen Nutzer und hat 600,
      # kommt Traefik nicht mehr daran.
      #
      # Die Folge ist kein sichtbarer Absturz, sondern eine Zeile im
      # Protokoll und ein stiller Rueckfall auf das Notzertifikat:
      #   ERR The ACME resolve is skipped from the resolvers list
      #       error="... open /letsencrypt/acme.json: permission denied"
      # Der Browser meldet dann "Nicht sicher" und zeigt
      # CN=TRAEFIK DEFAULT CERT. Am 15.09.2026 genau so passiert.
      #
      #   sudo chown root:root acme.json && sudo chmod 600 acme.json
      #   sudo chown -R root:root log
      - ./acme.json:/letsencrypt/acme.json
      # Zugriffsprotokolle (B-26). Ordner vorher anlegen:
      #   sudo mkdir -p /opt/stack/traefik/log
      # Dazu gehoert eine logrotate-Regel - sonst laeuft der Datentraeger
      # voll. Siehe CLAUDE.md §22.
      - ./log:/var/log/traefik
    networks:
      - proxy
      - socket

networks:
  proxy:
    external: true
  # Wird von /opt/stack/socket-proxy angelegt (internes Netz, kein Weg nach
  # draussen). Darum dort zuerst "docker compose up -d" laufen lassen.
  socket:
    external: true
