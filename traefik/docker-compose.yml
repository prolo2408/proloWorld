services:
  traefik:
    image: traefik:v3.6.13
    container_name: traefik
    restart: unless-stopped
    # Grenzen nach CLAUDE.md §19 (B-29). Traefik steht als einziger
    # Dienst direkt am offenen Netz und verdient sie am meisten.
    mem_limit: 256m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 80 und 443 sind privilegierte Ports - ohne diese Faehigkeit kann
      # Traefik sie im Container nicht belegen und startet nicht.
      - NET_BIND_SERVICE
    # Die einzige ports:-Zeile im ganzen Stack, und sie ist erklaert.
    # Eine ports:-Zeile hebelt Firewall und Anmeldung gleichzeitig aus
    # (CLAUDE.md §19) - bei Traefik ist sie der Eingang selbst. Das Label
    # darunter sagt das, damit ein fehlendes middlewares nicht wie ein
    # vergessenes aussieht (N-59) und "prolo netze" nicht jedes Mal
    # denselben Fehlalarm gibt.
    labels:
      - "prolo.ports=Eingang des Stacks"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # KEIN Docker-Socket mehr (B-02): Traefik fragt die Container ueber den
      # Vermittler in /opt/stack/socket-proxy ab, der nur lesende Aufrufe
      # durchlaesst. ":ro" auf dem Socket waere truegerisch - es schuetzt die
      # Datei, nicht die API dahinter.
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      # WICHTIG: acme.json und log/ muessen root gehoeren.
      #
      # Traefik laeuft im Container als root, aber cap_drop: ALL oben nimmt
      # ihm CAP_DAC_OVERRIDE - die Faehigkeit, mit der root sonst jede
      # Dateirechtepruefung umgeht. Ohne sie gelten fuer root die normalen
      # Rechtebits. Gehoert acme.json einem anderen Nutzer und hat 600,
      # kommt Traefik nicht mehr daran.
      #
      # Die Folge ist kein sichtbarer Absturz, sondern eine Zeile im
      # Protokoll und ein stiller Rueckfall auf das Notzertifikat:
      #   ERR The ACME resolve is skipped from the resolvers list
      #       error="... open /letsencrypt/acme.json: permission denied"
      # Der Browser meldet dann "Nicht sicher" und zeigt
      # CN=TRAEFIK DEFAULT CERT. Am 15.09.2026 genau so passiert.
      #
      #   sudo chown root:root acme.json && sudo chmod 600 acme.json
      #   sudo chown -R root:root log
      - ./acme.json:/letsencrypt/acme.json
      # Zugriffsprotokolle (B-26). Den Ordner legt "prolo einrichten" an
      # (N-91), und ebenso die Drehregel aus logrotate.conf (N-106) -
      # sonst laeuft der Datentraeger voll. Siehe CLAUDE.md §22.
      - ./log:/var/log/traefik
    # Traefik ist der EINZIGE Dienst, der in allen Werkzeugnetzen haengt
    # (N-45). Genau das ist der Punkt: die Werkzeuge erreichen einander
    # nicht mehr, nur Traefik erreicht sie.
    #
    # Kommt ein Werkzeug dazu, gehoert sein Netz hier UND unten hinein -
    # sonst findet Traefik es nicht und der Router bleibt tot.
    # werkzeuge/netze-pruefen.sh haelt die Listen zusammen.
    networks:
      - netz-admin
      - netz-wiki
      - netz-www
      - netz-bordbuch
      - netz-n8n
      - netz-authentik
      - socket

networks:
  # Je Werkzeug eines. Angelegt und hier eingetragen wird es von
  #   sudo prolo netze anlegen netz-<werkzeug>
  # - das schreibt BEIDE Stellen (oben beim Dienst und hier) und legt das
  # Netz im Docker an. Wer es von Hand macht und eine Stelle vergisst,
  # bekommt einen toten Router ohne Fehlermeldung (N-62).
  netz-admin:
    external: true
  netz-wiki:
    external: true
  netz-www:
    external: true
  netz-bordbuch:
    external: true
  netz-n8n:
    external: true
  netz-authentik:
    external: true
  # Wird von /opt/stack/socket-proxy angelegt (internes Netz, kein Weg nach
  # draussen). Darum dort zuerst "docker compose up -d" laufen lassen.
  socket:
    external: true
