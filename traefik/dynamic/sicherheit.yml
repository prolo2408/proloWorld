# /opt/stack/traefik/dynamic/sicherheit.yml
#
# Sicherheitskopfzeilen und TLS-Vorgaben (B-26). Vorher setzte weder Traefik
# noch ein Tool Strict-Transport-Security, Referrer-Policy oder
# Permissions-Policy, und es gab keine TLS-Mindestfassung - damit liess
# Traefik auch TLS 1.0 und 1.1 zu.
#
# Eingebunden wird das in traefik.yml am websecure-Eingang, damit es fuer
# alle Router gilt.

http:
  middlewares:
    sicherheitskopf:
      headers:
        # Ohne HSTS ist bei jedem ERSTaufruf ein Abfangen ueber HTTP
        # moeglich, obwohl auf HTTPS umgeleitet wird.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        # preload erst setzen, wenn ALLE Subdomains sicher laufen - der
        # Eintrag in die Preload-Liste ist nur schwer rueckgaengig zu machen.
        stsPreload: false
        contentTypeNosniff: true
        browserXssFilter: false          # veraltet, die CSP leistet das
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          Permissions-Policy: "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
          # Traefik verraet sonst seine Fassung an jeden Aufrufer.
          Server: ""
          X-Powered-By: ""

# ------------------------------------------------------------------------
# Die Vertrauensgrenze (N-44)
#
# Alles, was ein Werkzeug ueber seinen Aufrufer weiss, steht in
# X-Authentik-* (CLAUDE.md §17). Wer diese Kopfzeilen setzen kann, IST
# damit, wen er will - gemessen am Wiki: dieselbe Anfrage bekam mit
# "X-Authentik-Groups: wiki-admin" die Verwaltungsdaten und ohne Gruppe
# eine 403. Die Rechtepruefung war also in Ordnung, das Vertrauen in die
# Kopfzeile nicht.
#
# Diese Middleware haengt am EINGANG (traefik.yml, entryPoints.websecure)
# und gilt damit fuer JEDEN Router - auch fuer die ohne Anmeldung, wie die
# Webhook-Route von n8n. Genau dort waere sonst die Luecke: ein Router ohne
# authentik@file reicht durch, was der Client schickt.
#
# Ein leerer Wert LOESCHT die Kopfzeile. Gemessen mit Traefik 3.6.13 gegen
# einen Echo-Dienst:
#   Client schickt "X-Authentik-Groups: wiki-admin"  -> Backend sieht nichts
#   danach setzt authentik@file die echten Werte     -> Backend sieht die echten
# Die Reihenfolge stimmt also: Eingangs-Middlewares laufen VOR denen des
# Routers, die Anmeldung ueberschreibt die geleerten Felder wieder.
#
# Die Liste muss zu authResponseHeaders in authentik.yml passen: jede
# Kopfzeile, die Authentik setzen darf, gehoert hier vorher geleert.
# werkzeuge/grenze-pruefen.sh haelt die beiden Listen zusammen.
    vertrauensgrenze:
      headers:
        customRequestHeaders:
          X-Authentik-Username: ""
          X-Authentik-Groups: ""
          X-Authentik-Email: ""
          X-Authentik-Name: ""
          X-Authentik-Uid: ""
          X-Authentik-Jwt: ""
          X-Authentik-Meta-Jwks: ""
          X-Authentik-Meta-Outpost: ""
          X-Authentik-Meta-Provider: ""
          X-Authentik-Meta-App: ""
          X-Authentik-Meta-Version: ""
          # Auch die eigene Marke: sie wird gleich danach von einlass@file
          # gesetzt. Fehlt diese Datei einmal, ist die Kopfzeile wenigstens
          # leer statt vom Client bestimmt.
          X-Prolo-Einlass: ""

# ------------------------------------------------------------------------
# Die Ratenbremse (N-46)
#
# Es gab keine. Weder vor der Anmeldung noch vor den Werkzeugen konnte
# jemand ausgebremst werden, der in Schleife anklopft - Anmeldenamen raten,
# Pfade absuchen, oder einfach einen kleinen Server mit Anfragen zudecken.
#
# Was sie leistet und was nicht, damit niemand sich auf das Falsche
# verlaesst:
#
#   SIE BREMST   eine einzelne Quelle auf DAUER: 50 Anfragen je Sekunde.
#                Das ist der Wert, der ein Skript in Schleife ausbremst,
#                und er ist seit N-46 unveraendert.
#   SIE LAESST   einen einzelnen Seitenaufbau durch: burst ist der Vorrat
#                fuer den Moment, in dem ein Browser eine ganze Oberflaeche
#                auf einmal holt. 700 statt 150 (N-79).
#   SIE BREMST   gleichzeitige Anfragen je Quelle. 200 statt 40 (N-79).
#   SIE BREMST NICHT ein verteiltes Raten von vielen Adressen aus. Dagegen
#                hilft nur, dass es nichts zu raten gibt: die Anmeldung
#                macht Authentik, und Zugangslinks sind 192 Bit lang.
#
# Warum burst und amount so viel groesser sind als frueher (N-79): beide
# Werte waren am Wiki bemessen - einer Seite, die fertig vom Server kommt
# und rund 15 Anfragen braucht. n8n, Vaultwarden und die Anmeldeoberflaeche
# von Authentik bauen ihre Oberflaeche dagegen erst im Browser zusammen und
# holen dafuer ein paar hundert Teile auf einmal. Gemessen mit einem
# echten Chromium gegen einen Nachbau dieser beiden Middlewares:
#
#   Seite mit 200 Teilen  ->   0 abgewiesen, Oberflaeche nach 1,6s da
#   Seite mit 300 Teilen  ->  28 abgewiesen, Oberflaeche SCHWARZ
#   Seite mit 400 Teilen  ->  97 abgewiesen, Oberflaeche SCHWARZ
#   Seite mit 600 Teilen  -> 219 abgewiesen, Oberflaeche SCHWARZ
#
# und in der Spitze feuert ein einzelner Browser dabei 134 Anfragen in
# einer Sekunde. Vier abgewiesene von 300 genuegen schon: fehlt ein Teil,
# wird die Oberflaeche nicht gebaut. Beim zweiten Aufruf liegt alles im
# Browserspeicher, es kommen kaum noch Anfragen an - darum sah es aus, als
# helfe "einmal neu laden".
#
# Mit burst 700 kamen dieselben vier Seiten ohne eine einzige Abweisung
# durch (1,7s / 2,4s / 3,2s / 4,9s bis zur Oberflaeche).
#
# average bleibt bei 50, und das ist der Punkt: burst ist ein EINMALIGER
# Vorrat, der sich mit average wieder fuellt. Wer in Schleife anklopft,
# haengt danach genau wie vorher bei 50 Anfragen je Sekunde fest - die
# Dauerbremse ist unveraendert, nur der erste Schwung ist groesser.
#
# sourceCriterion steht ausdruecklich da und nicht als Vorgabe (wie bei
# traefik.docker.network seit N-45): dass "je Quelladresse" gemessen wird,
# stand vorher nur im Kommentar. Eine Vorgabe, auf die man sich verlaesst,
# ohne sie hinzuschreiben, ist eine Annahme. depth 0 heisst: die echte
# Gegenstelle, nicht eine Kopfzeile, die der Aufrufer selbst mitschickt
# (dieselbe Falle wie X-Forwarded-For, §11 und N-48).
    ratenbremse:
      rateLimit:
        average: 50
        burst: 700
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0
    gleichzeitig:
      inFlightReq:
        amount: 200
        sourceCriterion:
          ipStrategy:
            depth: 0

tls:
  options:
    streng:
      minVersion: VersionTLS12
      # sniStrict: eine Anfrage ohne passenden Servernamen bekommt KEIN
      # Standardzertifikat mehr. Zusammen mit B-27 ist damit der Weg zu
      # einer Taeuschungsseite auf einem fremden Hostnamen zu.
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP256
        - X25519
