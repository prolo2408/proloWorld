# ProloWelt - Traefik, dynamischer Teil
#
# "prolo einrichten" kopiert diese Datei nach /var/lib/prolo/traefik/dynamic/.
# Eigene Ergaenzungen dort als lokal-<name>.yml ablegen - die bleiben stehen.
#
# Am Eingang (websecure) haengen fuer JEDEN Router, in dieser Reihenfolge:
#   ratenbremse, gleichzeitig  wer zu schnell anklopft, kommt nicht weiter
#   vertrauensgrenze           loescht mitgeschickte X-Authentik-* Kopfzeilen
#   sicherheitskopf            HSTS und Co.
# Die Anmeldung (authentik) haengt ein Tool selbst an seinen Router - prolo
# tut das von sich aus, ausser bei "--anmeldung keine".

http:
  middlewares:
    # Forward-Auth gegen den eingebauten Outpost von Authentik. Welche
    # Domain er schuetzt, legt der Blueprint in authentik/blueprints/ fest.
    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        # false: Traefik setzt X-Forwarded-* selbst aus der echten
        # Verbindung. Mit true koennte ein Aufrufer das Ziel der
        # Rueckleitung nach der Anmeldung bestimmen (offene Weiterleitung).
        trustForwardHeader: false
        # Authentik antwortet hier mit einer Weiterleitung oder leer - mehr
        # als 1 MiB ist ein Fehler, keine Antwort (Traefik warnt sonst).
        maxResponseBodySize: 1048576
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # Wer diese Kopfzeilen selbst mitschickt, waere sonst, wer er will - auch
    # an einem Router OHNE Anmeldung. Ein leerer Wert loescht die Kopfzeile;
    # authentik@file setzt danach die echten Werte. Die Liste muss alles
    # enthalten, was oben unter authResponseHeaders steht
    # (tests/test_kern.py prueft das).
    vertrauensgrenze:
      headers:
        customRequestHeaders:
          X-authentik-username: ""
          X-authentik-groups: ""
          X-authentik-entitlements: ""
          X-authentik-email: ""
          X-authentik-name: ""
          X-authentik-uid: ""
          X-authentik-jwt: ""
          X-authentik-meta-jwks: ""
          X-authentik-meta-outpost: ""
          X-authentik-meta-provider: ""
          X-authentik-meta-app: ""
          X-authentik-meta-version: ""

    sicherheitskopf:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Permissions-Policy: "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
          Server: ""
          X-Powered-By: ""

    # Je Quelladresse (depth 0 = die echte Gegenstelle, keine Kopfzeile).
    # average ist die Dauerbremse, burst der einmalige Vorrat fuer einen
    # Seitenaufbau: Oberflaechen wie Authentik holen beim ersten Aufruf ein
    # paar hundert Teile auf einmal. Gegen Raten von vielen Adressen hilft
    # das nicht - dagegen hilft nur die Anmeldung davor.
    ratenbremse:
      rateLimit:
        average: 50
        burst: 700
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0
    gleichzeitig:
      inFlightReq:
        amount: 200
        sourceCriterion:
          ipStrategy:
            depth: 0

tls:
  options:
    # "default" gilt fuer jeden Router. sniStrict: ein fremder Name bekommt
    # keinen Handschlag mit dem Notzertifikat, sondern gar keinen.
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - CurveP256
        - X25519
