# traefik/logrotate.conf
#
# Zugriffsprotokolle drehen (B-26). Ohne das laeuft der Datentraeger voll -
# json-Zeilen je Aufruf summieren sich schnell.
#
# Eingetragen wird die Regel von "sudo prolo einrichten" als
# /etc/logrotate.d/prolo-traefik, mit dem echten Stapel statt @STACK@
# (N-106). Vorher stand hier ein ln -sf zum Abtippen - und auf keinem
# Server war es abgetippt. Probelauf:
#   sudo logrotate -d /etc/logrotate.d/prolo-traefik
#
# CLAUDE.md §22: in den Protokollen stehen keine Geheimnisse und keine
# vollstaendigen Kopfzeilen - dafuer sorgt defaultMode: drop in traefik.yml.
# Trotzdem sind es Zugriffsdaten und werden nicht ewig aufbewahrt.

@STACK@/traefik/log/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        # Traefik haelt die Datei offen. USR1 laesst es neu oeffnen, ohne
        # den Dienst anzuhalten.
        docker kill --signal=USR1 traefik >/dev/null 2>&1 || true
    endscript
}
