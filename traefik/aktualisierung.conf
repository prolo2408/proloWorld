# /opt/stack/traefik/aktualisierung.conf

TYP="image"

# Bewusst leer. Traefik hat keinen Pfad, den man ohne Weiteres abfragen
# koennte: das Dashboard ist aus (B-26) und ping ist nicht eingeschaltet.
# Ein Aufruf von "/" beantwortet Traefik mit 404, weil kein Router passt -
# das waere eine Pruefung, die bei einem gesunden Traefik fehlschlaegt.
#
# Geprueft wird daher nur, dass der Container laeuft und nicht staendig neu
# startet. Wer mehr will, schaltet in traefik.yml "ping: {}" auf einem
# internen Einstiegspunkt ein und traegt ihn hier ein - dann aber auch
# dafuer sorgen, dass er nicht nach draussen zeigt.
PRUEF_URL=""

# Traefik ist sofort da; es laedt nur seine Konfiguration.
PRUEF_WARTEN=20
