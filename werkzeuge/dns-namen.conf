# werkzeuge/dns-namen.conf
#
# Zusaetzliche Namen fuer "prolo dns" und "prolo status" - solche, die zum
# Server gehoeren, aber in keiner Traefik-Regel stehen. Die Namen AUS den
# Regeln werden ohnehin geprueft und muessen hier nicht stehen.
#
# Eine Zeile je Name, # ist ein Kommentar. Leer lassen ist in Ordnung.
#
# Sinnvoll fuer Subdomains, die gerade eingerichtet werden, oder solche, von
# denen man wissen will, ob sie versehentlich auf DynDNS umgesprungen sind.
# Beispiel:
#   auth.prolo.me
#   test.prolo.me
