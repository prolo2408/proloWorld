# werkzeuge/crowdsec-probe - NUR FUER DIE PROBE (F-01), steht fuer crowdsecurity/traefik-logs (JSON) aus dem
# Hub und setzt dieselben Felder, auf die unsere Regeln schauen.
filter: "evt.Parsed.program == 'traefik'"
onsuccess: next_stage
name: prolo-probe/traefik
description: "Stellvertreter fuer crowdsecurity/traefik-logs"
nodes:
  - filter: "UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, 'traefik') in ['', nil]"
    statics:
      - meta: log_type
        value: http_access-log
      - meta: service
        value: http
      - meta: source_ip
        expression: "evt.Unmarshaled.traefik.ClientHost"
      - meta: http_status
        expression: "Sprintf('%v', evt.Unmarshaled.traefik.DownstreamStatus)"
      - meta: http_path
        expression: "evt.Unmarshaled.traefik.RequestPath"
      - meta: http_verb
        expression: "evt.Unmarshaled.traefik.RequestMethod"
      - target: evt.StrTime
        expression: "evt.Unmarshaled.traefik.time"
