# /opt/stack/admin/sicherung.conf

# Die Datenbank haelt nur, wer welche Darstellung eingestellt hat. Sie ist
# nicht wertvoll - aber sie mitzunehmen kostet nichts, und ein Werkzeug
# ohne sicherung.conf faellt aus der zentralen Sicherung heraus.
VOLUMES="admin_admin_daten"

DB_CONTAINER=""
DB_USER=""
DB_NAME=""

DATEIEN="?.env"

SQLITE="admin:/daten/admin.db"

ORDNER=""

HINWEIS="Lesende Uebersicht ueber den Stack. Haelt KEINE eigenen Daten
ausser der Themenwahl je Nutzer.
ANMELDUNG: Authentik davor UND Gruppe 'admin' im Werkzeug selbst.
DOCKER: liest ueber den Vermittler socket-proxy, ausschliesslich
/containers/json und /networks. Der Vermittler laesst POST nicht durch -
von hier aus laesst sich nichts starten oder anhalten. Soll das je
kommen, gehoert dazu ein EIGENER Vermittler mit genau diesem einen
Aufruf, nicht POST: 1 im gemeinsamen.
OHNE ANMELDUNG erreichbar: /gesundheit und /api/version (§19). Beide
geben nichts Schuetzenswertes aus."
