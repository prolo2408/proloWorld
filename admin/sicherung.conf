# /opt/stack/admin/sicherung.conf

# Die Datenbank haelt nur, wer welche Darstellung eingestellt hat. Sie ist
# nicht wertvoll - aber sie mitzunehmen kostet nichts, und ein Werkzeug
# ohne sicherung.conf faellt aus der zentralen Sicherung heraus.
#
# Das Auftragsbuch (A-01): erledigt/ haelt, wer wann was angestossen hat,
# und die Ausgabe dazu - das gehoert gesichert. eingang/ ist eine
# Warteschlange, in der ein Auftrag Sekunden liegt.
VOLUMES="admin_admin_daten"

DB_CONTAINER=""
DB_USER=""
DB_NAME=""

DATEIEN="?.env"

SQLITE="admin:/daten/admin.db"

ORDNER="auftraege/erledigt"

VOLUMES_OHNE="auftraege/eingang|Warteschlange - ein Auftrag liegt dort Sekunden, bis der Ausfuehrer ihn nimmt"

HINWEIS="Verwaltungsseite des Stacks.
ANMELDUNG: Authentik davor UND im Werkzeug selbst die Gruppe 'admin'
(sehen) bzw. 'admin-betrieb' (bedienen, Protokolle).
DOCKER: liest ueber den Vermittler socket-proxy - Container, Netze,
Protokolle. Der Vermittler laesst POST nicht durch.
BEDIENEN: ueber das Auftragsbuch (A-01). Die Seite legt Auftraege in
auftraege/eingang ab; auf dem Server fuehrt werkzeuge/auftrag.py sie aus
(systemd: prolo-auftraege.path), nur ueber prolo und nur, was dort in
ARTEN steht. Wer wann was: auftraege/erledigt/protokoll.jsonl, und
auf dem Server: python3 werkzeuge/auftrag.py liste
OHNE ANMELDUNG erreichbar: /gesundheit und /api/version (§19). Beide
geben nichts Schuetzenswertes aus."
