/* Der Pflichtteil aus EINRICHTUNG.md, mit den beiden Korrekturen aus N-06
   und N-07: das Thema gilt ab dem ersten Anstrich, und der Textdurchlauf
   laesst script und style aus. Dazu die Verweise auf andere Wiki-Seiten:
   die Seite navigiert nicht selbst, sie bittet die Huelle. */
const ED_PFLICHTTEIL = [
'<' + 'script>',
'/* Pflichtteil jeder Wiki-Seite: auf die Huelle hoeren. */',
'(function(){',
ED_RECHENWERK,
'  /* Bis die Nachricht der Huelle kommt, gilt die Einstellung des Geraets -',
'     sonst blitzt bei hellem Wiki kurz die dunkle Fassung auf. */',
'  document.body.dataset.theme =',
"    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)",
"      ? 'dark' : 'light';",
'  /* ---- Fundstellen markieren ----',
'     Zwei Aufgaben teilen sich denselben Code: der Sprung aus einem',
'     Suchtreffer (wiki-springen) und die Suche IN dieser Seite',
'     (wiki-finden). Darum steht das Markieren hier einmal. */',
'  var FUNDE = [], FUND_NR = -1, FUND_WORT = null;',
'  function markenSetzen(begriff){',
"    document.querySelectorAll('mark.wiki-fund').forEach(function(m){",
'      var eltern = m.parentNode;',
'      m.replaceWith(document.createTextNode(m.textContent));',
'      /* Nachbarn wieder zusammenlegen. Ohne das zerfaellt der Text mit',
'         jedem Lauf in mehr Knoten, und ein Wort, das ueber eine alte',
'         Marke hinweggeht, waere danach nicht mehr zu finden. */',
'      if(eltern) eltern.normalize();',
'    });',
'    FUNDE = []; FUND_NR = -1;',
'    if(!begriff || begriff.length < 2) return [];',
'    var worte = begriff.split(/\\s+/).filter(function(w){ return w.length > 1; });',
'    if(!worte.length) return [];',
"    var re = new RegExp('(' + worte.map(function(w){",
"      return w.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'); }).join('|') + ')', 'gi');",
'    /* script und style ueberspringen: deren Text ist kein Inhalt, und eine',
'       Marke darin hat kein Layout - scrollIntoView tut dann nichts und der',
'       Sprung landet oben auf der Seite statt an der Fundstelle. */',
'    var lauf = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {',
'      acceptNode: function(k){',
'        var e = k.parentElement;',
'        while(e){',
"          if(e.tagName === 'SCRIPT' || e.tagName === 'STYLE')",
'            return NodeFilter.FILTER_REJECT;',
'          e = e.parentElement;',
'        }',
'        return NodeFilter.FILTER_ACCEPT;',
'      }});',
'    var knoten = [], n;',
'    /* lastIndex zuruecksetzen: ein Muster mit /g merkt sich, wo es zuletzt',
'       getroffen hat, und test() sucht beim naechsten Aufruf erst dahinter.',
'       Zwei benachbarte Textknoten mit demselben Wort - ohne Leerraumknoten',
'       dazwischen - verlieren so den zweiten Treffer (N-26). Gemessen an',
'       einer Seite mit <b>... tcp</b>tcp: zwei Vorkommen, eine Marke. */',
'    while((n = lauf.nextNode())){',
'      re.lastIndex = 0;',
'      if(re.test(n.nodeValue)) knoten.push(n);',
'    }',
'    knoten.forEach(function(k){',
"      var h = document.createElement('span');",
'      h.innerHTML = k.nodeValue.replace(/[&<>]/g, function(c){',
"        return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; })",
'        .replace(re, \'<mark class="wiki-fund">$1</mark>\');',
'      /* Die Marken kommen OHNE Huelle in den Text: ein zusaetzliches',
'         <span> um jede Fundstelle bliebe nach dem Aufraeumen stehen und',
'         zerschnitte den Text dauerhaft. */',
'      var stueck = document.createDocumentFragment();',
'      while(h.firstChild) stueck.appendChild(h.firstChild);',
'      k.replaceWith(stueck);',
'    });',
"    return [].slice.call(document.querySelectorAll('mark.wiki-fund'));",
'  }',
'  function springen(anker, begriff){',
'    if(anker){',
'      var el = document.getElementById(anker);',
"      if(el) el.scrollIntoView({block:'start'});",
'    }',
'    FUNDE = markenSetzen(begriff);',
"    FUND_WORT = begriff ? String(begriff) : null;",
'    if(FUNDE.length && !anker) FUNDE[0].scrollIntoView({block:\'center\'});',
'  }',
'  /* ---- In dieser Seite suchen ----',
'     Die Huelle kann in der Seite nicht selbst suchen: eigener, opaker',
'     Origin. Sie schickt den Begriff und die Nummer der gewuenschten',
'     Stelle, die Seite markiert, springt hin und meldet zurueck, wie viele',
'     es sind und wo sie steht. */',
'  function fundeMelden(){',
'    if(window.parent === window) return;',
'    var m = FUND_NR >= 0 ? FUNDE[FUND_NR] : null;',
"    var teil = m && m.closest ? m.closest('section[id]') : null;",
"    var kopf = teil ? teil.querySelector('h1,h2,h3') : null;",
"    window.parent.postMessage({typ:'wiki-funde',",

"      abschnitt: kopf ? (kopf.textContent || '').slice(0, 80) : ''}, '*');",

'    if(begriff !== FUND_WORT){',
'      FUNDE = markenSetzen(begriff);',
'      FUND_WORT = begriff;',
'    }',
'    if(!FUNDE.length){ FUND_NR = -1; return fundeMelden(); }',
'    var z = FUNDE.length;',
'    FUND_NR = ((Number(nr) || 0) % z + z) % z;',
'    for(var i = 0; i < z; i++)',
"      FUNDE[i].classList.toggle('wiki-jetzt', i === FUND_NR);",
'    var m = FUNDE[FUND_NR];',

'      d = d.parentElement && d.parentElement.closest',
"        ? d.parentElement.closest('details:not([open])') : null;",
'    }',

'    fundeMelden();',
'  }',
"  window.addEventListener('message', function(e){",
'    /* Die Seite laeuft in einem opaken Origin (Sandbox ohne',
'       allow-same-origin). location.origin ist darum "null" und taugt nicht',
'       als Vergleich - geprueft wird, dass die Nachricht vom eigenen',
'       Elternfenster kommt. */',
'    if(e.source !== window.parent || !e.data) return;',
"    if(e.data.typ === 'wiki-springen') springen(e.data.anker, e.data.begriff);",
"    if(e.data.typ === 'wiki-finden') finden(e.data.begriff, e.data.nr);",
'    if(e.data.thema) document.body.dataset.theme = e.data.thema;',
'  });',
'  /* Verweis auf eine andere Wiki-Seite. */',
"  document.addEventListener('click', function(e){",
"    var b = e.target.closest ? e.target.closest('button.verweis[data-slug]') : null;",
'    if(!b) return;',
'    if(window.parent !== window)',
"      window.parent.postMessage({typ:'wiki-oeffnen', slug:b.dataset.slug}, '*');",
'  });',
'  /* Dem Wiki melden, was auf dieser Seite wirklich steht: der Server kann',
'     kein JavaScript, Inhalte die erst hier entstehen waeren sonst nicht',
'     auffindbar. Gleicher Text loest keinen Indexlauf aus. */',
'  function textMelden(){',
'    if(window.parent === window) return;',
'    try {',
"      var t = (document.body.innerText || '').replace(/\\s+/g, ' ').trim();",
"      if(t) window.parent.postMessage({typ:'wiki-text', text:t.slice(0, 200000)}, '*');",
'    } catch(e){}',
'  }',
"  window.addEventListener('load', function(){",

'    setTimeout(textMelden, 2500);',
'  });',

"  document.addEventListener('click', function(e){",
"    var b = e.target.closest ? e.target.closest('[data-wiki-pdf]') : null;",

'    var quelle = document.getElementById(b.dataset.wikiPdf);',

'        wo.appendChild(hin);',
'      }',

'    }',
'    if(window.parent === window) return;',
"    window.parent.postMessage({typ:'wiki-pdf', datei:name,",

function edListe(s){
  return String(s || '').split(',').map(x => x.trim()).filter(Boolean);
}
function edPfadListe(s){
  return String(s || '').split(/[/›>]/).map(x => x.trim()).filter(Boolean);
}
function edSeiteBauen(e){
  const heute = new Date().toISOString().slice(0, 10);
  const absch = (e.abschnitte || []).map(a => {
    const x = {
      anker: String(a.anker || '').trim(),
      titel: String(a.titel || '').trim(),
      stichworte: edListe(a.stichworte),
      text: edNurText(a.markup),
      markup: String(a.markup || '')
    };
    /* Die Gruppe nur, wenn es eine gibt - ein leeres Feld in jedem
       Abschnitt macht den Meta-Block nur laenger. */
    const g = String(a.gruppe || '').trim();
    if(g) x.gruppe = g;
    return x;
  });
  const meta = {
    slug: String(e.slug || '').trim(),
    titel: String(e.titel || '').trim(),
    kurz: String(e.kurz || '').trim(),
    pfad: edPfadListe(e.pfad),
    gruppen: edListe(e.gruppen),
    stand: e.stand || heute,
    werkzeug: EDITOR_WERKZEUG,
    abschnitte: absch
  };
  const koerper = absch.map(a =>
    '<section id="' + edEscape(a.anker) + '">\n      <h2>' + edEscape(a.titel) +
    '</h2>\n      ' + edBloecke(a.markup) + '\n    </section>').join('\n\n    ');
  /* Anhaenge: je PDF-Block ein Skriptblock mit der Marke data-wiki-anhang.
     Ist eine Datei neu dabei, steht sie als Base64 darin und der Server
     gliedert sie aus (die Marke sagt: das ist ausdruecklich ein Anhang, egal
     wie gross). Liegt sie schon auf dem Server, bleibt der Block leer und
     nennt nur ihren Namen - damit die Seite ihn weiter nennt und die
     Registrierung nicht verliert (N-18). */
  const anhaenge = [];
  (e.abschnitte || []).forEach(a => (a.bloecke || []).forEach(b => {
    if(b.art !== 'pdf' || !b.kennung) return;
    if(b.daten64){
      anhaenge.push('<' + 'script type="text/plain" id="' + edEscape(b.kennung) +
        '" data-wiki-anhang="">' + b.daten64 + '<' + '/script>');
    } else if(b.dateiname){
      anhaenge.push('<' + 'script type="text/plain" id="' + edEscape(b.kennung) +
        '" data-wiki-anhang="' + edEscape(b.dateiname) + '"><' + '/script>');
    }
  }));
  /* Anhaenge, die aus einer geladenen Datei stammen und zu keinem Block
     gehoeren - z. B. Bilder einer von Hand gebauten Seite. Sie muessen
     weiter genannt werden, sonst verlieren sie beim Speichern ihre Zeile
     (N-18). */
  (e.fremdeAnhaenge || []).forEach(a =>
    anhaenge.push('<' + 'script type="text/plain" id="' + edEscape(a.kennung) +
      '" data-wiki-anhang="' + edEscape(a.name) + '"><' + '/script>'));
  return [
    '<!DOCTYPE html>',
    '<html lang="de">',
    '<head>',
    '<meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1">',
    '<title>' + edEscape(meta.titel) + '</title>',
    '',
    '<' + 'script type="application/json" id="wiki-meta">',
    JSON.stringify(meta, null, 2),
    '<' + '/script>',
    '',
    '<style>',
    ED_STIL,
    '</style>',
    '</head>',
    '<body data-theme="dark">',
    '',
    '    ' + koerper,
    '',
    anhaenge.join('\n'),
    ED_PFLICHTTEIL,
    '</body>',
    '</html>',
    ''
  ].join('\n');
}

/* Der Kasten dazu: Thema eintippen, Prompt kopieren. Das Kopieren laeuft
   ueber die Zwischenablage; wo der Browser das verweigert (kein sicherer
   Kontext, Berechtigung abgelehnt), wird der Text sichtbar und markiert -
   dann geht es von Hand weiter, statt still zu scheitern. */
function kiKasten(){
  return `
    <details class="karte" id="ki-karte">
      <summary style="cursor:pointer;font-weight:600">Eine KI schreiben
        lassen</summary>
      <div class="kontext" style="margin-top:8px">Du bekommst einen Prompt
        zum Kopieren. Gib ihn einer KI, und sie antwortet mit einer Datei,
        die hier oben unter <em>Ich habe schon eine HTML-Datei</em> hineinpasst.
        Die Gestaltung macht das Wiki — die KI schreibt nur den Inhalt.</div>
      <div style="margin-top:12px">
        <label class="label" for="ki-thema">Worum soll es gehen?</label>
        <input type="text" id="ki-thema" maxlength="200"
               placeholder="z. B. Drucker im zweiten Stock einrichten">
        <div class="ed-merke">Freiwillig. Ohne Thema steht im Prompt eine
          Stelle, die du selbst ausfüllst.</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button type="button" class="knopf" id="ki-kopieren">Prompt
          kopieren</button>
        <button type="button" class="knopf rahmen" id="ki-zeigen">Prompt
          ansehen</button>
      </div>
      <label class="label" for="ki-text" id="ki-text-label" hidden
        style="margin-top:12px">Der Prompt — alles markieren und kopieren</label>
      <textarea id="ki-text" class="mono" rows="14" readonly hidden
        aria-labelledby="ki-text-label" spellcheck="false"></textarea>
    </details>`;
}
function kiVerdrahten(){
  const karte = $('ki-karte');
  if(!karte) return;
  const feld = $('ki-text'), marke = $('ki-text-label');
  const fuellen = () => { feld.value = kiPrompt($('ki-thema').value); };
  const zeigen = () => {
    fuellen();
    feld.hidden = false; marke.hidden = false;
    feld.focus(); feld.select();
  };
  $('ki-zeigen').onclick = zeigen;
  $('ki-kopieren').onclick = async () => {
    fuellen();
    const text = feld.value;
    try {
      if(!navigator.clipboard) throw new Error('keine Zwischenablage');
      await navigator.clipboard.writeText(text);
      einblenden('Prompt kopiert — ' + zahl(text.length) +
                 ' Zeichen. Jetzt in die KI einfügen.');
    } catch(e){
      zeigen();
      einblenden('Die Zwischenablage war nicht erreichbar. Der Prompt steht ' +
                 'jetzt offen da und ist markiert — mit Strg+C kopieren.', 7000);
    }
  };
}

  ['?&gt; Text', 'grüner Kasten „gut zu wissen"'],

/* ---------------------------------------------------- Blockmodell
   Der Editor arbeitet blockweise: ein Abschnitt ist eine Liste von Bloecken,
   jeder Block hat ein kleines Formular und direkt daneben sein fertiges
   Ergebnis. Gespeichert wird trotzdem das Markup mit den drei Doppelpunkten
   (:::art ... :::) - damit bleibt die Seite lesbar, der Rundlauf ueber
   "Bearbeiten" gilt weiter, und der Erzeuger der Seite bleibt unveraendert.

   Hier stehen nur die beiden Uebersetzungen zwischen den zwei Formen. */

const ED_FORM = {
  text:      {name:'Text', hilfe:'Absätze, Titel, Listen, Kästen, Tabellen.'},
  rechner:   {name:'Rechner', hilfe:'Felder und eine Formel. Rechnet beim Leser mit.'},
  schritte:  {name:'Schritte', hilfe:'Nummerierte Abfolge.',
              spalten:['Schritt', 'Erklärung']},
  kennzahlen:{name:'Kennzahlen', hilfe:'Werte groß nebeneinander.',
              spalten:['Name', 'Wert', 'Zusatz']},
  gegenueber:{name:'Gegenüberstellung', hilfe:'Zwei bis vier Seiten nebeneinander.',
              spalten:['Seite', 'Inhalt']},
  begriffe:  {name:'Begriffsliste', hilfe:'Wort und Erklärung zum Nachschlagen.',
              spalten:['Begriff', 'Erklärung']},
  klapp:     {name:'Klapptext', hilfe:'Überschrift, die man aufklappt.'},
  pdf:       {name:'PDF', hilfe:'Ein PDF als Anhang, mit Sprungzielen auf einzelne Seiten.',
              spalten:['Beschriftung', 'Seite']}
};

function edBlockNeu(art){
  const b = {art: art, titel: '', text: '', zeilen: [], felder: [],
             formel: '', einheit: '', hinweis: ''};
  const f = ED_FORM[art] || {};
  if(f.spalten) b.zeilen = [f.spalten.map(() => ''), f.spalten.map(() => '')];
  if(art === 'rechner'){
    b.felder = [{name: '', wert: ''}, {name: '', wert: ''}];
  }
  if(art === 'pdf'){
    /* kennung  = die Kennung des Skriptblocks in der Seite (id)
       dateiname = wie der Anhang auf dem Server heisst, sobald er dort liegt
       daten64  = die Datei selbst, nur bis zum naechsten Speichern */
    b.kennung = ''; b.dateiname = ''; b.daten64 = ''; b.urname = '';
    b.zeilen = [['', '']];
  }
  return b;
}

function edMarkupZuBloecken(markup){
  /* Markup einlesen. Alles, was kein :::-Baustein ist, wird ein Textblock -
     und zwar zusammenhaengend, damit Absaetze nicht zerfallen. */
  const zeilen = String(markup || '').split('\n');
  const aus = [];
  let text = [];
  const textAbschliessen = () => {
    const t = text.join('\n').replace(/^\s+|\s+$/g, '');
    if(t){ const b = edBlockNeu('text'); b.text = t; aus.push(b); }
    text = [];
  };
  for(let i = 0; i < zeilen.length; i++){
    const m = zeilen[i].match(/^:::([a-zäöüß]+)\s*(.*)$/i);
    if(!m){ text.push(zeilen[i]); continue; }
    textAbschliessen();
    const inhalt = [];
    i++;
    while(i < zeilen.length && zeilen[i].trim() !== ':::'){ inhalt.push(zeilen[i]); i++; }
    aus.push(edBlockLesen(m[1].toLowerCase(), m[2] || '', inhalt));
  }
  textAbschliessen();
  return aus.length ? aus : [edBlockNeu('text')];
}

function edBlockLesen(art, titel, zeilen){
  /* Aus den Zeilen eines Bausteins wieder Formularfelder machen. Eine
     unbekannte Art bleibt als Text erhalten, statt beim Bearbeiten
     verschluckt zu werden. */
  if(!ED_FORM[art]){
    const b = edBlockNeu('text');
    b.text = ':::' + art + (titel ? ' ' + titel : '') + '\n' +
             zeilen.join('\n') + '\n:::';
    return b;
  }
  const b = edBlockNeu(art);
  b.titel = titel.trim();
  const echt = zeilen.filter(z => z.trim() !== '');
  if(art === 'klapp'){ b.text = zeilen.join('\n').replace(/^\s+|\s+$/g, ''); return b; }
  if(art === 'rechner'){
    b.felder = [];
    echt.forEach(z => {
      const roh = z.trim();
      if(roh.startsWith('=')){ b.formel = roh.slice(1).trim(); return; }
      const e = roh.match(/^Einheit\s*:\s*(.+)$/i);
      if(e){ b.einheit = e[1].trim(); return; }
      const f = roh.match(/^(.+?)=(.*)$/);
      if(f){ b.felder.push({name: f[1].trim(), wert: f[2].trim()}); return; }
      b.hinweis = (b.hinweis ? b.hinweis + ' ' : '') + roh;
    });
    if(!b.felder.length) b.felder = [{name: '', wert: ''}];
    return b;
  }
  if(art === 'pdf'){
    b.zeilen = [];
    echt.forEach(z => {
      const d = z.trim().match(/^datei\s*:\s*(.+)$/i);
      if(d){ b.kennung = d[1].trim(); return; }
      const teile = z.split('|').map(x => x.trim());
      b.zeilen.push([teile[0] || '', teile[1] || '']);
    });
    if(!b.zeilen.length) b.zeilen = [['', '']];
    return b;
  }
  const breite = (ED_FORM[art].spalten || []).length;
  b.zeilen = echt.map(z => {
    const teile = z.split('|').map(x => x.trim());
    while(teile.length < breite) teile.push('');
    return teile.slice(0, breite);
  });
  if(!b.zeilen.length) b.zeilen = [ED_FORM[art].spalten.map(() => '')];
  return b;
}

function edBlockZuZeilen(b){
  /* Die Zeilen, die zwischen den drei Doppelpunkten stehen. */
  if(b.art === 'klapp') return String(b.text || '').split('\n');
  if(b.art === 'rechner'){
    const z = (b.felder || []).filter(f => String(f.name || '').trim())
      .map(f => f.name.trim() + ' = ' + String(f.wert || '').trim());
    if(String(b.formel || '').trim()) z.push('= ' + b.formel.trim());
    if(String(b.einheit || '').trim()) z.push('Einheit: ' + b.einheit.trim());
    if(String(b.hinweis || '').trim()) z.push(b.hinweis.trim());
    return z;
  }
  if(b.art === 'pdf'){
    const z = [];
    if(String(b.kennung || '').trim()) z.push('datei: ' + b.kennung.trim());
    (b.zeilen || []).forEach(r => {
      const t = String(r[0] || '').trim(), sn = String(r[1] || '').trim();
      if(t || sn) z.push(t + ' | ' + sn);
    });
    return z;
  }
  return (b.zeilen || [])
    .filter(r => r.some(x => String(x || '').trim()))
    .map(r => r.map(x => String(x || '').trim()).join(' | '));
}

function edBloeckeZuMarkup(bloecke){
  return (bloecke || []).map(b => {
    if(b.art === 'text') return String(b.text || '');
    const zeilen = edBlockZuZeilen(b);
    return ':::' + b.art + (String(b.titel || '').trim() ? ' ' + b.titel.trim() : '') +
           '\n' + zeilen.join('\n') + '\n:::';
  }).filter(x => x.trim()).join('\n\n');
}

function edBlockHtml(b){
  /* Das fertige Ergebnis eines Blocks - mit GENAU dem Erzeuger, der auch die
     Seite baut. Ein zweiter Weg waere eine Vorschau, die luegen kann. */
  if(b.art === 'text') return edBloecke(String(b.text || ''));
  return edBaustein(b.art, String(b.titel || ''), edBlockZuZeilen(b));
}

function edStilSicherstellen(){
  /* Die Vorschau soll aussehen wie die Seite. Genau derselbe Stil, der in
     die erzeugte Seite wandert, wird dafuer einmal in die Huelle gehaengt -
     eine zweite, nachgebaute Fassung waere eine Vorschau, die luegt. */
  if($('ed-bausteinstil')) return;
  const st = document.createElement('style');
  st.id = 'ed-bausteinstil';
  st.textContent = '.ed-erg{--line-soft:var(--line)}\n' + ED_STIL_BAUSTEINE;
  document.head.appendChild(st);
}

function edPdfWaehlen(i, j, feld){
  /* Die Datei wird hier gelesen und erst beim Speichern mitgeschickt. Die
     Kennung entsteht aus dem Dateinamen und ist in der Seite eindeutig -
     der Server bildet daraus den Namen des Anhangs. */
  const e = ZUSTAND.editor;
  const b = e && e.abschnitte[i] && e.abschnitte[i].bloecke[j];
  const datei = feld.files && feld.files[0];
  if(!b || !datei) return;
  if(datei.type && datei.type !== 'application/pdf' && !/\.pdf$/i.test(datei.name))
    return einblenden('Das ist keine PDF-Datei.');
  const leser = new FileReader();
  leser.onerror = () => einblenden('Die Datei ließ sich nicht lesen.');
  leser.onload = () => {
    const roh = String(leser.result || '');
    const komma = roh.indexOf(',');
    b.daten64 = komma >= 0 ? roh.slice(komma + 1) : '';
    b.urname = datei.name;
    b.kennung = edPdfKennung(e, i, j, datei.name);
    b.dateiname = '';
    if(!String(b.titel || '').trim()) b.titel = datei.name.replace(/\.pdf$/i, '');
    einblenden(datei.name + ' ausgewählt (' + bytes(datei.size) + ').');
    editorZeichnen({fokus: 'ed-block-' + i + '-' + j});
  };
  leser.readAsDataURL(datei);
}
function edPdfKennung(e, i, j, dateiname){
  /* Aus "Kompendium Netzwerke.pdf" wird "anhang-kompendium-netzwerke". Der
     Server bildet daraus "anhang-kompendium-netzwerke.pdf". Kommt dieselbe
     Kennung in der Seite schon vor, wird gezaehlt - sonst haengt der Server
     zwei Dateien an denselben Namen und ein Knopf zeigt auf die falsche. */
  const basis = 'anhang-' + (edSlug(dateiname.replace(/\.pdf$/i, '')) || 'pdf');
  const belegt = new Set();
  (e.abschnitte || []).forEach((a, ai) => (a.bloecke || []).forEach((b, bj) => {
    if(b.art === 'pdf' && b.kennung && !(ai === i && bj === j)) belegt.add(b.kennung);
  }));
  if(!belegt.has(basis)) return basis;
  for(let n = 2; n < 99; n++) if(!belegt.has(basis + '-' + n)) return basis + '-' + n;
  return basis + '-' + Date.now();
}
function edBlockTun(was, i, j, knopf){
  const e = ZUSTAND.editor;
  const a = e && e.abschnitte[i];
  if(!a) return;
  edBlockLesenAusDerSeite(i, j);
  const b = a.bloecke[j];
  if(was === 'weg'){
    if(a.bloecke.length < 2) return einblenden('Ein Block muss bleiben.');
    const leer = !edBloeckeZuMarkup([b]).trim();
    if(!leer && !confirm('Diesen Block entfernen?')) return;
    a.bloecke.splice(j, 1);
    return editorZeichnen();
  }
  if(was === 'hoch' && j > 0){
    a.bloecke.splice(j - 1, 0, a.bloecke.splice(j, 1)[0]);
    return editorZeichnen();
  }
  if(was === 'runter' && j < a.bloecke.length - 1){
    a.bloecke.splice(j + 1, 0, a.bloecke.splice(j, 1)[0]);
    return editorZeichnen();
  }
  if(was === 'zeile-neu'){
    const breite = ((ED_FORM[b.art] || {}).spalten || ['']).length;
    b.zeilen.push(new Array(breite).fill(''));
    return editorZeichnen({fokus: 'ed-block-' + i + '-' + j});
  }
  if(was === 'zeile-weg'){
    /* Die letzte gefuellte Zeile darf weg, die letzte ueberhaupt nicht. */
    if(b.zeilen.length < 2) return;
    const r = +((knopf.previousElementSibling || {}).dataset || {}).bzeile;
    b.zeilen.splice(isFinite(r) ? r : b.zeilen.length - 1, 1);
    return editorZeichnen({fokus: 'ed-block-' + i + '-' + j});
  }
  if(was === 'feld-neu'){
    b.felder.push({name: '', wert: ''});
    return editorZeichnen({fokus: 'ed-block-' + i + '-' + j});
  }
  if(was === 'feld-weg'){
    if(b.felder.length < 2) return;
    const k = +((knopf.previousElementSibling || {}).dataset || {}).bfeldwert;
    b.felder.splice(isFinite(k) ? k : b.felder.length - 1, 1);
    return editorZeichnen({fokus: 'ed-block-' + i + '-' + j});
  }
  if(was.startsWith('einsetzen-')){
    const eintrag = ED_EINSETZER.find(x => x[0] === was.slice(10));
    if(eintrag) edEinsetzen(i, j, eintrag[2]);
    return;
  }
}

function edGruppenWiederholt(abschnitte){
  /* Die Nummern der Abschnitte, deren Gruppe weiter oben SCHON EINMAL
     angefangen hat - mit etwas anderem dazwischen. Das Verzeichnis fasst nur
     AUFEINANDERFOLGENDE Abschnitte unter eine Ueberschrift (die Reihenfolge
     der Abschnitte ist die Aussage des Autors), also steht "Grundlagen" dann
     zweimal da. Kein Fehler der Anzeige, sondern ein Aufbau, den der Autor
     so kaum gemeint hat (N-24).

     Zurueck kommen die WIEDERHOLUNGEN, nicht die Namen: der Hinweis gehoert
     an den Abschnitt, der die Ueberschrift ein zweites Mal aufmacht - beim
     ersten stimmt der Satz "kommt weiter oben schon vor" nicht.

     Abschnitte OHNE Gruppe duerfen nicht wegfallen: im Verzeichnis stehen
     sie als Luecke, und danach faengt die Ueberschrift wieder an. "A, ohne,
     A" zeigt "A" also genauso zweimal wie "A, B, A". */
  const wieder = new Set(), gesehen = new Set();
  let vorher = null;
  (abschnitte || []).forEach((a, i) => {
    const g = String(a.gruppe || '').trim();
    if(g === vorher) return;
    if(g){
      if(gesehen.has(g)) wieder.add(i);
      gesehen.add(g);
    }
    vorher = g;
  });
  return wieder;
}

function abschnittsleiste(slug, daten){
  /* Die Inhaltsspalte einer Seite: Titel, ein Satz dazu, und die Abschnitte
     in Gruppen. Genau der Aufbau, den eine gut gemachte Inhaltsseite selbst
     benutzt - Ueberschrift, dann Rubriken, dann Sprungziele. Ohne Gruppen
     ist es eine einfache Liste, und das bleibt richtig. */
  const n = $('seitenteile');
  if(!n) return;
  const liste = ((daten || {}).abschnitte || []).filter(a => a.anker && a.titel);
  /* Unter zwei Abschnitten bringt die Liste nichts und nimmt nur Platz. */
  if(!slug || liste.length < 2){ n.hidden = true; n.innerHTML = ''; return; }
  const kopf = `<div class="teile-kopf">
      <div class="teile-titel">${schuetzen((daten || {}).titel || 'Diese Seite')}</div>
      ${(daten || {}).kurz
        ? `<div class="teile-satz">${schuetzen(daten.kurz)}</div>` : ''}
    </div>`;
  /* Gruppen in der Reihenfolge, in der sie vorkommen - nicht alphabetisch:
     die Reihenfolge der Abschnitte ist die Aussage des Autors. */
  const stuecke = [];
  let offen = null;
  liste.forEach(a => {
    const g = String(a.gruppe || '').trim();
    if(g !== offen){
      if(g) stuecke.push(`<div class="teile-gruppe">${schuetzen(g)}</div>`);
      else if(offen !== null) stuecke.push('<div class="teile-luecke"></div>');
      offen = g;
    }
    stuecke.push(`<button type="button" data-anker="${schuetzen(a.anker)}"
      >${schuetzen(a.titel)}</button>`);
  });
  n.innerHTML = kopf + '<div class="teile-liste">' + stuecke.join('') + '</div>';
  n.hidden = false;
  n.querySelectorAll('[data-anker]').forEach(b => b.onclick = () => {
    /* Kein Neuladen des Rahmens - dieselbe Nachricht wie beim Suchtreffer. */
    wegSetzen(slug, b.dataset.anker);
    $('rahmen')._auftrag = {anker:b.dataset.anker};
    springen(b.dataset.anker, '');
    abschnittMarkieren(b.dataset.anker);
    menueZu();
  });
}

function istGemerkt(slug){

function merkenKnopf(slug){
  /* Der Server kann Merkzettel und die Uebersicht zeigt sie an - nur setzen
     konnte sie niemand, weil es keinen Knopf dafuer gab. Hier ist er. */
  const k = $('merken-knopf');
  if(!k) return;

     offen ist. Ein Knopf, der nichts zu suchen hat, ist kein Knopf. */
  const fk = $('finden-knopf');
  if(fk) fk.hidden = !slug;

      await baumLaden();

                      : 'Gemerkt — steht jetzt auf der Übersicht.');

function bearbeitenKnopf(slug, urheber){
  /* Beim Lesen einer Seite: aendern darf sie ihr Urheber und jeder
     Verwalter (N-13). Urheber ist, wer sie ANGELEGT hat - nicht, wer
     zuletzt gespeichert hat (N-15). Wer nur liest, sieht den Knopf nicht - statt ihn
     anzubieten und dann an einem 403 auflaufen zu lassen. */
  const k = $('bearbeiten-knopf');
  if(!k) return;
  const ich = ZUSTAND.ich || {};
  /* Ohne Schreibrecht gar nicht erst anbieten (N-21) - auch dem Urheber
     nicht, denn die Gruppe wird vergeben UND entzogen. */
  const darf = !!(slug && ich.ist_editor && (ich.ist_admin ||
                  (urheber && urheber === ich.kennung)));
  k.hidden = !darf;
  k.onclick = darf ? () => {
    history.pushState(null, '', '#/bearbeiten/' + slug);
    editor(slug);
  } : null;
}
async function editor(slug){
  ZUSTAND.ansicht = 'editor'; ZUSTAND.slug = slug || null;
  bearbeitenKnopf(null);
  merkenKnopf(null);
  abschnittsleiste(null);

  $('rahmen').hidden = true; $('rahmen').removeAttribute('src');
  $('flaeche').hidden = false;

  if(!slug){
    ZUSTAND.editor = edLeer();
    return editorZeichnen();
  }
  $('flaeche').innerHTML = '<div class="meldung">Seite wird geladen …</div>';
  let roh;
  try {
    /* Die gespeicherte Seite selbst holen - dort steht im Meta-Block auch
       die Quelle, mit der der Editor sie erzeugt hat. */
    const a = await fetch('/seite/' + encodeURIComponent(slug) + '/',
                          {credentials:'same-origin'});
    if(!a.ok) throw new Error('Die Seite ließ sich nicht laden (' + a.status + ').');
    roh = await a.text();

      'kein lesbarer Meta-Block. Sie lässt sich nur als Datei ersetzen.</div>';
    return;
  }

  editorZeichnen();
}
function edAusHtml(roh, slug, neu){
  /* Eine fertige Seite in den Zustand des Editors uebersetzen. Denselben Weg
     gehen beide Wege dorthin: "Bearbeiten" an einer gespeicherten Seite und
     "HTML-Datei oeffnen" im Editor. Gibt null zurueck, wenn die Seite keinen
     lesbaren Meta-Block hat. */
  let meta = null;
  const m = String(roh || '').match(
    /<script[^>]+id=["']wiki-meta["'][^>]*>([\s\S]*?)<\/script>/i);
  if(m){ try { meta = JSON.parse(m[1]); } catch(e){ meta = null; } }
  if(!meta) return null;
  const e = {
    neu: !!neu, slug: meta.slug || slug || '', titel: meta.titel || '',
    kurz: meta.kurz || '', pfad: (meta.pfad || []).join(' / '),
    gruppen: (meta.gruppen || []).join(', '), stand: '',
    quelle: meta.werkzeug === EDITOR_WERKZEUG ? 'editor' : 'fremd',
    slugGetippt: true,
    abschnitte: (meta.abschnitte || []).map(a => ({
      anker: a.anker || '', titel: a.titel || '',
      stichworte: (a.stichworte || []).join(', '),
      gruppe: a.gruppe || '',
      /* markup gibt es nur bei Seiten aus dem Editor. Sonst dient der
         Suchtext als Anfang - besser als ein leeres Feld, und die Warnung
         darüber sagt, was dabei verloren geht. */
      markup: a.markup !== undefined ? a.markup : (a.text || '')
    }))
  };
  if(!e.abschnitte.length) e.abschnitte = [edAbschnittNeu()];
  /* Aus dem gespeicherten Markup wieder Bloecke machen - sonst waere
     "Bearbeiten" eine Textwand und der Editor nur beim Neuanlegen blockweise. */
  e.abschnitte.forEach(a => { a.bloecke = edMarkupZuBloecken(a.markup); });
  /* Die Namen der schon vorhandenen Anhaenge stehen in der Seite selbst, in
     der Marke, die der Server beim Ausgliedern gesetzt hat. Ohne sie wuesste
     der PDF-Block nicht, dass seine Datei schon auf dem Server liegt - und
     die Seite wuerde ihn beim Speichern nicht mehr nennen (N-18). */
  const marken = {};
  const merken = (kennung, name) => { if(name) marken[kennung] = name; };
  String(roh).replace(
    /<script[^>]*\bid=["']([^"']+)["'][^>]*\bdata-wiki-anhang=["']([^"']*)["']/gi,
    (_, kennung, name) => { merken(kennung, name); return ''; });
  String(roh).replace(
    /<script[^>]*\bdata-wiki-anhang=["']([^"']*)["'][^>]*\bid=["']([^"']+)["']/gi,
    (_, name, kennung) => { merken(kennung, name); return ''; });
  e.abschnitte.forEach(a => (a.bloecke || []).forEach(b => {
    if(b.art === 'pdf' && b.kennung && marken[b.kennung]) b.dateiname = marken[b.kennung];
  }));
  /* Anhaenge, die kein Block kennt (Bilder in eigenem HTML): merken, damit
     die gespeicherte Seite sie weiter nennt. */
  e.fremdeAnhaenge = Object.entries(marken)
    .filter(([k]) => !e.abschnitte.some(a => (a.bloecke || [])
      .some(b => b.art === 'pdf' && b.kennung === k)))
    .map(([kennung, name]) => ({kennung, name}));
  return e;
}

  /* Die eigenen Gruppen: nur die darf ein Nutzer vergeben (N-13), und

  const meine = ((ZUSTAND.ich && ZUSTAND.ich.gruppen) || [])

  const abschnitte = e.abschnitte.map((a, i) => `

function edTun(was, i, knopf){
  edFelderLesen();
  const e = ZUSTAND.editor;
  if(was === 'neu'){
    e.abschnitte.push(edAbschnittNeu());
    editorZeichnen();
    const f = $('ed-a-titel-' + (e.abschnitte.length - 1));
    if(f) f.focus();
    return;
  }
  if(was === 'block') return edBlockAnhaengen(i, (knopf && knopf.dataset.art) || 'text');
  if(was === 'weg'){
    if(e.abschnitte.length < 2) return einblenden('Ein Abschnitt muss bleiben.');
    const a = e.abschnitte[i];
    if((a.titel || a.markup) &&
       !confirm('Abschnitt „' + (a.titel || 'ohne Titel') + '" entfernen?')) return;
    e.abschnitte.splice(i, 1);
    return editorZeichnen();
  }
  if(was === 'hoch' && i > 0){
    e.abschnitte.splice(i - 1, 0, e.abschnitte.splice(i, 1)[0]);
    return editorZeichnen();
  }
  if(was === 'runter' && i < e.abschnitte.length - 1){
    e.abschnitte.splice(i + 1, 0, e.abschnitte.splice(i, 1)[0]);
    return editorZeichnen();
  }
  if(was === 'abbrechen'){
    if(!confirm('Bearbeiten abbrechen? Was hier steht, ist dann weg.')) return;
    ZUSTAND.editor = null;
    history.pushState(null, '', '#/verwaltung');
    return verwaltung();
  }
  if(was === 'gruppe'){
    const g = (knopf && knopf.dataset.g) || '';
    const f = $('ed-gruppen');
    const drin = f.value.split(',').map(x => x.trim()).filter(Boolean);
    const i = drin.indexOf(g);
    if(i >= 0) drin.splice(i, 1); else drin.push(g);
    f.value = drin.join(', ');
    e.gruppen = f.value;
    return;
  }
  if(was === 'datei') return edDatei();
  if(was === 'vorschau') return edVorschau();
  if(was === 'speichern') return edSpeichern();
}
function edEinsetzen(i, j, text){
  /* An der Schreibmarke einsetzen, mit Leerzeile davor und danach - ein
     Kasten oder eine Tabelle ist ein eigener Absatz und darf nicht in einen
     Satz rutschen. Ohne Neuzeichnen: der Text soll stehen bleiben, wo er
     steht. */
  const f = $('ed-btext-' + i + '-' + j);
  if(!f) return;
  const vor = f.value.slice(0, f.selectionStart);
  const nach = f.value.slice(f.selectionEnd);
  const davor = (!vor || /\n\s*\n$/.test(vor)) ? '' : (/\n$/.test(vor) ? '\n' : '\n\n');
  const danach = (!nach || /^\s*\n/.test(nach)) ? '' : '\n\n';
  const neu = davor + text + danach;
  f.value = vor + neu + nach;
  const ziel = vor.length + neu.length;
  f.focus();
  f.setSelectionRange(ziel, ziel);
  edBlockLesenAusDerSeite(i, j);
  edErgebnisMalen(i, j);
}
function edPruefbar(nurNachsehen){
  /* Was der Editor selbst schon weiß - bevor der Server es sagt. Die
     Serverprüfung bleibt die Wahrheit, aber für Tippfehler ist der Weg über
     das Netz unnötig lang.

     nurNachsehen: fuer die Standzeile. Dann werden die Felder nicht neu
     gelesen (das laeuft beim Zeichnen sowieso) und keine Anker gesetzt. */
  if(!nurNachsehen) edFelderLesen();
  const e = ZUSTAND.editor, m = [];
  const titel = String(e.titel || '').trim();
  if(!titel) m.push('Der Seite fehlt der Titel.');
  else if(titel.length > 120)
    m.push('Der Titel ist ' + titel.length + ' Zeichen lang, erlaubt sind 120.');
  if(String(e.kurz || '').trim().length > 300)
    m.push('Der Satz unter dem Titel ist zu lang (erlaubt: 300 Zeichen).');
  const slug = String(e.slug || '').trim();
  /* Die Adresse entsteht aus dem Titel. Fehlt der Titel, ist "keine Adresse"
     keine zweite Aufgabe, sondern dieselbe - und eine Liste mit vier
     Punkten schreckt ab, wo einer genuegt. */
  if(!slug && titel) m.push('Der Seite fehlt die Adresse.');
  else if(slug && !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug))
    m.push('Die Adresse „' + slug + '" ist nicht erlaubt: nur Kleinbuchstaben, ' +
           'Ziffern und Bindestriche.');
  if(!edPfadListe(e.pfad).length) m.push('Der Pfad im Themenbaum fehlt.');
  const anker = new Set();
  e.abschnitte.forEach((a, i) => {
    const t = String(a.titel || '').trim();
    if(!t) m.push('Abschnitt ' + (i + 1) + ' hat keinen Titel.');
    let k = String(a.anker || '').trim() || edSlug(t);
    if(!k && t) m.push('Abschnitt ' + (i + 1) + ' hat keinen Anker.');
    else if(k) {
      if(anker.has(k)) m.push('Der Anker „' + k + '" kommt zweimal vor.');
      anker.add(k);
      if(!nurNachsehen) a.anker = k;
    }
    if(!String(a.markup || '').trim())
      m.push(t ? 'Im Abschnitt „' + t + '" steht noch nichts.'
                : 'Im Abschnitt ' + (i + 1) + ' steht noch nichts.');
    /* Ein PDF-Baustein ohne Datei baut einen Knopf, der auf einen Anhang
       zeigt, den die Seite nicht mitbringt - ein Klick ins Leere (N-22).
       Lieber hier abfangen als den Leser ratlos lassen. */
    (a.bloecke || []).forEach((b, j) => {
      if(b.art !== 'pdf') return;
      if(b.daten64 || b.dateiname) return;
      const wo = t ? '„' + t + '"' : 'Abschnitt ' + (i + 1);
      m.push('Im PDF-Baustein ' + (j + 1) + ' in ' + wo +
             ' ist keine Datei ausgewählt — seine Knöpfe würden ins Leere führen.');
    });
  });
  return m;
}
function edBerichtZeigen(html){
  const z = $('ed-bericht');
  if(z) z.innerHTML = html;
}
async function edSenden(weg){
  const html = edSeiteBauen(ZUSTAND.editor);
  letzteDatei = new Blob([html], {type:'text/html'});
  ZUSTAND.felder = null;
  return hole(weg, {method:'POST', body: letzteDatei,
                    headers:{'Content-Type':'text/html; charset=utf-8'}});
}
async function edVorschau(){
  const m = edPruefbar();
  if(m.length){
    edFehlerMarkieren();
    edStandZeigen();
    return edBerichtZeigen('<div class="meldung fehler"><strong>' +
      'Das fehlt noch</strong><ul style="margin:6px 0 0 18px;padding:0">' +
      m.map(x => '<li>' + schuetzen(x) + '</li>').join('') + '</ul></div>');
  }
  edBerichtZeigen('<div class="meldung">Wird geprüft …</div>');
  let b;
  try { b = await edSenden('/api/pruefen'); }
  catch(err){ return edBerichtZeigen('<div class="meldung fehler">' +
    schuetzen(err.message) + '</div>'); }
  const teile = [];
  if(b.fehler.length) teile.push('<div class="meldung fehler"><strong>' +
    'Nicht übernehmbar</strong><ul style="margin:6px 0 0 18px;padding:0">' +
    b.fehler.map(f => '<li>' + schuetzen(f) + '</li>').join('') + '</ul></div>');
  else teile.push('<div class="meldung gut"><strong>Geprüft</strong> — ' +
    zahl(b.abschnitte) + ' Abschnitte, ' + bytes(b.groesse_nachher_b) +
    (b.neu ? ', neue Seite' : ', ersetzt Fassung ' + (b.fassung - 1)) + '.</div>');
  if(b.warnungen.length) teile.push('<div class="meldung warn"><strong>' +
    b.warnungen.length + (b.warnungen.length === 1 ? ' Hinweis' : ' Hinweise') +
    '</strong><ul style="margin:6px 0 0 18px;padding:0">' +
    b.warnungen.map(w => '<li>' + schuetzen(w) + '</li>').join('') + '</ul></div>');
  edBerichtZeigen(teile.join(''));
  if(b.fehler.length) return;
  /* Die Vorschau liegt jetzt auf dem Server - dieselbe Strecke wie beim
     Einspielen einer Datei. Zurück führt in den Editor, nicht in die
     Verwaltung. */
  ZUSTAND.vorschauZurueck = () => editorZeichnen();
  $('flaeche').hidden = true;
  $('rahmen').hidden = false;
  $('rahmen')._auftrag = {};
  $('rahmen').setAttribute('src', '/vorschau/');
  $('kopftitel').textContent = 'Vorschau';
  $('kopfkontext').textContent = (ZUSTAND.editor.titel || '') + ' — noch nicht gespeichert';
  $('vorschau-text').textContent = (ZUSTAND.editor.titel || '') +
    (b.neu ? ' · neue Seite' : ' · ersetzt Fassung ' + (b.fassung - 1));
  $('vorschau-leiste').hidden = false;
}
function edFehlerMarkieren(){
  /* Nicht nur eine Liste am Rand: das leere Feld selbst wird markiert, und
     der Blick springt dorthin. Sonst sucht man, was gemeint ist. */
  const e = ZUSTAND.editor;
  let erstes = null;
  const merken = (f) => { if(f && !erstes) erstes = f; };
  if(!String(e.titel || '').trim()){
    const f = $('ed-titel'); if(f){ f.setAttribute('aria-invalid', 'true'); merken(f); }
  }
  if(!edPfadListe(e.pfad).length){
    const f = $('ed-pfad'); if(f){ f.setAttribute('aria-invalid', 'true'); merken(f); }
  }
  (e.abschnitte || []).forEach((a, i) => {
    if(String(a.titel || '').trim()) return;
    const f = $('ed-a-titel-' + i);
    if(f){ f.setAttribute('aria-invalid', 'true'); merken(f); }
  });
  if(erstes){ erstes.scrollIntoView({block:'center'}); erstes.focus(); }
}
async function edSpeichern(){
  const m = edPruefbar();
  if(m.length){
    edFehlerMarkieren();
    edStandZeigen();
    return edBerichtZeigen('<div class="meldung fehler"><strong>' +
      'Das fehlt noch</strong><ul style="margin:6px 0 0 18px;padding:0">' +
      m.map(x => '<li>' + schuetzen(x) + '</li>').join('') + '</ul></div>');
  }
  edBerichtZeigen('<div class="meldung">Wird gespeichert …</div>');
  let a;
  try { a = await edSenden('/api/import'); }
  catch(err){
    return edBerichtZeigen('<div class="meldung fehler"><strong>' +
      'Nicht gespeichert</strong><div style="margin-top:4px">' +
      schuetzen(err.message) + '</div><div style="margin-top:6px;font-size:12.5px">' +
      'Alles, was du geschrieben hast, steht noch in den Feldern.</div></div>');
  }
  ZUSTAND.editor = null;
  await baumLaden();
  einblenden('Gespeichert als Fassung ' + a.fassung + '.');
  history.pushState(null, '', '#/' + a.slug);
  oeffnen(a.slug);
}
function edTextLesen(datei){
  /* Ueber FileReader, nicht ueber Blob.text(): derselbe Weg, den der
     PDF-Baustein schon geht, und im Browsertest der einzige, der zuverlaessig
     zurueckkam. */
  return new Promise((fertig, schief) => {
    const leser = new FileReader();
    leser.onload = () => fertig(String(leser.result || ''));
    leser.onerror = () => schief(new Error('nicht lesbar'));
    leser.readAsText(datei);
  });
}
async function edAusDatei(){
  /* Eine geprueffte HTML-Datei in den Editor holen. Vorher lief hier nur
     "Uebernehmen" - einspielen, wie die Datei ist. Wer sie aendern wollte,
     musste sie erst einspielen und dann bearbeiten. */
  if(!letzteDatei) return einblenden('Erst eine Datei auswählen.');
  let roh;
  try { roh = await edTextLesen(letzteDatei); }
  catch(err){ return einblenden('Die Datei ließ sich nicht lesen.'); }
  /* Gibt es die Kennung schon, ist das ein Bearbeiten - sonst eine neue
     Seite. Das entscheidet nur, was im Kopf steht; gespeichert wird in
     beiden Faellen ueber dieselbe Pruefung. */
  const vorlaeufig = edAusHtml(roh, '', true);
  if(!vorlaeufig)
    return einblenden('In dieser Datei ist kein lesbarer Meta-Block.');
  const bekannt = edSlugBekannt(vorlaeufig.slug);
  vorlaeufig.neu = !bekannt;
  ZUSTAND.editor = vorlaeufig;
  ZUSTAND.ansicht = 'editor';
  ZUSTAND.slug = bekannt ? vorlaeufig.slug : null;
  history.pushState(null, '', bekannt ? '#/bearbeiten/' + vorlaeufig.slug : '#/neu');
  editorZeichnen();
  const anzahl = vorlaeufig.abschnitte.length;
  const bloecke = vorlaeufig.abschnitte.reduce((n, a) => n + (a.bloecke || []).length, 0);
  einblenden('Geladen: ' + zahl(anzahl) + (anzahl === 1 ? ' Abschnitt' : ' Abschnitte') +
             ', ' + zahl(bloecke) + (bloecke === 1 ? ' Block' : ' Blöcke') +
             (bekannt ? ' — ersetzt die vorhandene Seite beim Speichern.'
                      : ' — neue Seite.'));
}
function edSlugBekannt(slug){
  /* Der Themenbaum besteht aus Zweigen mit kinder UND seiten - die Seiten
     haengen an den Zweigen, nicht im Baum selbst. */
  if(!slug) return false;
  const suchen = (zweige) => (zweige || []).some(z =>
    (z.seiten || []).some(x => x.slug === slug) || suchen(z.kinder));
  return suchen(ZUSTAND.baum);
}
function edDatei(){
  const m = edPruefbar();
  if(m.length) return edBerichtZeigen('<div class="meldung fehler"><strong>' +
    'Das fehlt noch</strong><ul style="margin:6px 0 0 18px;padding:0">' +
    m.map(x => '<li>' + schuetzen(x) + '</li>').join('') + '</ul></div>');
  const html = edSeiteBauen(ZUSTAND.editor);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
  a.download = (ZUSTAND.editor.slug || 'seite') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  einblenden('Datei erzeugt. Sie lässt sich genauso wieder einspielen.');
}

/* ---------------------------------------------------- Start */
async function baumLaden(){
  const d = await hole('/api/baum');
  ZUSTAND.baum = d.baum || [];
  // Die Anzahl gehoert in den Inhalt, nicht unter das Logo (Regelblatt 5).
  ZUSTAND.anzahl = d.anzahl || 0;
  /* Die Merkzettel kommen aus derselben Antwort - der Knopf im Kopf muss
     wissen, ob die offene Seite schon gemerkt ist. */
  ZUSTAND.marken = d.lesezeichen || [];
  baumZeichnen();
  if(ZUSTAND.ansicht === 'seite') merkenKnopf(ZUSTAND.slug);
}
(async function los(){
  try { themaAnwenden(localStorage.getItem('wiki-thema') || 'system'); }
  catch(e){ themaAnwenden('system'); }
  try {
    ZUSTAND.ich = await hole('/api/ich');
    ZUSTAND.einst = ZUSTAND.ich.einstellungen || {};
    themaAnwenden(ZUSTAND.einst.thema || 'system');
    $('konto-knopf').textContent = ZUSTAND.ich.name;
    /* Drei Stufen (N-21): lesen darf jeder Angemeldete, schreiben wer in
       der Editorgruppe ist, verwalten die Verwaltergruppe. Ein Knopf, der
       zu einem 403 fuehrt, ist schlimmer als kein Knopf. */
    $('neu-knopf').hidden = !ZUSTAND.ich.ist_editor;
    $('verwaltung-knopf').hidden = !ZUSTAND.ich.ist_admin;
    await baumLaden();
    if(!location.hash.replace(/^#\/?/, '') && ZUSTAND.einst.start === 'zuletzt'){
      const d = await hole('/api/baum');
      if(d.zuletzt && d.zuletzt.length) return oeffnen(d.zuletzt[0].slug);
    }
    wegLesen(true);
  } catch(e){
    document.body.innerHTML = `<div style="max-width:460px;margin:16vh auto;padding:24px"
      class="karte"><h3>Nicht angemeldet</h3>
      <div class="kontext" style="margin-top:8px">${schuetzen(e.message)}</div>
      <a class="knopf" href="/" style="margin-top:16px;text-decoration:none">Erneut versuchen</a>
      </div>`;
  }
})();
