<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prolo Wiki</title>
<style>
  /* ---------------------------------------------------------------
     Schriften (B-19)

     Das Wiki hatte die Regeln bereits, sie zeigten aber auf Dateinamen
     (sora-600.woff2, instrument-400.woff2, …), die nie geliefert wurden -
     der Ordner schriften/ enthielt nur einen HINWEIS.md. Damit lief auch das
     Wiki fuer alle Nutzer in der Systemschrift, denn auf praktisch keinem
     Geraet sind Sora, Instrument Sans oder JetBrains Mono installiert. Die
     Unterscheidung zwischen Anzeige-, Fliess- und Monospace-Schrift ist der
     Kern von Regelblatt 3, und letter-spacing:-0.02em auf Ueberschriften ist
     auf Sora abgestimmt.

     Die Absicht, keine fremden Quellen einzubinden, war richtig und deckt
     sich mit der CSP - der richtige Weg ist aber, die Schriften SELBST
     auszuliefern. Sie liegen jetzt tatsaechlich unter wiki/schriften/ und
     werden von server.py mit Zwischenspeicherung herausgegeben.

     Alle drei stehen unter der SIL Open Font License; die Lizenztexte
     liegen als OFL-*.txt daneben, wie die OFL es verlangt.

     Zwei Dateien je Familie, aufgeteilt nach unicode-range: "latin" deckt
     den Alltag ab, "latin-ext" laedt der Browser nur nachtraeglich, wenn
     ein Zeichen daraus vorkommt. Instrument Sans und JetBrains Mono sind
     variable Schriften - eine Datei deckt den ganzen Gewichtsbereich ab,
     darum steht dort eine Spanne statt einer Zahl.
     --------------------------------------------------------------- */
  /* Sora 600: Ueberschriften und Kennzahlen */
  @font-face{
    font-family:'Sora';font-style:normal;font-weight:600;font-display:swap;
    src:url('/schriften/sora-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'Sora';font-style:normal;font-weight:600;font-display:swap;
    src:url('/schriften/sora-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  /* Instrument Sans 400-600: Fliesstext (variabel) */
  @font-face{
    font-family:'Instrument Sans';font-style:normal;font-weight:400 600;font-display:swap;
    src:url('/schriften/instrument-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'Instrument Sans';font-style:normal;font-weight:400 600;font-display:swap;
    src:url('/schriften/instrument-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  /* JetBrains Mono 400-500: Zahlen und Kennungen (variabel) */
  @font-face{
    font-family:'JetBrains Mono';font-style:normal;font-weight:400 500;font-display:swap;
    src:url('/schriften/jetbrains-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'JetBrains Mono';font-style:normal;font-weight:400 500;font-display:swap;
    src:url('/schriften/jetbrains-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
/* ---------------------------------------------------------------
   Farbtoken - Regelblatt Abschnitt 2. Keine Farbe ausserhalb.
   --------------------------------------------------------------- */
:root{
  --bg:oklch(0.96 0.004 250);
  --app:oklch(0.985 0.002 250);
  --surface:#fff;
  --chrome:oklch(0.995 0.001 250);
  --line:oklch(0.92 0.004 250);
  --line-soft:oklch(0.96 0.002 250);
  --hover:oklch(0.96 0.003 250);

  --ink:oklch(0.2 0.01 250);
  --ink-2:oklch(0.3 0.01 250);
  --ink-3:oklch(0.52 0.01 250);

  --accent:oklch(0.52 0.17 262);
  --accent-hover:oklch(0.45 0.17 262);
  --accent-soft:oklch(0.94 0.02 262);
  --accent-ink:oklch(0.38 0.13 262);
  --bar:oklch(0.86 0.03 262);

  --good:oklch(0.45 0.14 158);
  --good-soft:oklch(0.97 0.01 158);
  --warm-soft:oklch(0.94 0.01 60);
  --warm-ink:oklch(0.45 0.08 60);

  --feature:oklch(0.34 0.12 262);
  --feature-ink:oklch(0.99 0.002 250);
  --feature-ink-2:oklch(0.86 0.03 262);
  --feature-line:oklch(0.46 0.11 262);
  --feature-good:oklch(0.88 0.16 158);

  --track:oklch(0.94 0.004 250);
  --shadow:0 24px 60px -20px oklch(0.4 0.03 250 / 0.22);

  /* Die drei Token aus Regelblatt 2, die hier fehlten (N-01). Werte
     identisch zum Bordbuch - ein Loeschknopf muss in beiden Tools gleich
     aussehen. --overlay hat im Wiki heute keine Fundstelle: es gibt keinen
     eigenen Dialog, gefragt wird ueber confirm(). Es steht trotzdem hier,
     weil genau das sein Zweck laut Regelblatt ist - damit der naechste
     Dialog nicht sein eigenes rgba(0,0,0,.5) erfindet. */
  --danger:oklch(0.52 0.18 25);      /* Loeschen, Zuruecksetzen       */
  --on-accent:oklch(0.99 0.002 250); /* Text auf --accent             */
  --overlay:oklch(0.28 0.02 258);    /* Abdunklung hinter Dialogen    */
}
body[data-theme="dark"]{
  --bg:oklch(0.16 0.012 258); --app:oklch(0.2 0.012 258);
  --surface:oklch(0.235 0.013 258); --chrome:oklch(0.205 0.012 258);
  --line:oklch(0.31 0.014 258); --line-soft:oklch(0.27 0.012 258); --hover:oklch(0.27 0.013 258);
  --ink:oklch(0.96 0.004 250); --ink-2:oklch(0.87 0.006 250); --ink-3:oklch(0.69 0.01 250);
  --accent:oklch(0.62 0.16 262); --accent-hover:oklch(0.69 0.16 262);
  --accent-soft:oklch(0.33 0.06 262); --accent-ink:oklch(0.85 0.09 262); --bar:oklch(0.38 0.06 262);
  --good:oklch(0.8 0.14 158); --good-soft:oklch(0.29 0.05 158);
  --warm-soft:oklch(0.33 0.05 60); --warm-ink:oklch(0.86 0.08 60);
  --feature:oklch(0.31 0.07 262); --feature-ink:oklch(0.97 0.004 250); --feature-ink-2:oklch(0.8 0.02 250);
  --feature-line:oklch(0.42 0.05 262); --feature-good:oklch(0.85 0.15 158);
  --track:oklch(0.3 0.014 258);
  --danger:oklch(0.7 0.16 25); --on-accent:oklch(0.16 0.012 258);
  --overlay:oklch(0.2 0.012 258);
  --shadow:0 24px 60px -20px oklch(0.05 0 0 / 0.6);
}

*{box-sizing:border-box}
/* Muss vor allen display-Regeln stehen: eine ID- oder Klassenregel mit
   display schlaegt sonst das hidden-Attribut, und ein verstecktes
   Element bleibt sichtbar. */
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink-2);
  font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.sora{font-family:'Sora','Instrument Sans',system-ui,sans-serif;font-weight:600;
  letter-spacing:-0.02em;color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.label{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;
  letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-3)}

/* Pflichtblock Regelblatt 8.1 */
button:focus-visible, a:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }

[data-noscroll]{scrollbar-width:none}
[data-noscroll]::-webkit-scrollbar{width:0;height:0}

/* ------------------------------------------------ Grundgeruest */
.app{display:flex;height:100%;background:var(--app)}

#seitenleiste{
  width:248px;flex:0 0 248px;background:var(--chrome);
  border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;
}
.marke{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;width:100%;
  border:0;background:transparent;font:inherit;cursor:pointer;text-align:left}
.marke:hover .wortmarke{color:var(--accent)}
/* Text auf --accent laeuft ueber --on-accent, nicht ueber ein hartes #fff
   (N-01). Regelblatt 1 erlaubt #fff dort zwar, aber als Token ist es an
   einer Stelle aenderbar, falls --accent einmal heller wird. */
.marke .kachel{width:30px;height:30px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent);font-family:'Sora',sans-serif;
  font-weight:600;font-size:15px;flex:0 0 30px}
.navi{padding:0 8px 8px;border-bottom:1px solid var(--line)}
.baum{flex:1;overflow-y:auto;padding:8px 8px 20px}
.baum .gruppe{margin-top:12px}
.knoten{display:flex;align-items:center;gap:6px;width:100%;min-height:34px;
  padding:4px 8px;border:0;background:transparent;color:var(--ink-3);
  font:inherit;font-size:11px;font-family:'JetBrains Mono',monospace;
  letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;text-align:left;
  border-radius:8px}
.knoten:hover{background:var(--hover);color:var(--ink-2)}
.knoten .pfeil{transition:transform .15s;flex:0 0 10px}
.knoten[aria-expanded="false"] .pfeil{transform:rotate(-90deg)}
.blatt{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;
  padding:6px 10px 6px 12px;border:0;border-left:3px solid transparent;
  background:transparent;color:var(--ink-2);font:inherit;font-size:13.5px;
  cursor:pointer;text-align:left;border-radius:0 8px 8px 0}
.blatt:hover{background:var(--hover);color:var(--ink)}
.blatt[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);
  border-left-color:var(--accent);font-weight:600}
.leiste-fuss{border-top:1px solid var(--line);padding:8px}
.leiste-fuss .blatt, .navi .blatt{border-radius:8px;padding-left:12px}

#hauptteil{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
/* Lange Titel duerfen den Kopf nicht aufblasen (N-20). Der Server weist sie
   inzwischen ab, aber Seiten aus der Zeit davor liegen schon da - und eine
   Oberflaeche, die an ihren eigenen Daten zerbricht, ist nicht fertig. */
#kopftitel, #kopfkontext{display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
/* Nur den TEXT klammern, nicht den Eintrag selbst: .blatt ist ein Flexkasten
   (Titel + Marke "freigabe"). Mit display:-webkit-box darauf bricht die
   Marke in eine eigene Zeile - genau der Grafikfehler aus der Rueckmeldung.
   Die Klammer gehoert an das innere span. */
.blatt{overflow:hidden}
.blatt > span:first-child{display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.teile-titel{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden}
.teile-satz{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  overflow:hidden}
.treffer-gruppe .seite, .treffer-zeile .titel{display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
header{height:76px;flex:0 0 76px;background:var(--chrome);
  border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:14px;padding:0 24px}
#inhalt{flex:1;min-height:0;display:flex;background:var(--app)}
#inhaltsspalte{flex:1;min-width:0;position:relative;height:100%;
  display:flex;flex-direction:column}
#rahmen{width:100%;flex:1 1 auto;min-height:0;border:0;display:block;
  background:var(--app)}
#rahmen[hidden]{display:none}
#finden{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 20px;background:var(--chrome);border-bottom:1px solid var(--line)}
#finden[hidden]{display:none}
#finden .label{flex:0 0 auto}
#finden input{flex:1 1 200px;min-width:120px;height:38px;padding:0 12px;
  border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font:inherit;font-size:13px}
#finden input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#finden .knopf{flex:0 0 auto}
#finden-stand{flex:0 1 auto;font-size:12.5px;color:var(--ink-3);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#finden-stand[data-leer="1"]{color:var(--warm-ink)}
.treffer-eingrenzung{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line-soft);
  background:var(--chrome)}
.treffer-eingrenzung button{border:0;cursor:pointer;font:inherit;font-size:11.5px;
  font-weight:600;min-height:32px;padding:4px 10px}
.treffer-eingrenzung button:hover{background:var(--accent);color:var(--on-accent)}
/* Schmal: die Beschriftung bleibt fuer Vorleser, nimmt aber keine Zeile
   mehr weg - der Platzhalter im Feld sagt dasselbe. Feld und die drei
   Knoepfe passen dann in eine Reihe, die Standzeile kommt darunter.
   Gemessen bei 360 Pixeln: vorher 113 Pixel Leiste, jetzt 90 - und der
   Rahmen fuer die Seite gewinnt genau diese 23 zurueck. */
@media (max-width:860px){
  /* Regelblatt 9: am Finger 44 Pixel. */
  .treffer-eingrenzung button{min-height:44px;padding:8px 12px}
  #finden{padding:8px 16px;gap:8px}
  #finden .label{position:absolute;left:-9999px;width:1px;height:1px;
    overflow:hidden}
  #finden input{flex:1 1 120px;min-width:100px;height:44px}
  #finden-stand{flex:1 1 100%;order:9}
}

/* ------------------------------------------------ Bausteine */
.karte{padding:18px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line)}
.karte h3{margin:0;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;
  color:var(--ink);letter-spacing:-0.01em}
.karte .kontext{margin-top:2px;font-size:12px;color:var(--ink-3)}

.knopf{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;min-width:44px;padding:0 15px;border-radius:10px;border:0;
  background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;font-size:13px;
  cursor:pointer}
.knopf:hover{background:var(--accent-hover)}
.knopf[disabled]{opacity:.5;cursor:not-allowed}
.knopf.rahmen{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
/* Zerstoerende Aktionen (N-01). Gleiches Verhalten wie im Bordbuch: der
   Knopf ist im Ruhezustand unauffaellig und faerbt sich erst beim Zeigen -
   rot als Dauerzustand waere eine Warnung, kein Hinweis auf Verlust. */
.knopf.gefahr:hover{border-color:var(--danger);color:var(--danger)}
.knopf.rahmen:hover{background:var(--hover);color:var(--ink)}
.knopf.still{background:transparent;color:var(--ink-3);border:0}
.knopf.still:hover{background:var(--hover);color:var(--ink)}

.marke-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;
  font-weight:600;background:var(--accent-soft);color:var(--accent-ink)}
.marke-badge.warm{background:var(--warm-soft);color:var(--warm-ink)}
.marke-badge.gut{background:var(--good-soft);color:var(--good)}

input[type=text],input[type=search],input:not([type]),select,textarea{
  width:100%;height:38px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-size:13.5px}
textarea{height:auto;padding:10px 12px;min-height:76px;line-height:1.5}

/* ------------------------------------------------ Suche */
#suchfeld-huelle{position:relative;flex:1;max-width:460px}
#suchfeld{padding-left:36px}
#suchfeld-huelle .lupe{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);pointer-events:none;display:flex}
#suchfeld-huelle kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;pointer-events:none}

#treffer{position:absolute;z-index:40;top:calc(100% + 8px);left:0;right:0;
  max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:6px;display:none}
#treffer[data-offen="1"]{display:block}
.treffer-zeile{display:block;width:100%;text-align:left;border:0;background:transparent;
  font:inherit;color:var(--ink-2);padding:10px 12px;border-radius:10px;cursor:pointer;
  min-height:44px}
.treffer-zeile:hover,.treffer-zeile[data-aktiv="1"]{background:var(--hover)}
.treffer-zeile .kopf{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.treffer-zeile .titel{font-family:'Sora',sans-serif;font-weight:600;font-size:14px;
  color:var(--ink)}
.treffer-zeile .weg{font-size:11px;font-family:'JetBrains Mono',monospace;
  color:var(--ink-3)}
.treffer-zeile .aus{font-size:12.5px;color:var(--ink-3);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Regelblatt 9: Klickflaeche mindestens 44 px. In der Verwaltung waren der
   Seitentitel und die Freigabe 20 px hoch - am Handy mit dem Daumen nicht zu
   treffen. Sie behalten ihr Aussehen, bekommen aber die Hoehe. */
.verw-zeile{height:auto;min-height:44px;padding:2px 0;justify-content:flex-start;
  text-align:left}
summary{min-height:44px;display:flex;align-items:center;gap:8px}
.ed-kurzhilfe summary{min-height:44px}
details.karte > summary{min-height:44px}

/* Treffer nach Seite gruppiert: bei einem breiten Suchwort standen sonst
   zwoelf Zeilen derselben Seite untereinander, und man sah den Wald nicht. */
.treffer-gruppe{padding:8px 12px 2px;display:flex;align-items:baseline;gap:8px;
  flex-wrap:wrap}
.treffer-gruppe + .treffer-gruppe, .treffer-zeile + .treffer-gruppe{
  border-top:1px solid var(--line-soft);margin-top:4px;padding-top:12px}
.treffer-gruppe .seite{font-family:'Sora',sans-serif;font-weight:600;
  font-size:14px;color:var(--ink)}
.treffer-gruppe .weg{font-size:11px;font-family:'JetBrains Mono',monospace;
  color:var(--ink-3)}
.treffer-zeile.unter{padding-left:24px;min-height:38px}
.treffer-zeile .quelle{font-size:10.5px;font-family:'JetBrains Mono',monospace;
  letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-3)}
.treffer-zeile.unter .titel{font-family:inherit;font-size:13.5px;font-weight:600;
  color:var(--ink-2)}
.treffer-fuss{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px 4px}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:3px;padding:0 2px}

/* ------------------------------------------------ Startseite und Verwaltung */
.flaeche{flex:1 1 auto;min-height:0;overflow-y:auto;padding:28px 32px 60px}
/* Regelblatt 6: sonst zieht sich auf breiten Schirmen alles auseinander. */
.mitte{max-width:1280px;margin:0 auto}
.raster{display:grid;gap:16px}
.hero{border-radius:14px;padding:22px;background:var(--feature);color:var(--feature-ink)}
.hero .zahl{font-family:'Sora',sans-serif;font-weight:600;font-size:36px;
  letter-spacing:-0.02em;line-height:1.1}
.tabelle{width:100%;border-collapse:collapse}
.tabelle th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:400;
  padding:8px 10px;border-bottom:1px solid var(--line)}
.tabelle td{font-size:13px;color:var(--ink-2);padding:10px;
  border-bottom:1px solid var(--line-soft)}
.tabelle tr:hover td{background:var(--hover)}
.meldung{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:10px;
  border:1px solid var(--line);background:var(--surface)}
.meldung.fehler{border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent-ink)}
.meldung.warn{border-color:var(--warm-ink);background:var(--warm-soft);color:var(--warm-ink)}
.meldung.gut{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ablage{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;
  background:var(--surface)}
.ablage[data-ueber="1"]{border-color:var(--accent);background:var(--accent-soft)}

#einblendung{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  z-index:90;background:var(--ink);color:var(--surface);padding:10px 16px;
  border-radius:10px;font-size:13px;box-shadow:var(--shadow);display:none}
#einblendung[data-offen="1"]{display:block}

#menue-knopf{display:none}

/* ------------------------------------------------ Handy */
@media (max-width:860px){
  #seitenleiste{position:fixed;z-index:60;left:0;top:0;bottom:0;
    transform:translateX(-100%);transition:transform .18s;box-shadow:var(--shadow)}
  body[data-menue="1"] #seitenleiste{transform:none}
  #menue-knopf{display:inline-flex}
  header{height:auto;flex:0 0 auto;padding:10px 16px;flex-wrap:wrap;
    gap:8px;padding-top:max(10px,env(safe-area-inset-top))}
  #suchfeld-huelle{max-width:none;flex:1 1 100%;order:3}
  #suchfeld-huelle kbd{display:none}
  .flaeche{padding:18px 20px calc(40px + env(safe-area-inset-bottom))}
  .knopf{height:44px}
  #kopftitel{font-size:16px}
}
/* ---------- Abschnitte der offenen Seite ----------
   Eine eigene Spalte LINKS VOM TEXT, nicht in der aeussersten Leiste: dort
   gehoert der Themenbaum hin (wo bin ich im Wiki), hier steht, wo ich in
   DIESER Seite bin. Genau die Aufteilung, die eine gut gemachte
   Inhaltsseite selbst benutzt. Die Anker stehen im Meta-Block, der Sprung
   laeuft ueber denselben Weg wie ein Suchtreffer. */
#seitenteile{flex:0 0 268px;width:268px;height:100%;overflow-y:auto;
  padding:0 0 40px;border-right:1px solid var(--line);
  background:var(--chrome);scrollbar-width:thin}
#seitenteile[hidden]{display:none}
.teile-kopf{padding:22px 20px 14px}
.teile-titel{font-family:'Sora',sans-serif;font-size:16px;font-weight:600;
  color:var(--ink);line-height:1.3;letter-spacing:-0.01em}
.teile-satz{margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.teile-liste{padding:0 8px}
.teile-gruppe{padding:16px 12px 6px;font-family:'JetBrains Mono',monospace;
  font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--ink-3)}
.teile-luecke{height:10px}
#seitenteile button{display:block;width:100%;text-align:left;border:0;
  background:none;font:inherit;font-size:13.5px;color:var(--ink-2);
  padding:9px 12px;border-radius:8px;cursor:pointer;line-height:1.35;
  border-left:2px solid transparent}
#seitenteile button:hover{background:var(--hover);color:var(--ink)}
#seitenteile button[aria-current="true"]{background:var(--accent-soft);
  color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
@media (max-width:1100px){
  /* Zu schmal fuer zwei Spalten neben dem Text: dann wird daraus wieder
     eine Zeile ueber dem Inhalt - lieber schmal als gar kein Inhalt. */
  #inhalt{flex-direction:column}
  #seitenteile{flex:0 0 auto;width:auto;height:auto;padding:0;border-right:0;
    border-bottom:1px solid var(--line);overflow-x:hidden}
  .teile-kopf{display:none}
  .teile-liste{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
    padding:8px 16px;scrollbar-width:none}
  .teile-liste::-webkit-scrollbar{width:0;height:0}
  .teile-gruppe{align-self:center;flex:0 0 auto;padding:0 2px 0 8px}
  .teile-luecke{display:none}
  #seitenteile button{flex:0 0 auto;width:auto;height:30px;padding:0 11px;
    border-radius:999px;border:1px solid var(--line);white-space:nowrap;
    border-left-width:1px;font-size:12.5px}
  #seitenteile button[aria-current="true"]{border-color:var(--accent)}
}

/* ---------- Seiten-Editor ---------- */
.ed-abschnitt{background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:16px}
.ed-kopf{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ed-zeile{display:flex;gap:10px;flex-wrap:wrap}
.ed-klein{height:30px;padding:0 9px;font-size:13px;line-height:1}
/* Bausteinkasten: die Knopfreihe, die einen neuen Block anhaengt. */
.ed-kasten{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--bg);
  border:1px solid var(--line-soft)}
.ed-kasten .label{margin-right:4px}

/* ---------- PDF-Schau ---------- */
#pdf-schau{position:fixed;z-index:70;right:0;top:0;bottom:0;width:48vw;
  min-width:380px;max-width:900px;background:var(--chrome);
  border-left:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column}
#pdf-schau[hidden]{display:none}
#pdf-kopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--line);
  padding-top:max(10px,env(safe-area-inset-top))}
#pdf-kopf #pdf-name{font-weight:600;color:var(--ink);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pdf-kopf #pdf-extern{margin-left:auto}
#pdf-rahmen{flex:1;width:100%;border:0;background:var(--app)}
@media (max-width:860px){
  #pdf-schau{width:100%;min-width:0;max-width:none;left:0}
}

/* ---------- Editor: drei sichtbare Schritte ----------
   Vorher standen alle Felder gleichzeitig da - fuenf davon, bevor man ein
   Wort geschrieben hatte. Jetzt: erst worum es geht, dann der Inhalt, und
   die Leiste unten bleibt immer sichtbar. */
.ed-fahrplan{padding:12px 16px;border-radius:12px;background:var(--accent-soft);
  color:var(--accent-ink);font-size:13px;line-height:1.6}
.ed-schritt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ed-schritt h3{margin:0}
.ed-schritt-frei{padding:4px 2px 0}
.ed-nr{flex:0 0 26px;width:26px;height:26px;border-radius:8px;
  background:var(--accent);color:var(--on-accent);display:grid;
  place-items:center;font-family:'Sora',sans-serif;font-weight:600;font-size:14px}
.ed-mehr{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:4px}
.ed-mehr > summary{cursor:pointer;font-size:13px;color:var(--accent-ink)}
#ed-leiste{flex:0 0 auto;background:var(--chrome);
  border-top:1px solid var(--line);
  padding:12px 32px calc(12px + env(safe-area-inset-bottom))}
#ed-leiste[hidden]{display:none}
.ed-stand{font-size:12.5px;color:var(--ink-3)}
.ed-stand[data-fehlt="1"]{color:var(--warm-ink)}
@media (max-width:432px){
  #ed-leiste{padding-left:20px;padding-right:20px}
}

/* ---------- Blockkarten im Editor ----------
   Links das Formular, rechts das fertige Ergebnis. Der Sinn der Aufteilung:
   man sieht sofort, was entsteht, statt sich Markup vorzustellen. */
.ed-bloecke{display:grid;gap:10px;margin-top:12px}
.ed-block{border:1px solid var(--line);border-radius:12px;background:var(--bg);
  overflow:hidden}
.ed-block-kopf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.ed-art{font-size:12.5px;font-weight:600;color:var(--ink)}
.ed-block-hilfe{font-size:12px;color:var(--ink-3);min-width:0;flex:1 1 140px}
.ed-block-knoepfe{display:flex;gap:4px;margin-left:auto;flex:0 0 auto}
.ed-block-leib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:0}
.ed-block-form{padding:12px;min-width:0}
.ed-block-erg{padding:12px;min-width:0;border-left:1px solid var(--line);
  background:var(--surface)}
.ed-erg{margin-top:6px}
/* Das Ergebnis ist die fertige Seite im Kleinen: die Bausteinklassen gelten
   hier genauso, damit die Vorschau nicht anders aussieht als die Seite. */
.ed-erg > :first-child{margin-top:0}
.ed-erg > :last-child{margin-bottom:0}
.ed-reihe{display:flex;gap:6px;align-items:center;margin-top:6px}
.ed-reihe input{min-width:0;flex:1 1 90px}
.ed-reihe .ed-schmal{flex:0 0 84px;max-width:84px;text-align:right}
.ed-merke{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}
/* Ein Hinweis, der kein Fehler ist: der Aufbau geht so, ist aber kaum
   gemeint (N-24). Darum warm statt rot, und ohne Sperre. */
.ed-gut{font-size:12px;color:var(--good);font-weight:500}
.ed-warn{font-size:11.5px;color:var(--warm-ink);background:var(--warm-soft);
  border-left:3px solid var(--warm-ink);border-radius:0 8px 8px 0;
  padding:7px 10px;margin-top:6px;line-height:1.45}
.ed-einsetzer{display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  margin-top:8px}
.ed-kurzhilfe{margin-top:8px}
.ed-kurzhilfe summary{cursor:pointer;font-size:12.5px;color:var(--accent-ink)}
.ed-kurzhilfe table{border-collapse:collapse;margin-top:8px;font-size:12.5px}
.ed-kurzhilfe th{text-align:left;font-weight:400;color:var(--ink-2);
  padding:3px 12px 3px 0;white-space:nowrap;font-size:12px}
.ed-kurzhilfe td{color:var(--ink-3);padding:3px 0}
@media (max-width:860px){
  .ed-block-leib{grid-template-columns:minmax(0,1fr)}
  .ed-block-erg{border-left:0;border-top:1px solid var(--line)}
}
.flaeche textarea{width:100%;box-sizing:border-box;
  font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;
  font-size:13px;line-height:1.6;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  resize:vertical}
.flaeche textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* Ein fehlendes Pflichtfeld zeigt sich am Feld, nicht nur in einer Liste. */
.flaeche input[aria-invalid="true"], .flaeche textarea[aria-invalid="true"]{
  border-color:var(--warm-ink);background:var(--warm-soft)}
@media (max-width:432px){
  .marke .wortmarke{font-size:14px}
  #treffer{position:fixed;left:8px;right:8px;top:auto}
  .ed-abschnitt{padding:13px}
}
</style>

<body data-theme="dark">

<div class="app">

  <!-- ------------------------------------------------ Seitenleiste -->
  <aside id="seitenleiste" aria-label="Themen">
    <button class="marke" id="logo" title="Zur Übersicht">
      <div class="kachel" aria-hidden="true">W</div>
      <div style="min-width:0;text-align:left">
        <div class="sora wortmarke" style="font-size:14px;line-height:1.2">Wiki</div>
        <div class="label" style="line-height:1.4">Wissenssammlung</div>
      </div>
    </button>
    <nav class="navi" aria-label="Hauptnavigation">
      <button class="blatt" id="start-knopf">Übersicht</button>
      <button class="blatt" id="neu-knopf" hidden>Neue Seite</button>
      <button class="blatt" id="verwaltung-knopf" hidden>Verwaltung</button>
    </nav>
    <nav class="baum" id="baum" data-noscroll aria-label="Themenbaum"></nav>
    <div class="leiste-fuss">
      <button class="blatt" id="einstellungen-knopf">Einstellungen</button>
    </div>
  </aside>

  <!-- ------------------------------------------------ Hauptteil -->
  <div id="hauptteil">
    <header>
      <button class="knopf rahmen" id="menue-knopf" aria-label="Themen anzeigen"
              aria-expanded="false">Themen</button>
      <button class="knopf rahmen" id="finden-knopf" hidden
              title="In dieser Seite suchen (Strg+F)">Finden</button>
      <button class="knopf rahmen" id="merken-knopf" hidden>Merken</button>
      <button class="knopf rahmen" id="bearbeiten-knopf" hidden>Bearbeiten</button>

      <div style="min-width:0;flex:0 1 auto">
        <div class="sora" id="kopftitel" style="font-size:20px;line-height:1.2">Übersicht</div>
        <div class="label" id="kopfkontext">Wissenssammlung</div>
      </div>

      <div id="suchfeld-huelle">
        <span class="lupe" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </span>
        <label for="suchfeld" class="label" style="position:absolute;left:-9999px">Suche</label>
        <input type="search" id="suchfeld" placeholder="Suchen — oder tippen für alle Seiten"
               autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="treffer">
        <kbd>/</kbd>
        <div id="treffer" role="listbox" aria-label="Suchergebnisse"></div>
      </div>

      <div style="margin-left:auto">
        <button class="knopf still" id="konto-knopf"
                style="font-weight:600;color:var(--ink)">…</button>
      </div>
    </header>

    <div id="vorschau-leiste" hidden
         style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;
                padding:10px 24px;background:var(--warm-soft);
                border-bottom:1px solid var(--line)">
      <span style="font-size:13px;font-weight:600;color:var(--warm-ink)">Vorschau</span>
      <span style="font-size:12.5px;color:var(--warm-ink)" id="vorschau-text">
        Noch nicht übernommen.</span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="knopf rahmen" id="vorschau-zurueck">Zurück</button>
        <button class="knopf" id="vorschau-uebernehmen">Übernehmen</button>
      </div>
    </div>

    <main id="inhalt">
      <!-- KEIN allow-same-origin (B-03 Teil 4): zusammen mit allow-scripts
           haette die Sandbox keine Wirkung, und eine eingespielte Seite
           koennte die Wiki-API im Namen des Betrachters aufrufen und ueber
           parent.document die Huelle manipulieren. Ohne allow-same-origin
           laeuft die Seite in einem opaken Origin. Den Riegel setzt der
           Server zusaetzlich per CSP-sandbox, damit er nicht an diesem
           Attribut haengt. -->
      <nav id="seitenteile" hidden aria-label="Abschnitte dieser Seite"></nav>
      <div id="inhaltsspalte">
        <!-- Suche IN der offenen Seite. Die Leiste schiebt den Rahmen nach
             unten, statt ueber ihm zu schweben: eine schwebende Leiste
             verdeckt Inhalt, und genau das war schon einmal ein Fehler. -->
        <div id="finden" hidden>
          <label class="label" for="finden-feld">In dieser Seite</label>
          <input type="search" id="finden-feld" autocomplete="off"
                 spellcheck="false" placeholder="Wort suchen">
          <span id="finden-stand" role="status" aria-live="polite"></span>
          <button class="knopf rahmen" id="finden-zurueck"
                  aria-label="Vorige Stelle" title="Vorige Stelle (Umschalt+Eingabe)"
                  disabled>&uarr;</button>
          <button class="knopf rahmen" id="finden-vor"
                  aria-label="Nächste Stelle" title="Nächste Stelle (Eingabe)"
                  disabled>&darr;</button>
          <button class="knopf still" id="finden-zu"
                  aria-label="Suche in der Seite schließen"
                  title="Schließen (Esc)">&#10005;</button>
        </div>
        <iframe id="rahmen" title="Wiki-Seite" hidden
                sandbox="allow-scripts allow-popups allow-downloads"></iframe>
        <div class="flaeche" id="flaeche" data-noscroll></div>
      </div>
    </main>

    <!-- Die Leiste des Editors gehoert NICHT in den Scrollbereich. Dort war
         sie position:sticky mit bottom:0 - und weil sticky sich an der
         Polsterkante ausrichtet, stand sie 60 px ueber dem Rand und der
         Inhalt lief unter ihr durch (Grafikfehler aus der Rueckmeldung).
         Als Geschwister von <main> in der Flexspalte sitzt sie immer unten,
         ohne Trick und ohne negative Raender. -->
    <div id="ed-leiste" hidden></div>
  </div>
</div>

<!-- PDF-Schau: die Huelle zeigt Anhaenge, die eingespielte Seite darf das
     nicht. Rechts neben dem Text, damit man mitlesen kann. -->
<div id="pdf-schau" hidden role="dialog" aria-modal="false" aria-label="PDF ansehen">
  <div id="pdf-kopf">
    <span class="label" id="pdf-name">PDF</span>
    <span class="label" id="pdf-stelle"></span>
    <a class="knopf still ed-klein" id="pdf-extern" target="_blank"
       rel="noopener">Eigenes Fenster</a>
    <button class="knopf rahmen ed-klein" id="pdf-zu">Schließen</button>
  </div>
  <iframe id="pdf-rahmen" title="PDF-Anhang"></iframe>
</div>

<div id="einblendung" role="status" aria-live="polite"></div>

<script>
/* ==================================================================
   Prolo Wiki - Shell
   Zustaendig fuer Baum, Suche, Navigation und Verwaltung.
   Die Inhaltsseiten laufen im iframe und bringen ihr eigenes
   Verhalten mit.
   ================================================================== */
const $ = (id) => document.getElementById(id);
const ZUSTAND = {ich:null, baum:[], slug:null, treffer:[], aktiv:-1, seiten:{}};

/* ---------------------------------------------------- Kleinkram */
function einblenden(text, dauer=2600){
  const e = $('einblendung'); e.textContent = text; e.dataset.offen = '1';
  clearTimeout(e._t); e._t = setTimeout(()=>{ e.dataset.offen='0'; }, dauer);
}
function schuetzen(s){
  return String(s??'').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function zahl(n){ return new Intl.NumberFormat('de-DE').format(n); }
function bytes(b){
  if(b >= 1048576) return new Intl.NumberFormat('de-DE',{maximumFractionDigits:1})
    .format(b/1048576) + ' MB';
  if(b >= 1024) return zahl(Math.round(b/1024)) + ' kB';
  return zahl(b) + ' B';
}
function datum(s){
  if(!s) return '';
  const t = String(s).slice(0,10).split('-');
  return t.length === 3 ? `${t[2]}.${t[1]}.${t[0]}` : s;
}
async function hole(pfad, einst){
  /* Content-Type zentral setzen (B-03): der Server verlangt bei POST einen
     Typ, der keine CORS-simple-request ist. Ohne eigenen Kopf wuerde der
     Browser text/plain senden - und genau das ist der Typ, mit dem ein
     fremdes Formular ohne Preflight hereinschreiben koennte. Wer einen
     eigenen Typ mitgibt (Datei-Upload: text/html), behaelt ihn. */
  const o = Object.assign({credentials:'same-origin'}, einst||{});
  if(o.body && !o.headers) o.headers = {'Content-Type':'application/json'};
  const a = await fetch(pfad, o);
  let d = null;
  try { d = await a.json(); } catch(e) { d = null; }
  if(!a.ok){
    const m = (d && d.fehler) || 'Der Server hat nicht geantwortet. Bitte erneut versuchen.';
    throw new Error(m);
  }
  return d;
}

/* ---------------------------------------------------- Thema
   Drei Zustaende: System folgt prefers-color-scheme, Hell und Dunkel sind
   fest. Die Wahl liegt in der Datenbank, damit sie auf jedem Geraet gilt;
   localStorage ist nur der Zwischenspeicher fuer den ersten Bildaufbau. */
const SYSTEM_DUNKEL = window.matchMedia
  ? window.matchMedia('(prefers-color-scheme: dark)') : null;

function themaAnwenden(wahl){
  ZUSTAND.thema = wahl || 'system';
  const dunkel = ZUSTAND.thema === 'dunkel' ||
    (ZUSTAND.thema === 'system' && (!SYSTEM_DUNKEL || SYSTEM_DUNKEL.matches));
  document.body.dataset.theme = dunkel ? 'dark' : 'light';
  try { localStorage.setItem('wiki-thema', ZUSTAND.thema); } catch(e){}
  rahmenThema();
}
async function themaWaehlen(wahl){
  themaAnwenden(wahl);
  try { await hole('/api/einstellungen', {method:'POST',
    body:JSON.stringify({thema: wahl})}); }
  catch(e){ einblenden('Die Wahl konnte nicht gespeichert werden: ' + e.message); }
}
if(SYSTEM_DUNKEL && SYSTEM_DUNKEL.addEventListener)
  SYSTEM_DUNKEL.addEventListener('change', () => {
    if(ZUSTAND.thema === 'system') themaAnwenden('system');
  });
function rahmenThema(){
  const f = $('rahmen');
  if(f && f.contentWindow && !f.hidden){
    /* Zielorigin '*': die Seite laeuft in einem opaken Origin (B-03 Teil 4)
       und ist nur so adressierbar. Unkritisch, weil die Nachricht nichts
       Schuetzenswertes enthaelt - nur den Namen des Themas. */
    try { f.contentWindow.postMessage(
      {typ:'wiki-thema', thema:document.body.dataset.theme}, '*'); } catch(e){}
  }
}


/* ---------------------------------------------------- Baum */
function baumZeichnen(){
  const ziel = $('baum'); ziel.innerHTML = '';
  const zustandAuf = JSON.parse(localStorage.getItem('wiki-auf') || '{}');

  function knoten(k, tiefe, weg){
    const huelle = document.createElement('div');
    huelle.className = tiefe === 0 ? 'gruppe' : '';
    const id = weg.join('/');
    const offen = zustandAuf[id] !== false;

    const kopf = document.createElement('button');
    kopf.className = 'knoten';
    kopf.style.paddingLeft = (8 + tiefe*10) + 'px';
    kopf.setAttribute('aria-expanded', String(offen));
    kopf.innerHTML = `<svg class="pfeil" width="10" height="10" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
      <path d="M6 9l6 6 6-6"/></svg><span>${schuetzen(k.name)}</span>`;
    huelle.appendChild(kopf);

    const kinder = document.createElement('div');
    kinder.hidden = !offen;
    kopf.onclick = () => {
      const neu = kinder.hidden;
      kinder.hidden = !neu;
      kopf.setAttribute('aria-expanded', String(neu));
      zustandAuf[id] = neu;
      localStorage.setItem('wiki-auf', JSON.stringify(zustandAuf));
    };

    (k.kinder||[]).forEach(x => kinder.appendChild(knoten(x, tiefe+1, weg.concat(x.name))));
    (k.seiten||[]).forEach(s => {
      ZUSTAND.seiten[s.slug] = s;
      const b = document.createElement('button');
      b.className = 'blatt';
      b.style.paddingLeft = (14 + tiefe*10) + 'px';
      b.dataset.slug = s.slug;
      b.innerHTML = `<span style="flex:1;min-width:0">${schuetzen(s.titel)}</span>` +
        (s.geschuetzt ? `<span class="marke-badge" title="Nur für bestimmte Gruppen">frei&shy;gabe</span>` : '');
      b.onclick = () => oeffnen(s.slug);
      kinder.appendChild(b);
    });
    huelle.appendChild(kinder);
    return huelle;
  }

  if(!ZUSTAND.baum.length){
    ziel.innerHTML = `<div style="padding:14px 10px;font-size:13px;color:var(--ink-3)">
      Noch keine Seite. Über <strong>Neue Seite</strong> geht es los.</div>`;
    return;
  }
  ZUSTAND.baum.forEach(k => ziel.appendChild(knoten(k, 0, [k.name])));
  markieren();
}
function markieren(){
  document.querySelectorAll('.baum .blatt').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.slug === ZUSTAND.slug)));
  const soll = {'start-knopf':'start', 'verwaltung-knopf':'verwaltung',
                'neu-knopf':'editor', 'einstellungen-knopf':'einstellungen'};
  Object.keys(soll).forEach(id =>
    $(id).setAttribute('aria-current', String(ZUSTAND.ansicht === soll[id])));

/* ---------------------------------------------------- Navigation */
function wegSetzen(slug, anker, begriff){
  let h = '#/' + (slug || '');
  if(anker) h += '/' + anker;
  if(begriff) h += '?q=' + encodeURIComponent(begriff);
  if(location.hash !== h) history.pushState(null, '', h);
}
async function oeffnen(slug, anker, begriff, ohneWeg){
  /* Eine offene PDF-Schau gehoert zur Seite, von der sie kam. */
  if(ZUSTAND.slug !== slug) pdfSchliessen();
  ZUSTAND.ansicht = 'seite';
  if(!slug) return start();
  merkenKnopf(slug);
  $('vorschau-leiste').hidden = true; $('ed-leiste').hidden = true;
  let daten;
  try { daten = await hole('/api/seite/' + encodeURIComponent(slug)); }
  catch(e){ einblenden(e.message); return; }

  ZUSTAND.slug = slug;
  if(!ohneWeg) wegSetzen(slug, anker, begriff);
  $('kopftitel').textContent = daten.titel;
  $('kopfkontext').textContent = (daten.pfad||[]).join(' › ') +
    (daten.stand ? '  ·  Stand ' + datum(daten.stand) : '');
  abschnittsleiste(slug, daten);
  if(anker) abschnittMarkieren(anker);
  bearbeitenKnopf(slug, daten.urheber || daten.nutzer_id);
  document.title = daten.titel + ' — Prolo Wiki';

  const f = $('rahmen');
  $('flaeche').hidden = true;
  f.hidden = false;
  const ziel = '/seite/' + encodeURIComponent(slug) + '/' + (anker ? '#' + anker : '');
  f._auftrag = {anker, begriff};
  if(f.getAttribute('src') !== ziel){ f.setAttribute('src', ziel); }
  else { springen(anker, begriff); }
  markieren();
  menueZu();
}
function springen(anker, begriff){
  const f = $('rahmen');
  try {
    /* Zielorigin '*', siehe rahmenThema(). Anker und Suchbegriff hat der
       Betrachter selbst eingegeben - nichts, was die Seite nicht sehen darf. */
    f.contentWindow.postMessage({typ:'wiki-springen', anker:anker||'', begriff:begriff||'',
      thema:document.body.dataset.theme}, '*');
  } catch(e){}
}
$('rahmen').addEventListener('load', () => {
  const a = $('rahmen')._auftrag || {};
  rahmenThema();
  springen(a.anker, a.begriff);
});
window.addEventListener('message', (e) => {
  /* Die Seite laeuft in einem opaken Origin, ihr e.origin ist darum "null"
     und taugt nicht mehr als Nachweis (B-03 Teil 4). Geprueft wird jetzt,
     dass die Nachricht tatsaechlich aus unserem eigenen Rahmen kommt - das
     ist der staerkere Test: ein fremdes Fenster kann sich nicht als
     contentWindow dieses iframes ausgeben. */
  const f = $('rahmen');
  if(!f || !e.source || e.source !== f.contentWindow) return;
  if(!e.data || typeof e.data !== 'object') return;
  if(e.data.typ === 'wiki-bereit'){
    springen(($('rahmen')._auftrag||{}).anker, ($('rahmen')._auftrag||{}).begriff);
    /* Steht die Findenleiste offen und die Seite ist gerade gewechselt,
       gilt die alte Zahl nicht mehr. Also noch einmal fragen. */
    if(!$('finden').hidden && $('finden-feld').value.trim().length >= 2)
      findenSenden(0);
  }
  if(e.data.typ === 'wiki-oeffnen' && e.data.slug) oeffnen(e.data.slug, e.data.anker);
  if(e.data.typ === 'wiki-funde') findenStandZeigen(e.data);
  if(e.data.typ === 'wiki-pdf' && typeof e.data.datei === 'string'){
    /* Die Seite darf ein PDF nicht selbst anzeigen (ihre CSP setzt frame-src
       und object-src auf 'none', und das ist die Grenze, die sie vom Rest des
       Wikis trennt). Sie bittet also die Huelle - und die kann es, weil der
       Anhang aus demselben Origin kommt. */
    pdfZeigen(ZUSTAND.slug, e.data.datei, e.data.seite);
  }
  if(e.data.typ === 'wiki-text' && typeof e.data.text === 'string'){
    /* Die Seite hat gemeldet, was sie anzeigt - damit die Suche auch findet,
       was erst im Browser entsteht. Still: wer eine Seite liest, soll davon
       nichts merken, und ein Fehlschlag darf das Lesen nicht stoeren. */
    const slug = ZUSTAND.slug;
    if(slug) hole('/api/ansichtstext', {method:'POST',
      body:JSON.stringify({slug, text:e.data.text})}).catch(() => {});
  }
});
window.addEventListener('popstate', () => wegLesen(true));

function wegLesen(ohneWeg){
  const h = location.hash.replace(/^#\/?/, '');
  if(!h) return start();
  const [weg, frage] = h.split('?');
  const teile = weg.split('/').filter(Boolean);
  const q = new URLSearchParams(frage||'').get('q') || '';
  if(!teile.length) return start();
  if(teile[0] === 'einstellungen') return einstellungen();
  if(teile[0] === 'verwaltung') return verwaltung();
  if(teile[0] === 'neu') return editor(null);
  if(teile[0] === 'bearbeiten' && teile[1]) return editor(teile[1]);
  oeffnen(teile[0], teile[1], q, ohneWeg);
}

/* Reihenfolge innerhalb einer Seite: erst die Seite selbst, dann ihre
   Abschnitte, dann der Fliesstext, zuletzt die Anhaenge. */
const TREFFER_RANG = {kopf:0, abschnitt:1, seite:2, ansicht:2, skript:3, anhang:4};

function trefferGruppieren(liste){
  /* Nach Seite gruppieren, aber die Reihenfolge der Seiten so lassen, wie die
     Suche sie gewichtet hat - der beste Treffer einer Seite bestimmt ihren
     Platz. Die Rueckgabe ist wieder eine flache Liste: die Tastatur laeuft
     ueber Zahlen, und die muessen zur Anzeige passen. */
  const seiten = [];
  const nach = new Map();
  (liste || []).forEach(t => {
    if(!nach.has(t.slug)){ nach.set(t.slug, []); seiten.push(t.slug); }
    nach.get(t.slug).push(t);
  });
  const aus = [];
  seiten.forEach(slug => {
    const gruppe = nach.get(slug).slice().sort((a, b) =>
      (TREFFER_RANG[a.art] === undefined ? 9 : TREFFER_RANG[a.art]) -
      (TREFFER_RANG[b.art] === undefined ? 9 : TREFFER_RANG[b.art]));
    gruppe.forEach((t, k) => aus.push(Object.assign({}, t, {erster: k === 0})));
  });
  return aus;
}

async function suchen(q){
  letzteSuche = q;
  let d;
  try { d = await hole('/api/suche?q=' + encodeURIComponent(q)); }
  catch(err){ einblenden(err.message); return; }
  if(letzteSuche !== q) return;
  ZUSTAND.treffer = trefferGruppieren(d.treffer);
  ZUSTAND.aktiv = ZUSTAND.treffer.length ? 0 : -1;
  ZUSTAND.statt = d.statt || null;
  /* Was der Server als Einschraenkung gelesen hat. Ohne das sucht jemand
     nach "bereich:Tehcnik" und sieht nur, dass nichts kommt. */
  ZUSTAND.eingrenzung = d.eingrenzung || {};
  ZUSTAND.trefferSeiten = new Set(ZUSTAND.treffer.map(t => t.slug)).size;
  trefferZeichnen(d.statt || q, d.dauer_ms, d.statt ? q : null);
}
function hervorheben(text, q){
  const roh = schuetzen(text);
  const worte = q.split(/\s+/).filter(w => w.length > 1)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!worte.length) return roh;
  return roh.replace(new RegExp('(' + worte.join('|') + ')', 'gi'), '<mark>$1</mark>');
}
/* Die Zeichen, die im Suchfeld eine Bedeutung haben. Sie stehen dort, wo
   jemand sie braucht: wenn nichts gefunden wurde. */
const SUCH_ZEICHEN = [
  ['"zwei worte"', 'genau diese Folge'],
  ['-wort', 'darf nicht vorkommen'],
  ['bereich:Technik', 'nur unter diesem Pfad'],
  ['gruppe:wiki-technik', 'nur mit dieser Freigabe'],
  ['seite:kennung', 'nur in dieser einen Seite']

const SUCH_HILFE = `

    ).join('')}</tbody></table>
  </details>`;
const SUCH_FELDNAME = {bereich:'Bereich', gruppe:'Gruppe', seite:'Seite'};
function eingrenzungszeile(){
  /* Was der Server als Einschraenkung gelesen hat - und ein Weg, sie
     wieder loszuwerden, ohne im Feld herumzustreichen. */
  const e = ZUSTAND.eingrenzung || {};

function sucheOhneFeld(feld){
  /* Das feld:wert aus dem Suchfeld nehmen - mit und ohne
     Anfuehrungszeichen - und neu suchen. */
  const f = $('suchfeld');
  const muster = new RegExp('(^|\\s)-?' + feld + ':("[^"]*"?|\\S*)', 'gi');
  f.value = f.value.replace(muster, ' ').replace(/\s+/g, ' ').trim();
  f.focus();
  f.dispatchEvent(new Event('input', {bubbles:true}));
}

function trefferZeichnen(gesucht, ms, getippt){
  /* gesucht = das Wort, mit dem die Treffer gefunden wurden. getippt = was
     der Mensch geschrieben hat, und nur gesetzt, wenn beides auseinander
     geht (Rechtschreibvorschlag). Die beiden hiessen vorher q und statt -
     bei diesen Namen liest man die Bedeutung genau verkehrt, und ich habe
     die richtige Zeile deshalb einmal "korrigiert". */
  const q = gesucht;
  const ziel = $('treffer');

    ? `<div style="padding:8px 12px;font-size:12.5px;color:var(--ink-3);
         border-bottom:1px solid var(--line-soft)">Nichts zu
         <span class="mono">${schuetzen(getippt)}</span> — Treffer für
         <strong style="color:var(--ink)">${schuetzen(gesucht)}</strong></div>`
    : '';

    ziel.innerHTML = `<div style="padding:14px">

        findet auch <span class="mono">Netzwerkkabel</span>.</div>

    ziel.innerHTML = eingrenzungszeile() + ziel.innerHTML;
    eingrenzungVerdrahten();

    if(az) az.onclick = () => alleSeitenZeigen();
  } else {
    /* Erst die Marke der Quelle: woher kommt dieser Treffer? Ohne das ist ein
       Treffer aus einem PDF nicht von einem Absatz zu unterscheiden. */
    const QUELLE = {kopf:'', abschnitt:'', seite:'im Text', ansicht:'im Text',
                    skript:'im Text', anhang:''};
    let letzterSlug = null;

      const zeigeTitel = t.art === 'kopf' ? '' :
        `<span class="titel">${hervorheben(t.titel, q)}</span>`;
      zeilen.push(`<button class="treffer-zeile unter" role="option" data-i="${i}"
        ${i === ZUSTAND.aktiv ? 'data-aktiv="1" aria-selected="true"' : 'aria-selected="false"'}>
        ${zeigeTitel || quelle || marke ? `<span class="kopf">${zeigeTitel}
          ${quelle ? `<span class="quelle">${quelle}</span>` : ''}${marke}</span>` : ''}
        <span class="aus">${hervorheben(t.schnipsel, q)}</span>

    });
    ziel.innerHTML = korrektur + eingrenzungszeile() + zeilen.join('') +

        ${(ZUSTAND.trefferSeiten === 1 ? 'Seite' : 'Seiten')} ·
        ${zahl(ZUSTAND.treffer.length)} ${ZUSTAND.treffer.length === 1 ? 'Stelle' : 'Stellen'} ·
        ${String(ms).replace('.', ',')} ms</span>

              style="margin-left:auto">Alle Seiten</button></div>`;
    eingrenzungVerdrahten();

function alleSeitenZeigen(){
  /* Wer das Wort nicht weiss, soll trotzdem hinkommen: die vollstaendige
     Liste aller Seiten, die dieser Nutzer sehen darf - aus dem Themenbaum,
     ohne neuen Aufruf. */
  const alle = [];
  const sammeln = (zweige, pfad) => (zweige || []).forEach(z => {
    const weg = pfad.concat([z.name]);
    (z.seiten || []).forEach(s => alle.push({slug:s.slug, titel:s.titel,
                                             kurz:s.kurz || '', pfad:weg}));
    sammeln(z.kinder, weg);
  });
  sammeln(ZUSTAND.baum, []);
  alle.sort((a, b) => a.titel.localeCompare(b.titel, 'de'));

  ZUSTAND.treffer = alle.map(s => ({slug:s.slug, titel:s.titel, art:'kopf',
                                    seitentitel:s.titel, pfad:s.pfad,

      ${i === 0 ? 'data-aktiv="1" aria-selected="true"' : 'aria-selected="false"'}>
      <span class="kopf"><span class="titel">${schuetzen(s.titel)}</span>
        <span class="weg">${schuetzen(s.pfad.join(' › '))}</span></span>
      ${s.kurz ? `<span class="aus">${schuetzen(s.kurz)}</span>` : ''}

    `<div style="padding:16px 14px;font-size:13px;color:var(--ink-3)">
      Noch keine Seite da. Über <strong>Neue Seite</strong> in der linken
      Leiste geht es los.</div>`;
  ziel.querySelectorAll('.treffer-zeile').forEach(b =>
    b.onclick = () => trefferWaehlen(+b.dataset.i));
  ziel.dataset.offen = '1';
  $('suchfeld').setAttribute('aria-expanded', 'true');
}
function aktivSetzen(i){

function pdfZeigen(slug, datei, seite){
  /* Der Anhang liegt unter /seite/<slug>/anhaenge/<datei>. Die Seitenzahl
     geht als #page=N an den PDF-Betrachter des Browsers - dieselbe
     Schreibweise, die ein Verweis auf eine PDF-Seite ueberall benutzt. */
  if(!slug || !datei) return;
  const schau = $('pdf-schau'), rahmen = $('pdf-rahmen');
  if(!schau || !rahmen) return;
  const nr = String(seite || '').replace(/[^0-9]/g, '');
  const weg = '/seite/' + encodeURIComponent(slug) + '/anhaenge/' +
              encodeURIComponent(datei);
  $('pdf-name').textContent = datei;
  $('pdf-stelle').textContent = nr ? 'Seite ' + nr : '';
  $('pdf-extern').setAttribute('href', weg + (nr ? '#page=' + nr : ''));
  /* Erst leeren: unterscheiden sich zwei Adressen nur im Anker, laedt der
     Rahmen nicht neu - und der Sprung auf die Seite bliebe aus. */
  rahmen.removeAttribute('src');
  schau.hidden = false;
  setTimeout(() => { rahmen.setAttribute('src', weg + (nr ? '#page=' + nr : '')); }, 0);
  $('pdf-zu').focus();
}
function pdfSchliessen(){
  const schau = $('pdf-schau');
  if(!schau || schau.hidden) return;
  schau.hidden = true;
  $('pdf-rahmen').removeAttribute('src');
}
/* ---------------------------------------------------- In der Seite suchen
   Die Seite laeuft in einem eigenen, opaken Origin - die Huelle kann in
   ihrem Text nicht selbst suchen und ihn auch nicht lesen. Also fragt sie:
   Begriff und Nummer der gewuenschten Stelle hin (wiki-finden), Anzahl,
   Nummer und Abschnitt zurueck (wiki-funde). Das Markieren, Aufklappen und
   Hinscrollen macht die Seite. */
const FINDEN = {begriff: '', nr: 0, anzahl: 0, gemeldet: false,
                gewarnt: false, frist: 0};
function findenNachricht(begriff, nr){
  const f = $('rahmen');
  if(!f || f.hidden || !f.contentWindow) return false;
  f.contentWindow.postMessage({typ:'wiki-finden', begriff, nr}, '*');
  return true;
}
function findenAuf(){
  if(ZUSTAND.ansicht !== 'seite' || !ZUSTAND.slug)
    return einblenden('Das geht in einer offenen Seite — öffne zuerst eine.');
  $('finden').hidden = false;
  const f = $('finden-feld');
  f.focus(); f.select();
  if(f.value.trim().length >= 2) findenSenden(0);
}
function findenZu(){
  clearTimeout(FINDEN.frist);
  $('finden').hidden = true;
  $('finden-stand').textContent = '';
  $('finden-stand').dataset.leer = '0';
  FINDEN.begriff = ''; FINDEN.nr = 0; FINDEN.anzahl = 0;
  /* Die Marken in der Seite wieder wegnehmen - sonst bleibt die Seite
     bunt, nachdem die Leiste zu ist. */
  findenNachricht('', 0);
  $('finden-vor').disabled = true;
  $('finden-zurueck').disabled = true;
}
function findenVerbergen(){
  /* Beim Wechsel in eine andere Ansicht: die Leiste gehoert zur offenen
     Seite. Ohne Nachricht an die Seite - die ist dann schon weg. */
  clearTimeout(FINDEN.frist);
  $('finden').hidden = true;
  FINDEN.begriff = ''; FINDEN.nr = 0; FINDEN.anzahl = 0;
}
function findenSenden(nr){
  const begriff = $('finden-feld').value.trim();
  const stand = $('finden-stand');
  FINDEN.begriff = begriff;
  FINDEN.nr = nr;
  clearTimeout(FINDEN.frist);
  if(begriff.length < 2){
    stand.textContent = begriff ? 'mindestens zwei Zeichen' : '';
    stand.dataset.leer = '0';
    $('finden-vor').disabled = true;
    $('finden-zurueck').disabled = true;
    findenNachricht('', 0);
    return;
  }
  FINDEN.gemeldet = false;
  stand.textContent = 'sucht …';
  stand.dataset.leer = '0';
  if(!findenNachricht(begriff, nr)) return;
  /* Antwortet die Seite nicht, wurde sie vor dieser Fassung gespeichert:
     ihr Pflichtteil kennt wiki-finden nicht. Markieren kann sie trotzdem -
     das gab es schon vorher. Also wenigstens das, und einmal sagen, warum
     hier keine Zahl steht. */
  FINDEN.frist = setTimeout(() => {
    if(FINDEN.gemeldet) return;
    stand.textContent = 'diese Seite kann noch nicht mitzählen';
    stand.dataset.leer = '1';
    const f = $('rahmen');
    if(f && f.contentWindow)
      f.contentWindow.postMessage({typ:'wiki-springen', anker:'', begriff}, '*');
    if(FINDEN.gewarnt) return;
    FINDEN.gewarnt = true;
    einblenden('Diese Seite wurde vor dieser Fassung gespeichert und kann '
      + 'noch nicht in sich suchen. Die Stellen werden markiert, aber nicht '
      + 'gezählt. Einmal über Bearbeiten → Speichern, dann geht es.', 9000);
  }, 600);
}
function findenStandZeigen(d){
  FINDEN.gemeldet = true;
  clearTimeout(FINDEN.frist);
  FINDEN.anzahl = Math.max(0, d.anzahl | 0);
  FINDEN.nr = d.nr | 0;
  const stand = $('finden-stand');
  if(!FINDEN.anzahl){
    stand.textContent = FINDEN.begriff.length >= 2 ? 'nichts gefunden' : '';
    stand.dataset.leer = '1';
  } else {
    /* "3 von 17" und dazu, in welchem Abschnitt man gerade steht - bei
       einer langen Seite ist das die eigentliche Auskunft. */
    stand.textContent = zahl(FINDEN.nr + 1) + ' von ' + zahl(FINDEN.anzahl)
      + (d.abschnitt ? ' · ' + d.abschnitt : '');
    stand.dataset.leer = '0';
  }
  $('finden-vor').disabled = FINDEN.anzahl < 2;
  $('finden-zurueck').disabled = FINDEN.anzahl < 2;
  if(d.anker) abschnittMarkieren(d.anker);
}
function trefferWaehlen(i){
  const t = ZUSTAND.treffer[i];
  if(!t) return;
  trefferSchliessen();
  if(t.art === 'anhang'){
    /* Der Treffer steht im PDF - dann auch dorthin springen, statt es nur
       zu sagen. Die Seite darunter wird trotzdem geoeffnet: das PDF haengt
       an ihr, und ihr Text gibt den Zusammenhang. */
    oeffnen(t.slug, '', letzteSuche);
    pdfZeigen(t.slug, t.anhang, t.seitennr);
  } else {
    oeffnen(t.slug, t.anker, letzteSuche);
  }
}
function trefferSchliessen(){
  $('treffer').dataset.offen = '0';
  $('suchfeld').setAttribute('aria-expanded', 'false');
  ZUSTAND.aktiv = -1;
}

  $('ed-neu-knopf').onclick = () => {

  $('flaeche').querySelectorAll('[data-loeschen]').forEach(b => b.onclick = async () => {
    const slug = b.dataset.loeschen;

      `Die Datei bleibt auf dem Server liegen und lässt sich von Hand ` +
      `zurückholen. Aus Baum und Suche verschwindet sie sofort.`)) return;
    try {
      await hole('/api/loeschen', {method:'POST',
        body:JSON.stringify({slug, bestaetigt:true})});
      einblenden(`"${slug}" entfernt.`);
      await baumLaden(); verwaltung();
    } catch(e){ einblenden(e.message); }
  });
  $('zweig-knopf').onclick = async () => {
    const pfad = $('zweig-pfad').value.trim();
    const gruppen = $('zweig-gruppen').value.split(',').map(s => s.trim()).filter(Boolean);
    if(!pfad){ einblenden('Bitte den Pfad des Themenzweigs angeben.'); return; }
    try {
      await hole('/api/zweig', {method:'POST', body:JSON.stringify({pfad, gruppen})});
      einblenden('Freigabe gesetzt.'); verwaltung();
    } catch(e){ einblenden(e.message); }
  };

  ablageVerdrahten();
}
function ablageVerdrahten(){
  /* Dieselbe Ablage, egal wo sie steht (Editor). Fehlt sie, ist nichts zu
     tun - dann zeigt die Ansicht sie gerade nicht. */
  const ablage = $('ablage'), datei = $('datei');
  if(!ablage || !datei) return;
  ['dragenter','dragover'].forEach(t => ablage.addEventListener(t, e => {
    e.preventDefault(); ablage.dataset.ueber = '1'; }));
  ['dragleave','drop'].forEach(t => ablage.addEventListener(t, e => {
    e.preventDefault(); ablage.dataset.ueber = '0'; }));
  ablage.addEventListener('drop', e => {
    if(e.dataTransfer.files.length) pruefen(e.dataTransfer.files[0]); });
  datei.onchange = () => { if(datei.files.length) pruefen(datei.files[0]); };
}
async function rechteKasten(slug, d){
  /* Freigabe einer Seite aendern, ohne sie neu einzuspielen (N-13). Der
     Verwalter sieht, welche Gruppen es im Wiki schon gibt, und klickt sie an. */
  const seite = (d.seiten || []).find(x => x.slug === slug);
  if(!seite) return;
  const bekannt = d.gruppen || [];
  const ziel = $('bericht') || $('flaeche');
  const kasten = document.createElement('div');
  kasten.className = 'karte';
  kasten.style.marginTop = '14px';
  kasten.innerHTML = `
    <h3>Freigabe für „${schuetzen(seite.titel)}"</h3>
    <div class="kontext">Leer heißt: alle Angemeldeten. Sonst sieht die Seite
      nur, wer in einer der Gruppen ist. Die Gruppen selbst legst du in
      Authentik an.</div>
    <input type="text" id="rechte-feld" style="margin-top:12px"
           value="${schuetzen((seite.gruppen || []).join(', '))}"
           placeholder="leer = alle">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${
      bekannt.map(g => `<button type="button" class="knopf rahmen ed-klein"
        data-g="${schuetzen(g)}">${schuetzen(g)}</button>`).join('') ||
      '<span style="font-size:12.5px;color:var(--ink-3)">Noch keine Gruppe im Wiki.</span>'}</div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="knopf" id="rechte-speichern">Freigabe setzen</button>
      <button class="knopf still" id="rechte-abbrechen">Abbrechen</button>
    </div>`;
  const alt = $('rechte-kasten');
  if(alt) alt.remove();
  kasten.id = 'rechte-kasten';
  ziel.parentElement.insertBefore(kasten, ziel.nextSibling);
  kasten.scrollIntoView({block:'nearest'});
  kasten.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const f = $('rechte-feld');
    const drin = f.value.split(',').map(x => x.trim()).filter(Boolean);
    const i = drin.indexOf(b.dataset.g);
    if(i >= 0) drin.splice(i, 1); else drin.push(b.dataset.g);
    f.value = drin.join(', ');
  });
  $('rechte-abbrechen').onclick = () => kasten.remove();
  $('rechte-speichern').onclick = async () => {
    const gruppen = $('rechte-feld').value.split(',').map(x => x.trim()).filter(Boolean);
    try {
      await hole('/api/rechte', {method:'POST',
        body:JSON.stringify({slug, gruppen})});
      einblenden(gruppen.length
        ? `„${seite.titel}" sieht jetzt nur: ${gruppen.join(', ')}.`
        : `„${seite.titel}" ist jetzt für alle Angemeldeten da.`);
      await baumLaden(); verwaltung();
    } catch(e){ einblenden(e.message); }
  };
}

       aber lesbar, sobald der Meta-Block steht - und der Editor baut

       Weg über den Editor da: Er räumt die meisten dieser Fehler auf,
       ohne dass jemand HTML anfassen muss. Vorher endete hier die Strecke,
       und genau das trifft jede Datei, die eine KI geschrieben hat. */
    if(b.meta){

/* ==================================================================
   Seiten-Editor
   Eine Seite ohne HTML-Kenntnisse anlegen und aendern.

   Der Editor schreibt kein neues Format, er ERZEUGT eine gewoehnliche
   Wiki-Seite: Meta-Block, Abschnitte mit id, Tokenblock, Pflichtteil. Sie
   laeuft danach durch dieselbe Strecke wie eine eingespielte Datei
   (/api/pruefen, /vorschau/, /api/import) und bekommt Fassungen und
   Ruecksprung wie jede andere.

   Die Quelle, die hier getippt wird, steht im Meta-Block je Abschnitt unter
   "markup". Darum laesst sich eine so erzeugte Seite spaeter wieder
   aufklappen und weiterschreiben. Der reine Text ohne Auszeichnung steht wie
   gehabt unter "text" - das ist der Suchstoff, und dort haben Sternchen und
   Zaeune nichts zu suchen.
   ================================================================== */

const EDITOR_WERKZEUG = 'editor-1';
/* Platzhalter fuer Code-Stuecke waehrend der Umwandlung. Ein Zeichen, das in
   getipptem Text nicht vorkommt, aber druckbar ist. */
const ED_HALT = '☃';

function edEscape(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function edInline(s){
  /* Erst schuetzen, dann Auszeichnung einsetzen: so kann getippter Text
     niemals zu Markup werden. */
  let t = edEscape(s);
  /* Code zuerst - innerhalb von Zaeunen gilt keine weitere Auszeichnung. */
  const code = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => {
    code.push(c); return ED_HALT + (code.length - 1) + ED_HALT; });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  /* Verweis auf eine andere Wiki-Seite: [[kennung]] oder [[kennung|Text]].
     Kein href - eine Seite im Rahmen darf nicht selbst navigieren. Der Knopf
     bittet die Huelle, die Seite zu oeffnen (wiki-oeffnen). */
  t = t.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (_, slug, text) =>
    '<button type="button" class="verweis" data-slug="' + slug + '">' +
    (text || slug) + '</button>');
  t = t.replace(new RegExp(ED_HALT + '(\\d+)' + ED_HALT, 'g'),
                (_, i) => '<code>' + code[+i] + '</code>');
  return t;
}
function edBloecke(text){
  const zeilen = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const aus = [];
  let i = 0;
  const istTabelle = z => /^\s*\|.*\|\s*$/.test(z);
  const sonderfall = z => /^(```|:::|##\s|!>|\?>|>|\s*[-*]\s|\s*\d+[.)]\s)/.test(z) || istTabelle(z);
  while(i < zeilen.length){
    const z = zeilen[i];
    if(!z.trim()){ i++; continue; }
    /* Baustein: :::art Titel ... ::: */
    const bs = z.match(/^:::([a-zäöüß]+)\s*(.*)$/i);
    if(bs){
      const inhalt = [];
      i++;
      while(i < zeilen.length && zeilen[i].trim() !== ':::'){ inhalt.push(zeilen[i]); i++; }
      i++;
      aus.push(edBaustein(bs[1].toLowerCase(), bs[2] || '', inhalt));
      continue;
    }
    if(/^```/.test(z.trim())){
      const inhalt = [];
      i++;
      while(i < zeilen.length && !/^```/.test(zeilen[i].trim())){ inhalt.push(zeilen[i]); i++; }
      i++;
      aus.push('<pre><code>' + edEscape(inhalt.join('\n')) + '</code></pre>');
      continue;
    }
    if(/^##\s+/.test(z)){
      aus.push('<h3>' + edInline(z.replace(/^##\s+/, '')) + '</h3>'); i++; continue;
    }
    const kasten = z.match(/^(!>|\?>|>)\s?(.*)$/);
    if(kasten){
      const zeichen = kasten[1];
      const klasse = zeichen === '!>' ? 'warn' : (zeichen === '?>' ? 'gut' : 'merk');
      const roh = new RegExp('^' + zeichen.replace(/[!?]/g, '\\$&') + '\\s?');
      const teil = [kasten[2]];
      i++;
      while(i < zeilen.length && roh.test(zeilen[i])){
        teil.push(zeilen[i].replace(roh, '')); i++;
      }
      let kopf = '', rest = teil;
      const m = (teil[0] || '').match(/^\*\*(.+)\*\*\s*$/);
      if(m){ kopf = '<b>' + edInline(m[1]) + '</b>'; rest = teil.slice(1); }
      aus.push('<div class="' + klasse + '">' + kopf +
               edInline(rest.join(' ').trim()) + '</div>');
      continue;
    }
    if(istTabelle(z)){
      const roh = [];
      while(i < zeilen.length && istTabelle(zeilen[i])){ roh.push(zeilen[i]); i++; }
      const zellen = r => r.trim().replace(/^\||\|$/g, '').split('|').map(s => s.trim());
      const trenn = r => /^[\s|:-]+$/.test(r);
      const kopf = zellen(roh[0]);
      const rest = roh.slice(trenn(roh[1] || '') ? 2 : 1);
      aus.push('<div class="tabelle"><table><thead><tr>' +
        kopf.map(c => '<th>' + edInline(c) + '</th>').join('') +
        '</tr></thead><tbody>' +
        rest.map(r => '<tr>' + zellen(r).map(c => '<td>' + edInline(c) + '</td>').join('') +
                      '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    if(/^\s*[-*]\s+/.test(z)){
      const p = [];
      while(i < zeilen.length && /^\s*[-*]\s+/.test(zeilen[i])){
        p.push('<li>' + edInline(zeilen[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++;
      }
      aus.push('<ul>' + p.join('') + '</ul>');
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(z)){
      const p = [];
      while(i < zeilen.length && /^\s*\d+[.)]\s+/.test(zeilen[i])){
        p.push('<li>' + edInline(zeilen[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++;
      }
      aus.push('<ol>' + p.join('') + '</ol>');
      continue;
    }
    const p = [];
    while(i < zeilen.length && zeilen[i].trim() && !sonderfall(zeilen[i])){
      p.push(zeilen[i].trim()); i++;
    }
    aus.push('<p>' + edInline(p.join(' ')) + '</p>');
  }
  return aus.join('\n      ');
}
function edNurText(text){
  /* Suchstoff: Auszeichnung weg, Inhalt bleibt. Ohne das stehen Sternchen
     und Zaeune im Suchtext und stoeren die Treffer. */
  return String(text || '')
    .replace(/```/g, ' ')
    /* Bausteine: Art und Zaeune weg, Titel und Zeilen bleiben Suchstoff. */
    .replace(/^:::([a-zäöüß]+)[ \t]*/gim, '')
    .replace(/^:::\s*$/gm, ' ')
    /* Trennzeile einer Tabelle (|---|---|) ist kein Inhalt. */
    .replace(/^\s*\|[\s|:-]+\|\s*$/gm, ' ')
    .replace(/^\s*(##|!>|\?>|>|[-*]|\d+[.)])\s+/gm, '')
    .replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (_, s, t) => t || s)
    .replace(/[*`|<>]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function edSlug(s){
  return String(s || '').toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}

function edBaustein(art, titel, zeilen){
  /* Ein Baustein wird zu fertigem HTML. Jede Zeile ist Inhalt, keine
     Anweisung - der Text wird wie ueberall zuerst geschuetzt. */
  const t = titel.trim();
  const kopf = t ? '<div class="bk-kopf">' + edInline(t) + '</div>' : '';
  const spalten = z => z.split('|').map(x => x.trim());

  if(art === 'klapp'){
    return '<details class="bk bk-klapp"><summary>' +
      edInline(t || 'Mehr dazu') + '</summary><div class="bk-innen">' +
      edBloecke(zeilen.join('\n')) + '</div></details>';
  }
  if(art === 'schritte'){
    const punkte = zeilen.filter(z => z.trim()).map(z => {
      const s = spalten(z);
      return '<li><b>' + edInline(s[0] || '') + '</b>' +
        (s[1] ? '<span>' + edInline(s.slice(1).join(' | ')) + '</span>' : '') + '</li>';
    }).join('');
    return '<div class="bk bk-schritte">' + kopf + '<ol>' + punkte + '</ol></div>';
  }
  if(art === 'kennzahlen'){
    const kacheln = zeilen.filter(z => z.trim()).map(z => {
      const s = spalten(z);
      return '<div class="bk-zahl"><span class="bk-wert">' +
        edInline(s[1] || '') + '</span><span class="bk-name">' +
        edInline(s[0] || '') + '</span>' +
        (s[2] ? '<span class="bk-klein">' + edInline(s[2]) + '</span>' : '') +
        '</div>';
    }).join('');
    return '<div class="bk bk-kennzahlen">' + kopf +
      '<div class="bk-zahlen">' + kacheln + '</div></div>';
  }
  if(art === 'gegenueber'){
    const seiten = zeilen.filter(z => z.trim()).slice(0, 4).map(z => {
      const s = spalten(z);
      return '<div class="bk-seite"><b>' + edInline(s[0] || '') + '</b><div>' +
        edInline(s.slice(1).join(' | ')) + '</div></div>';
    }).join('');
    return '<div class="bk bk-gegenueber">' + kopf +
      '<div class="bk-paar">' + seiten + '</div></div>';
  }
  if(art === 'begriffe'){
    const reihen = zeilen.filter(z => z.trim()).map(z => {
      const s = spalten(z);
      return '<tr><th scope="row">' + edInline(s[0] || '') + '</th><td>' +
        edInline(s.slice(1).join(' | ')) + '</td></tr>';
    }).join('');
    return '<div class="bk bk-begriffe">' + kopf +
      '<div class="tabelle"><table><tbody>' + reihen + '</tbody></table></div></div>';
  }
  if(art === 'pdf'){
    /* Ein PDF kann die Seite nicht selbst anzeigen: sie laeuft in einem
       abgeschotteten Rahmen, dessen CSP frame-src und object-src auf 'none'
       setzt - und das soll so bleiben. Darum stehen hier nur Knoepfe; die
       Huelle zeigt das PDF (und springt auf die Seite). Der Anhangsname
       steht NICHT hier: er kommt zur Laufzeit aus der Marke, die der Server
       beim Ausgliedern setzt (data-wiki-anhang). Sonst waere jede
       Umbenennung ein toter Knopf. */
    let kennung = '';
    const ziele = [];
    zeilen.forEach(z => {
      const roh = z.trim();
      if(!roh) return;
      const d = roh.match(/^datei\s*:\s*(.+)$/i);
      if(d){ kennung = d[1].trim(); return; }
      const s = roh.split('|').map(x => x.trim());
      ziele.push([s[0] || 'Stelle', s[1] || '']);
    });
    if(!kennung) return '<div class="warn"><b>PDF-Baustein ohne Datei</b>' +
      ' Im Editor ist keine Datei ausgewaehlt.</div>';
    const knopf = (text, seite) =>
      '<button type="button" class="bk-pdf-knopf" data-wiki-pdf="' +
      edEscape(kennung) + '"' + (seite ? ' data-wiki-seite="' + edEscape(seite) + '"' : '') +
      '>' + edInline(text) + (seite ? ' <span class="bk-pdf-seite">S.\u00a0' +
      edEscape(seite) + '</span>' : '') + '</button>';
    return '<div class="bk bk-pdf">' + kopf +
      '<div class="bk-pdf-reihe">' + knopf('Ganzes PDF', '') +
      ziele.map(([t, sn]) => knopf(t, sn)).join('') + '</div>' +
      '<div class="bk-hinweis">Das PDF liegt als Anhang dieser Seite bei und ' +
      'oeffnet sich im Wiki.</div></div>';
  }
  if(art === 'rechner'){
    /* Felder, Formel, Einheit. Die Formel steht in einem data-Attribut und
       wird von einem winzigen Rechenwerk gelesen - kein eval, sondern ein
       eigener Auswerter, der nur Zahlen, Feldnamen und + - * / ( ) kennt. */
    const felder = [];
    let formel = '', einheit = '', erklaerung = [];
    zeilen.forEach(z => {
      const roh = z.trim();
      if(!roh) return;
      if(roh.startsWith('=')){ formel = roh.slice(1).trim(); return; }
      const e = roh.match(/^Einheit\s*:\s*(.+)$/i);
      if(e){ einheit = e[1].trim(); return; }
      const f = roh.match(/^(.+?)=(.*)$/);
      if(f){
        felder.push({name: f[1].trim(), wert: f[2].trim()});
        return;
      }
      erklaerung.push(roh);
    });
    const kennung = 'r' + Math.random().toString(36).slice(2, 8);
    const eingaben = felder.map((f, i) => {
      /* Der Kurzname ist das erste Wort - damit die Formel kurz bleibt. */
      const kurz = (f.name.split(/\s+/)[0] || ('x' + i));
      return '<label><span>' + edInline(f.name) + '</span>' +
        '<input type="text" inputmode="decimal" data-feld="' + edEscape(kurz) +
        '" value="' + edEscape(f.wert) + '"></label>';
    }).join('');
    return '<div class="bk bk-rechner" data-rechner="' + kennung +
      '" data-formel="' + edEscape(formel) + '"' +
      (einheit ? ' data-einheit="' + edEscape(einheit) + '"' : '') + '>' +
      kopf + '<div class="bk-felder">' + eingaben + '</div>' +
      '<div class="bk-ergebnis"><span class="bk-erg-wert">—</span>' +
      (einheit ? '<span class="bk-erg-einheit">' + edEscape(einheit) + '</span>' : '') +
      '</div>' +
      (formel ? '<div class="bk-formel">' + edEscape(formel) + '</div>' : '') +
      (erklaerung.length ? '<div class="bk-hinweis">' +
        edInline(erklaerung.join(' ')) + '</div>' : '') +
      '</div>';
  }
  /* Unbekannte Art: als Merkkasten zeigen, statt sie zu verschlucken. */
  return '<div class="warn"><b>Unbekannter Baustein „' + edEscape(art) + '"</b>' +
    edInline(zeilen.join(' ')) + '</div>';
}

/* ---------------------------------------------------- Rechenwerk
   Der Auswerter fuer den Baustein "rechner". KEIN eval: er kennt Zahlen,
   Feldnamen, + - * / ( ) und nichts weiter. Damit kann aus einer Formel
   niemals Code werden - auch dann nicht, wenn die Seite aus fremder Quelle
   kommt.

   Die drei Funktionen stehen EINMAL hier, als echte Funktionen:
   - die Huelle ruft sie direkt auf, fuer die lebende Vorschau im Editor,
   - die erzeugte Seite bekommt ihren Quelltext ueber toString().

   Vorher war das Rechenwerk eine Liste von Zeichenketten, die die Huelle
   mit new Function() zum Leben gebracht haette. Das verbietet ihre CSP zu
   Recht ("unsafe-eval" steht nicht drin und soll nicht hinein) - der
   Browser hat es beim ersten Versuch sofort abgelehnt und damit das ganze
   Skript umgeworfen. Eine Vorschau ist kein Grund, die CSP aufzuweichen. */

function bkRechnen(formel, werte){
  var t = String(formel || ""), pos = 0;
  function raum(){ while(pos < t.length && /\s/.test(t[pos])) pos++; }
  function wert(){
    raum();
    var m = /^[0-9]+(?:[.,][0-9]+)?/.exec(t.slice(pos));
    if(m){ pos += m[0].length; return parseFloat(m[0].replace(",", ".")); }
    m = /^[A-Za-zÄÖÜäöüß_][A-Za-z0-9ÄÖÜäöüß_]*/.exec(t.slice(pos));
    if(m){
      pos += m[0].length;
      var w = werte[m[0]];
      return (w === undefined || w === null || w === "") ? NaN : w;
    }
    return NaN;
  }
  function klammer(){
    raum();
    if(t[pos] === "("){ pos++; var w = summe(); raum(); if(t[pos] === ")") pos++; return w; }
    if(t[pos] === "-"){ pos++; return -klammer(); }
    if(t[pos] === "+"){ pos++; return klammer(); }
    return wert();
  }
  function produkt(){
    var w = klammer();
    for(;;){
      raum();
      if(t[pos] === "*"){ pos++; w = w * klammer(); }
      else if(t[pos] === "/"){ pos++; var d = klammer(); w = (d === 0) ? NaN : w / d; }
      else return w;
    }
  }
  function summe(){
    var w = produkt();
    for(;;){
      raum();
      if(t[pos] === "+"){ pos++; w = w + produkt(); }
      else if(t[pos] === "-"){ pos++; w = w - produkt(); }
      else return w;
    }
  }
  var erg = summe();
  raum();
  /* Bleibt Text uebrig, war die Formel nicht zu lesen - dann lieber nichts
     zeigen als eine halbe Rechnung. */
  if(pos < t.length) return NaN;
  return erg;
}

function bkZahl(x){
  if(!isFinite(x)) return "—";
  var n = Math.abs(x);
  var stellen = n < 1 ? 3 : (n < 100 ? 2 : (n < 10000 ? 1 : 0));
  return x.toLocaleString("de-DE", {minimumFractionDigits: 0,
                                    maximumFractionDigits: stellen});
}

function bkRechnerStarten(wurzel){
  (wurzel || document).querySelectorAll(".bk-rechner").forEach(function(k){
    var felder = [].slice.call(k.querySelectorAll("[data-feld]"));
    var ziel = k.querySelector(".bk-erg-wert");
    function neu(){
      var werte = {};
      felder.forEach(function(f){
        var roh = String(f.value || "").trim().replace(",", ".");
        var z = parseFloat(roh);
        werte[f.dataset.feld] = isFinite(z) ? z : "";
        f.setAttribute("aria-invalid", (roh !== "" && !isFinite(z)) ? "true" : "false");
      });
      if(ziel) ziel.textContent = bkZahl(bkRechnen(k.dataset.formel, werte));
    }
    felder.forEach(function(f){ f.addEventListener("input", neu); });
    neu();
  });
}

/* Derselbe Quelltext fuer die erzeugte Seite. toString() gibt genau das,
   was oben steht - damit rechnet die Seite mit demselben Code wie die
   Vorschau, ohne dass er zweimal dasteht. */
const ED_RECHENWERK = [
  '  /* Rechenwerk der Bausteine (aus der Huelle uebernommen): ein eigener',
  '     kleiner Auswerter, KEIN eval. Er kennt Zahlen, Feldnamen und',
  '     + - * / ( ) - nichts weiter. */'
].concat([bkRechnen, bkZahl, bkRechnerStarten].map(function(f){
  return f.toString().split('\n').map(function(z){ return '  ' + z; }).join('\n');
})).join('\n');
