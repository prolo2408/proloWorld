# wiki/docker-compose.yml
#
# DIE HERSTELLERDATEI des Wikis. Sie gehoert zum Werkzeug, nicht zum
# Betrieb: im eigenen Repository (prolo2408/wiki) liegt dieselbe Datei, und
# proloWorld uebernimmt sie unveraendert - wie die Datei von n8n.
#
# Hier steht, was das WERKZEUG braucht: Abbild, Volumes, Umgebung, Rechte.
# Netz, Route, Anmeldung und Speichergrenzen sind Sache des Betriebs und
# stehen daneben in docker-compose.override.yml.

# Fester Projektname: danach heissen die Volumes (wiki_wiki_daten ...).
name: wiki

services:
  wiki:
    # build: nur fuer den Bau aus dem Quellcode. Ist das Abbild einmal
    # veroeffentlicht, holt der Betrieb es von ghcr.io.
    build: .
    # image: ist Pflicht, auch beim eigenen Dockerfile (B-23): es ist der
    # Rueckweg von aktualisieren.sh. Die Fassung passt zum CHANGELOG.md und
    # zu server.py (tests/test_fassung.py haelt die drei zusammen).
    image: ghcr.io/prolo2408/wiki:1.4.1
    container_name: wiki
    restart: unless-stopped
    # Rechte nach CLAUDE.md §19 (B-29): keine Linux-Faehigkeiten, keine
    # Rechteausweitung ueber setuid.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only ist hier NICHT moeglich: pdftotext schreibt
    # Zwischendateien, und der Vorschauordner /seiten/.vorschau wird zur
    # Laufzeit gefuellt.
    env_file: .env
    environment:
      # Die Marke der Vertrauensgrenze (N-44). Mit ":?" bricht schon
      # "docker compose up" ab und sagt, was fehlt - besser als ein
      # Container, der startet und dann jede Anfrage mit 401 abweist.
      PROLO_EINLASS: "${PROLO_EINLASS:?PROLO_EINLASS fehlt in wiki/.env - sudo prolo geheimnisse --verteilen}"
      WIKI_ADMIN_GRUPPE: "${WIKI_ADMIN_GRUPPE:-wiki-admin}"
      WIKI_ADMIN_NUTZER: "${WIKI_ADMIN_NUTZER:-}"
    volumes:
      - wiki_daten:/daten
      - wiki_seiten:/seiten
    labels:
      # Welche Gruppen dieses Werkzeug in Authentik erwartet (N-95). Das
      # Werkzeug sagt es selbst - "prolo einrichten" liest es von hier.
      # Form: <gruppe>=<wozu>; <gruppe>=<wozu>
      - "prolo.gruppen=wiki-editor=Seiten anlegen und die eigenen bearbeiten; wiki-admin=das Wiki verwalten"

volumes:
  wiki_daten:
  wiki_seiten:
