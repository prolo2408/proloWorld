services:
  wiki:
    build: .
    # image: ist Pflicht, auch beim eigenen Dockerfile (B-23). Das zentrale
    # aktualisieren.sh liest genau diese Zeile, um sich die bisherige Fassung
    # zu merken:
    #   ALT=$(grep -E '^\s*image:' .../docker-compose.yml | head -1 | ...)
    #   echo "$ALT" > .../.letzte-fassung
    # Ohne sie blieb ALT leer, .letzte-fassung enthielt nichts, und der
    # dokumentierte Rueckweg war fuer das Wiki nicht vorhanden. Bordbuch
    # machte es richtig (build: . UND image: bordbuch:2.5.2).
    #
    # Die Fassung passt zum CHANGELOG.md und wird dort mitgezogen.
    image: wiki:1.0.0
    container_name: wiki
    # Grenzen nach Betriebsregeln 5 (B-29). Vorher hatte KEIN Container
    # mem_limit, pids_limit, cap_drop oder security_opt. Folgen: ein
    # Speicherleck in einem Tool brachte den GANZEN Server in den OOM-Killer,
    # nicht nur sich selbst; die Container liefen mit dem vollen
    # Standardsatz an Linux-Faehigkeiten, obwohl keiner davon welche
    # braucht; und ohne no-new-privileges ermoeglicht eine Datei mit
    # gesetztem setuid-Bit im Abbild eine Rechteausweitung.
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only ist hier NICHT moeglich: pdftotext schreibt
    # Zwischendateien, und der Vorschauordner /seiten/.vorschau wird zur
    # Laufzeit gefuellt.
    restart: unless-stopped
    env_file: .env
    environment:
      WIKI_ADMIN_GRUPPE: "${WIKI_ADMIN_GRUPPE:-wiki-admin}"
      WIKI_ADMIN_NUTZER: "${WIKI_ADMIN_NUTZER:-}"
    volumes:
      - wiki_daten:/daten
      - wiki_seiten:/seiten
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.wiki.loadbalancer.server.port=8080"
      - "traefik.http.routers.wiki.rule=Host(`wiki.prolo.me`)"
      - "traefik.http.routers.wiki.entrypoints=websecure"
      - "traefik.http.routers.wiki.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wiki.middlewares=authentik@file"
      - "traefik.http.routers.wiki.service=wiki"

volumes:
  wiki_daten:
  wiki_seiten:

networks:
  proxy:
    external: true
