# /opt/stack/wiki/sicherung.conf

# Benannte Docker-Volumes. Namen pruefen mit:
#   docker volume ls | grep wiki
VOLUMES="wiki_wiki_daten wiki_wiki_seiten"

# SQLite liegt im Volume, kein eigener Datenbank-Container.
DB_CONTAINER=""
DB_USER=""
DB_NAME=""

DATEIEN=".env"

HINWEIS="Seiten und Anhaenge liegen in wiki_wiki_seiten, der Suchindex in
wiki_wiki_daten. Der Index laesst sich aus den Seiten neu bauen
(Verwaltung), die Seiten selbst nicht. Keine ungeschuetzten Webhook-Pfade;
ohne Anmeldung ist nur /gesundheit erreichbar."
