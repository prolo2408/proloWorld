# crowdsec/sicherung.conf

# crowdsec-daten: die Datenbank (Sperren, Meldungen, Freigabeliste,
# angemeldete Bouncer). crowdsec-konfig: was CrowdSec aus dem Hub geholt
# hat, dazu seine Anmeldung bei der Gemeinschaft und der Konsole.
VOLUMES="crowdsec_crowdsec-daten crowdsec_crowdsec-konfig"

DB_CONTAINER=""
DB_USER=""
DB_NAME=""

DATEIEN=".env"

# Leer, mit Absicht: das SQLite-Feld kopiert ueber python3 IM Container, und
# das Abbild hat keins. Die Datenbank kommt mit dem Volume - siehe HINWEIS.
SQLITE=""

ORDNER=""

VOLUMES_OHNE="config.yaml.local|liegt im Git
profiles.yaml|liegt im Git
erfassung|liegt im Git
regeln|liegt im Git"

HINWEIS="Die Firewall des Stapels (F-01). Ohne sie laeuft alles weiter,
nur ohne Sperren: der Bouncer auf dem Server behaelt, was er hat, und
bekommt nichts Neues.

crowdsec.db wird mit dem Volume gesichert, also moeglicherweise mitten in
einer Schreibaktion. Das ist vertretbar, weil fast alles darin Arbeitsstand
ist: Sperren laufen ab, Meldungen sind Verlauf, der Bouncer meldet sich
beim Start neu an. Was bleiben muss, ist die Freigabeliste ('sudo prolo
firewall' zeigt sie). Startet CrowdSec nach einer Wiederherstellung nicht
(database disk image is malformed): crowdsec.db im Volume loeschen,
starten, Freigaben mit 'sudo prolo firewall erlauben <adresse> <grund>'
wieder eintragen.

Kein Router, keine Anmeldung, keine Oberflaeche: die lokale API liegt nur
auf 127.0.0.1:8080 (fuer den Bouncer). Zu sehen ist alles auf der
Server mit 'sudo prolo firewall'."
