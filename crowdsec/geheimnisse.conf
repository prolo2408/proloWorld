# GEHEIMNISSE dieses Werkzeugs - gelesen von "prolo geheimnisse".
# Format: NAME | DATEI | FORM | WECHSEL | Erklaerung (siehe traefik/geheimnisse.conf)
CROWDSEC_BOUNCER_SCHLUESSEL|.env|env|haende|Mit ihm holt der Firewall-Bouncer auf dem Server die Sperren ab. Steht ein zweites Mal in /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml und in der Datenbank von CrowdSec, die ihn nur beim ERSTEN Start uebernimmt. Wechsel: neuen Wert in .env, 'docker exec crowdsec cscli bouncers delete firewall', 'sudo prolo neustart crowdsec', 'sudo prolo einrichten'.
