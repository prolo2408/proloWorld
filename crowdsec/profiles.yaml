# Was aus einer Meldung wird - die Dauer einer Sperre.
#
# Die Datei ersetzt die Vorgabe des Abbilds (dort: jede Sperre 4 Stunden).
# Geaendert wird HIER, im Git, und danach "prolo neustart crowdsec".
# Die erste passende Regel gewinnt (on_success: break).

# Eigene Regeln (regeln/): wer in die Falle geht oder Links raet, hat keinen
# Grund zurueckzukommen - einen Tag.
name: prolo_eigene_regeln
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() startsWith "prolo/"
decisions:
  - type: ban
    duration: 24h
on_success: break
---
# Alles andere (Regeln aus dem Hub, SSH): 4 Stunden, und jedes Wiederkommen
# 4 Stunden mehr - die dritte Sperre dauert 12.
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
on_success: break
---
name: default_range_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
  - type: ban
    duration: 4h
on_success: break
