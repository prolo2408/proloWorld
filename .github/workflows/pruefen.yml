# Bei jedem Push und jedem Pull Request: erst die schnellen Pruefungen als
# gewoehnlicher Nutzer (so, wie es auch lokal laufen soll), dann der echte
# Durchlauf mit Docker, Traefik und Authentik.
name: Pruefen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    name: Tests und Gegenprobe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck age
      - name: tests/alle.sh
        run: tests/alle.sh

  durchlauf:
    name: Durchlauf mit Docker
    needs: pruefen
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: tests/durchlauf.py
        run: sudo python3 tests/durchlauf.py
