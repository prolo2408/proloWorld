# /opt/stack/authentik/aktualisierung.conf

TYP="image"

# Authentik ist das einzige Tool mit mehreren Containern: authentik-db,
# authentik-server und authentik-worker. Das Aktualisierungsskript findet
# sie ueber "docker compose ps" und prueft jeden einzeln - darum steht hier
# kein Containername.
#
# HAUPT legt fest, aus wessen Netz die URL-Pruefung laeuft. Ohne die Angabe
# waere es der erste Container aus der Liste, und das ist die Datenbank.
HAUPT="authentik-server"
PRUEF_URL="http://authentik-server:9000/-/health/live/"

# Authentik wandert bei jedem Start durch seine Migrationen. Das dauert,
# besonders nach einem Versionssprung.
PRUEF_WARTEN=120
