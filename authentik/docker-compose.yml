services:
  postgresql:
    # Feste Nebenversion (B-28). "16-alpine" ist ein wandernder
    # Kennzeichner: ein docker compose pull holt heute 16.4 und morgen 16.9.
    # Der Geist von CLAUDE.md §19 ist, dass man weiss, was laeuft - und
    # bei der DATENBANK ist das besonders wichtig, weil dort ein
    # unbeabsichtigter Fassungswechsel am teuersten ist. Authentik, n8n und
    # Traefik waren sauber festgelegt; die Datenbank war die einzige Ausnahme.
    #
    # Die tatsaechlich laufende Fassung feststellen und hier eintragen:
    #   docker exec authentik-db postgres --version
    # Nur NEBENVERSIONEN ohne Weiteres anheben. Ein Sprung von 16 auf 17
    # verlangt pg_upgrade oder Sichern und Einspielen (CLAUDE.md §25).
    image: docker.io/library/postgres:16.10-alpine
    container_name: authentik-db
    # Grenzen nach CLAUDE.md §19 (B-29).
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # cap_drop ALL waere zu eng: postgres legt beim Start seinen
    # Datenordner an und braucht dafuer CHOWN, SETUID und SETGID, um vom
    # Start-Skript auf den unprivilegierten Nutzer zu wechseln.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - internal

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.2}
    container_name: authentik-server
    # Grenzen nach CLAUDE.md §19 (B-29).
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: server
    restart: unless-stopped
    shm_size: 512mb
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - internal
      - netz-authentik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=netz-authentik"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

      # Router 1: die Authentik-Oberfläche selbst
      # Authentik IST die Anmeldung - es kann nicht hinter sich selbst
      # haengen. Das ist der Urfall von §17a und wird genauso erklaert
      # wie jeder andere: ein fehlendes "middlewares=" soll nie
      # stillschweigend durchgehen (N-59). Eigene Anmeldung heisst
      # hier: das Konto in Authentik selbst, mit 2FA.
      - "prolo.anmeldung=eigene"
      - "traefik.http.routers.authentik.rule=Host(`auth.prolo.me`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.authentik.service=authentik"

      # Router 2: nur der Outpost-Pfad, aber auf allen Subdomains DES STACKS.
      #
      # Vorher stand hier HostRegexp(`^.+$$`) - das traf JEDEN Hostnamen, auch
      # solche, die nicht zum Stack gehoeren (B-27). Wer einen eigenen Namen
      # auf die Server-IP zeigen liess, erreichte ueber
      # /outpost.goauthentik.io/ den Authentik-Outpost. Zusammen mit tls=true
      # ohne certresolver wurde dabei das Standardzertifikat ausgeliefert:
      # Besucher sahen eine Zertifikatswarnung und dahinter eine echte
      # Anmeldeoberflaeche - eine brauchbare Grundlage fuer eine
      # Taeuschungsseite.
      #
      # Die Absicht war richtig (der Outpost-Pfad muss auf allen Subdomains
      # verfuegbar sein), nur zu weit gefasst. Traefik 3 benutzt Go-Regexp,
      # darum der maskierte Punkt; im Compose verdoppelt sich das $.
      - "traefik.http.routers.authentik-outpost.rule=HostRegexp(`^[a-z0-9-]+\\.prolo\\.me$$`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.authentik-outpost.entrypoints=websecure"
      # certresolver statt nur tls=true: sonst kommt das Standardzertifikat.
      - "traefik.http.routers.authentik-outpost.tls.certresolver=letsencrypt"
      - "traefik.http.routers.authentik-outpost.priority=1000"
      - "traefik.http.routers.authentik-outpost.service=authentik"

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.2}
    container_name: authentik-worker
    # Grenzen nach CLAUDE.md §19 (B-29).
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: worker
    restart: unless-stopped
    shm_size: 512mb
    # Bewusst KEIN "user: root" und KEIN Docker-Socket (B-01):
    # Root im Container plus schreibender Docker-Socket ist gleichbedeutend
    # mit Root auf dem Host - wer hier Code ausfuehren kann, startet ueber die
    # Docker-API einen privilegierten Container und hat den ganzen Server.
    # Der Socket wird nur fuer Docker-basierte Outposts gebraucht; dieser
    # Stack benutzt den Embedded Outpost ueber Traefik-ForwardAuth
    # (traefik/dynamic/authentik.yml). Die Einbindung war also funktionslos.
    # Startet der Worker nicht, liegt es an Schreibrechten auf ./data oder
    # ./certs - dann dort die Rechte setzen, nicht user: root zuruecknehmen:
    #   sudo chown -R 1000:1000 /opt/stack/authentik/data /opt/stack/authentik/certs
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - internal

volumes:
  database:
    driver: local

networks:
  internal:
# Eigenes Netz je Werkzeug (N-45). Vorher hingen Wiki, Bordbuch, n8n und
# Authentik im selben Netz "proxy" - und in einem Docker-Netz erreicht jeder
# Container jeden anderen direkt, ohne Traefik und ohne Anmeldung. Damit war
# der Weg von n8n (fuehrt angeklickte Ablaeufe mit einem HTTP-Baustein aus,
# hat Webhook-Pfade ohne Anmeldung) zum Wiki offen. Jetzt gibt es ihn nicht
# mehr: nur Traefik haengt in allen Netzen, die Werkzeuge in je ihrem.
#
# Anlegen, einmalig je Server:  docker network create netz-authentik
  netz-authentik:
    external: true
