# /opt/stack/authentik/sicherung.conf

VOLUMES="authentik_database"
DB_CONTAINER="authentik-db"
DB_USER="authentik"
DB_NAME="authentik"
DATEIEN=".env"

# Bind-Mounts aus dem Tool-Ordner (neu aus B-08). DATEIEN kopiert nur
# Dateien - ./data und ./certs sind Ordner und wurden damit von KEINER
# Sicherung erfasst, obwohl dort Medien, eigene Vorlagen und Zertifikate
# liegen.
ORDNER="data certs ?custom-templates"

# Kein SQLite - Authentik hat einen eigenen PostgreSQL-Container.
SQLITE=""

HINWEIS="EIGENE ANMELDUNG (prolo.anmeldung=eigene, §17a): Authentik ist
die Anmeldung und kann nicht hinter sich selbst haengen. Das Konto dort
gehoert mit 2FA gesichert - es ist der Schluessel zum ganzen Stack.
data/, certs/ und custom-templates/ sind Bind-Mounts, keine Volumes -
darum ORDNER. Die Datenbank kommt ueber pg_dump, nicht aus dem Volume-Tar.
Bei PostgreSQL nur Nebenversionen ohne Weiteres anheben; ein Sprung von 16
auf 17 verlangt pg_upgrade oder Sichern und Einspielen."
