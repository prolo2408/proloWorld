# /opt/stack/www/sicherung.conf

# Benannte Docker-Volumes. Namen pruefen mit:
#   docker volume ls | grep www
VOLUMES="www_www_daten www_www_seiten"

DB_CONTAINER=""
DB_USER=""
DB_NAME=""

DATEIEN=".env"

# SQLite im Container - konsistent ueber sqlite3.backup() statt aus dem
# laufenden Volume (CLAUDE.md §23).
SQLITE="www:/daten/www.db"

ORDNER=""

HINWEIS="Die hochgeladenen Seiten liegen in www_www_seiten, die Freigaben und
ihre Abdruecke in www_www_daten. Eine verlorene Datenbank heisst: alle
ausgegebenen Links sind tot - die Seiten selbst nicht.

Dieses Werkzeug hat ZWEI Router. Der oeffentliche (prolo.me, www.prolo.me)
laeuft OHNE authentik@file - das ist Absicht, sonst kaeme niemand an eine
freigegebene Seite. Der zweite (PathPrefix /verwaltung) laeuft MIT
authentik@file und hoeherer priority. Beide haengen an der
Vertrauensgrenze; ohne PROLO_EINLASS antwortet das Werkzeug gar nicht.

Ohne Anmeldung erreichbar sind /gesundheit, /api/version, die Startseite
und die Zugangslinks unter /z/. Nichts davon gibt etwas preis, das nicht
ausdruecklich freigegeben wurde."
