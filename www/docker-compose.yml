# www/docker-compose.yml
#
# DIE HERSTELLERDATEI von prolo.me. Sie gehoert zum Werkzeug, nicht zum
# Betrieb: im eigenen Repository (prolo2408/www) liegt dieselbe Datei, und
# proloWorld uebernimmt sie unveraendert - wie die Datei von n8n.
#
# EINE Abweichung vom Muster der anderen Werkzeuge, und sie ist Absicht:
# die beiden ROUTER stehen hier und nicht in der override-Datei. Welche
# Pfade oeffentlich sind und welche nicht, ist bei diesem Werkzeug keine
# Frage des Betriebs, sondern seine Sicherheitsgrenze (N-74) - und
# tests/test_freigabe.py haelt Code und Regel zusammen. Das geht nur, wenn
# beide im selben Repository liegen. Netz und Speichergrenzen sind wie
# ueberall Sache des Betriebs: docker-compose.override.yml.

# Fester Projektname: danach heissen die Volumes (www_www_daten ...).
name: www

services:
  www:
    # build: nur fuer den Bau aus dem Quellcode. Ist das Abbild einmal
    # veroeffentlicht, holt der Betrieb es von ghcr.io.
    build: .
    # image: ist Pflicht, auch beim eigenen Dockerfile. Das zentrale
    # aktualisieren.sh liest genau diese Zeile, um sich die bisherige
    # Fassung zu merken - ohne sie gibt es keinen Rueckweg.
    # Die Fassung passt zum CHANGELOG.md und wird dort mitgezogen.
    image: ghcr.io/prolo2408/www:1.1.1
    container_name: www
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Moeglich, weil ausschliesslich in /daten und /seiten geschrieben wird.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    environment:
      # Die Marke der Vertrauensgrenze (N-44). Mit ":?" bricht schon
      # "docker compose up" ab und sagt, was fehlt - besser als ein
      # Container, der startet und dann jede Anfrage mit 401 abweist.
      PROLO_EINLASS: "${PROLO_EINLASS:?PROLO_EINLASS fehlt in www/.env - sudo prolo geheimnisse --verteilen}"
      WWW_ADMIN_GRUPPE: "${WWW_ADMIN_GRUPPE:-stack-admin}"
      WWW_MAX_UPLOAD_B: "${WWW_MAX_UPLOAD_B:-20971520}"
    volumes:
      - www_daten:/daten
      - www_seiten:/seiten
    labels:
      # Welche Gruppen dieses Werkzeug in Authentik erwartet (N-95). Das
      # Werkzeug sagt es selbst - "prolo einrichten" liest es von hier,
      # statt eine eigene Liste zu fuehren, die veraltet.
      # Form: <gruppe>=<wozu>; <gruppe>=<wozu>
      - "prolo.gruppen=stack-admin=Seiten und Zugangslinks auf prolo.me verwalten"
      - "traefik.enable=true"
      - "traefik.http.services.www.loadbalancer.server.port=8080"

      # ZWEI Router auf denselben Namen - das ist der Kern dieses Werkzeugs.
      #
      # 1. Oeffentlich, OHNE authentik@file: die Startseite und die
      #    Zugangslinks. Eine Personalerin hat kein Konto und soll keines
      #    brauchen. Die Startseite verraet nichts, und ein Zugangslink ist
      #    192 Bit lang, laeuft ab und ist widerrufbar.
      # Dieser Router ist mit ABSICHT offen: die Startseite und die
      # Zugangslinks muessen ohne Anmeldung gehen - eine Personalerin
      # hat kein Konto. Erklaert statt stillschweigend: ein fehlendes
      # "middlewares=" sieht sonst genauso aus wie ein vergessenes
      # (§17a, N-59). Die Verwaltung darunter bleibt geschuetzt.
      - "prolo.oeffentlich=www"
      - "traefik.http.routers.www.rule=Host(`prolo.me`) || Host(`www.prolo.me`)"
      - "traefik.http.routers.www.entrypoints=websecure"
      - "traefik.http.routers.www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www.service=www"

      # 2. Die Verwaltung, MIT authentik@file und hoeherer priority. Ohne
      #    die hoehere Zahl gewaenne der Router oben, weil er dieselbe
      #    Regel breiter fasst - und die Verwaltung staende offen.
      #    Das Werkzeug prueft die Gruppe ZUSAETZLICH selbst (§17).
      #
      #    Dieser Praefix ist die Grenze (N-74): ALLES, was Verwalter-
      #    rechte braucht, liegt unter /verwaltung - die Seite und jeder
      #    Aufruf darunter (/verwaltung/api/...). Vorher lagen die
      #    Aufrufe unter /api/ und wurden von dieser Regel nicht
      #    getroffen; sie liefen ueber den oeffentlichen Router und
      #    bekamen nie eine Identitaetskopfzeile. Offen stand dadurch
      #    nichts - die eigene Pruefung hat alles mit 401 abgewiesen -,
      #    aber die Verwaltung war unbenutzbar.
      #
      #    Wer hier einen Aufruf dazunimmt, legt ihn unter den Praefix.
      #    Eine Ausnahmeliste ("/api/ ausser /api/version") waere der
      #    naechste Fehler. www/tests/test_freigabe.py haelt beide
      #    Seiten zusammen.
      - "traefik.http.routers.www-verwaltung.rule=(Host(`prolo.me`) || Host(`www.prolo.me`)) && PathPrefix(`/verwaltung`)"
      - "traefik.http.routers.www-verwaltung.entrypoints=websecure"
      - "traefik.http.routers.www-verwaltung.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www-verwaltung.middlewares=authentik@file"
      - "traefik.http.routers.www-verwaltung.priority=100"
      - "traefik.http.routers.www-verwaltung.service=www"

volumes:
  www_daten:
  www_seiten:
