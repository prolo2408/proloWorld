# www/docker-compose.override.yml
#
# UNSERE ZUTAT - die des Betriebs. Die Herstellerdatei daneben gehoert zum
# Werkzeug (prolo2408/www) und bleibt unveraendert. Die Router stehen bei
# diesem Werkzeug mit Absicht dort, nicht hier - der Grund steht in ihrem
# Kopf.
#
# Was hier steht und sonst nichts:
#   - das Netz netz-www (Abschottung, N-45)
#   - die Speichergrenzen nach §19

services:
  www:
    # Grenzen nach CLAUDE.md §19. Ohne sie bringt ein Speicherleck in EINEM
    # Werkzeug den ganzen Server in den OOM-Killer.
    mem_limit: 512m
    pids_limit: 256

    networks:
      - netz-www

    labels:
      - "traefik.docker.network=netz-www"

networks:
  # Eigenes Netz je Werkzeug (N-45): in einem gemeinsamen Netz erreicht
  # jeder Container jeden anderen direkt, ohne Traefik und ohne Anmeldung.
  # Angelegt und bei Traefik eingetragen mit:
  #   sudo prolo netze anlegen netz-www
  netz-www:
    external: true
