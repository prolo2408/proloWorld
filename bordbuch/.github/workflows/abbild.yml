# Pruefen bei jedem Push und Pull Request. Bei einem Tag v<fassung>
# zusaetzlich: das Abbild bauen und nach ghcr.io schieben. Der Betrieb
# (prolo2408/proloWorld) holt es von dort - gebaut wird auf dem Server
# nichts mehr.
name: Pruefen und Abbild

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Die Oberflaechen-Tests laufen mit node. Ohne node meldet alle.sh
      # einen Fehlschlag - ein uebersprungener Test ist kein gruener Test.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: ./tests/alle.sh
      # Haben die Tests Zaehne? (CLAUDE.md §13a)
      - name: Gegenprobe
        run: bash tests/gegenprobe.sh
      - name: Fassung an drei Stellen gleich (§24)
        run: |
          python3 - <<'PY'
          import re, sys
          code = re.search(r'^VERSION = "([^"]+)"', open("server.py").read(), re.M).group(1)
          bild = re.search(r"^\s*image:\s*\S+:(\S+)", open("docker-compose.yml").read(), re.M).group(1)
          liste = re.search(r"^## (?:Fassung )?(\d+\.\d+\.\d+)", open("CHANGELOG.md").read(), re.M).group(1)
          print("server.py %s | docker-compose.yml %s | CHANGELOG.md %s" % (code, bild, liste))
          sys.exit(0 if code == bild == liste else 1)
          PY
      - name: Dockerfile ohne Kommentar in Fortsetzungszeilen
        run: |
          python3 - <<'PY'
          import sys
          fort = False; fehler = 0
          for i, z in enumerate(open("Dockerfile").read().split("\n"), 1):
              if fort and z.strip().startswith("#"):
                  print("Dockerfile:%d  Kommentar in Fortsetzungszeile" % i); fehler = 1
              fort = z.rstrip().endswith("\\")
          sys.exit(fehler)
          PY
      - name: Das Abbild laesst sich bauen und startet gesund
        run: |
          docker build -t probe:ci .
          docker run -d --name probe -e PROLO_EINLASS=ci-probe probe:ci
          for _ in $(seq 1 30); do
            s=$(docker inspect probe --format '{{.State.Health.Status}}' 2>/dev/null || echo fehlt)
            [ "$s" = healthy ] && break
            sleep 2
          done
          docker logs probe | tail -20
          [ "$s" = healthy ] || { echo "Nach 60 s nicht gesund: $s"; exit 1; }

  abbild:
    needs: pruefen
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write     # die Veroeffentlichung mit der Herstellerdatei
      packages: write     # das Abbild auf ghcr.io
    steps:
      - uses: actions/checkout@v4
      - name: Tag, Code und Herstellerdatei nennen dieselbe Fassung
        id: fassung
        run: |
          FASSUNG="${GITHUB_REF_NAME#v}"
          BILD=$(grep -m1 -E '^\s*image:' docker-compose.yml | sed -E 's/^\s*image:\s*//; s/\s*#.*$//')
          CODE=$(python3 server.py --version)
          echo "Tag $FASSUNG | server.py $CODE | Abbild $BILD"
          [ "$CODE" = "$FASSUNG" ] || { echo "Erst die Fassung in server.py, dann der Tag (§24)."; exit 1; }
          [ "${BILD##*:}" = "$FASSUNG" ] || { echo "docker-compose.yml nennt eine andere Fassung."; exit 1; }
          case "$BILD" in ghcr.io/${{ github.repository_owner }}/*) ;; *) echo "Das Abbild gehoert nach ghcr.io/${{ github.repository_owner }}/"; exit 1 ;; esac
          echo "bild=$BILD" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Eine veroeffentlichte Fassung wird nie ueberschrieben (§16): sonst
      # zeigt der Rueckweg des Betriebs auf ein anderes Abbild als vorher.
      - name: Gibt es diese Fassung schon?
        run: |
          if docker manifest inspect "${{ steps.fassung.outputs.bild }}" >/dev/null 2>&1; then
            echo "${{ steps.fassung.outputs.bild }} gibt es schon. Eine neue Fassung braucht eine neue Nummer."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.fassung.outputs.bild }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
      # Die Herstellerdatei haengt an der Veroeffentlichung - ohne build:,
      # so wie der Betrieb sie uebernimmt.
      - name: Veroeffentlichung mit der Herstellerdatei
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v -E '^\s*build:' docker-compose.yml > docker-compose.betrieb.yml
          awk -v f="${GITHUB_REF_NAME#v}" '
            /^## / { if (drin) exit; if (index($0, f)) { drin = 1; next } }
            drin { print }' CHANGELOG.md > notizen.md
          gh release create "$GITHUB_REF_NAME" docker-compose.betrieb.yml#docker-compose.yml \
            --title "$GITHUB_REF_NAME" --notes-file notizen.md
