# bordbuch/docker-compose.override.yml
#
# UNSERE ZUTAT - die des Betriebs. Die Herstellerdatei daneben gehoert zum
# Werkzeug (prolo2408/bordbuch) und bleibt unveraendert.
#
# Was hier steht und sonst nichts:
#   - das Netz netz-bordbuch (Abschottung, N-45)
#   - die Route auf bordbuch.prolo.me, das Zertifikat, die Anmeldung
#   - die Speichergrenzen nach §19

services:
  bordbuch:
    # Grenzen nach CLAUDE.md §19 (B-29). Ohne sie bringt ein Speicherleck
    # in EINEM Werkzeug den ganzen Server in den OOM-Killer.
    mem_limit: 512m
    pids_limit: 256

    networks:
      - netz-bordbuch

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=netz-bordbuch"
      - "traefik.http.services.bordbuch.loadbalancer.server.port=8080"
      - "traefik.http.routers.bordbuch.rule=Host(`bordbuch.prolo.me`)"
      - "traefik.http.routers.bordbuch.entrypoints=websecure"
      - "traefik.http.routers.bordbuch.tls.certresolver=letsencrypt"
      # Ohne diese Zeile steht das Fahrtenbuch offen im Netz.
      - "traefik.http.routers.bordbuch.middlewares=authentik@file"
      - "traefik.http.routers.bordbuch.service=bordbuch"

networks:
  # Eigenes Netz je Werkzeug (N-45): in einem gemeinsamen Netz erreicht
  # jeder Container jeden anderen direkt, ohne Traefik und ohne Anmeldung.
  # Angelegt und bei Traefik eingetragen mit:
  #   sudo prolo netze anlegen netz-bordbuch
  netz-bordbuch:
    external: true
