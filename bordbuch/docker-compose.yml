# bordbuch/docker-compose.yml
#
# DIE HERSTELLERDATEI des Bordbuchs. Sie gehoert zum Werkzeug, nicht zum
# Betrieb: im eigenen Repository (prolo2408/bordbuch) liegt dieselbe Datei,
# und proloWorld uebernimmt sie unveraendert - wie die Datei von n8n.
#
# Hier steht, was das WERKZEUG braucht: Abbild, Volumes, Umgebung, Rechte.
# Netz, Route, Anmeldung und Speichergrenzen sind Sache des Betriebs und
# stehen daneben in docker-compose.override.yml. "docker compose" liest
# beide von selbst; was dabei herauskommt, zeigt "docker compose config".
#
# Bewusst KEINE ports-Zeile: der Dienst ist ausschliesslich ueber Traefik
# erreichbar. Bordbuch vertraut den Anmeldekoepfen von Authentik, und die
# waeren faelschbar, sobald jemand den Container direkt erreicht.

# Der Projektname steht fest: danach heissen die Volumes
# (bordbuch_bordbuch_daten ...). Ohne ihn haenge er am Ordnernamen - und
# ein Klon unter anderem Namen faende seine Daten nicht.
name: bordbuch

services:
  bordbuch:
    # build: nur fuer den Bau aus dem Quellcode. Ist das Abbild einmal
    # veroeffentlicht, holt der Betrieb es von ghcr.io.
    build: .
    image: ghcr.io/prolo2408/bordbuch:2.6.2     # feste Fassung, nie latest
    container_name: bordbuch
    restart: unless-stopped
    # Rechte nach CLAUDE.md §19 (B-29): keine Linux-Faehigkeiten, keine
    # Rechteausweitung ueber setuid.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only ist hier moeglich, weil Bordbuch ausschliesslich in die
    # Volumes /daten und /belege schreibt. /tmp braucht es trotzdem: die
    # Standardbibliothek legt dort Zwischendateien ab.
    read_only: true
    tmpfs:
      - /tmp:size=16m

    environment:
      # Die Marke der Vertrauensgrenze (N-44). Mit ":?" bricht schon
      # "docker compose up" ab und sagt, was fehlt - besser als ein
      # Container, der startet und dann jede Anfrage mit 401 abweist.
      # Der Wert steht in bordbuch/.env; "prolo geheimnisse --verteilen"
      # traegt ihn ein.
      PROLO_EINLASS: "${PROLO_EINLASS:?PROLO_EINLASS fehlt in bordbuch/.env - sudo prolo geheimnisse --verteilen}"
      # Datenbank und Belege liegen in getrennten Volumes - Belege werden
      # gross, und beim Wiederherstellen will man sie einzeln behandeln koennen.
      BORDBUCH_DB: /daten/bordbuch.db
      BORDBUCH_BELEGE: /belege
      LADELOG_HOST: 0.0.0.0        # im Container richtig: es gibt keine ports-Zeile
      # Ausdrueckliche Zusage: vor diesem Dienst steht Traefik, und es gibt
      # KEINE ports-Zeile. Ohne das weigert sich Bordbuch zu starten.
      BORDBUCH_HEADER_VERTRAUEN: "1"
      LADELOG_PORT: 8080
      # Wer die Gesamtsicherung ueber alle Profile ziehen darf.
      BORDBUCH_ADMIN_GRUPPE: bordbuch-admin
      # Ziel des Abmelden-Knopfes; leer laesst den Knopf verschwinden.
      BORDBUCH_ABMELDEN: /outpost.goauthentik.io/sign_out

    volumes:
      - bordbuch_daten:/daten
      - bordbuch_belege:/belege

    labels:
      # Welche Gruppen dieses Werkzeug in Authentik erwartet (N-95). Das
      # Werkzeug sagt es selbst - "prolo einrichten" liest es von hier.
      # Form: <gruppe>=<wozu>; <gruppe>=<wozu>
      - "prolo.gruppen=bordbuch-admin=alle Fahrtenbuecher sichern und zurueckspielen"

volumes:
  bordbuch_daten:                   # von aussen: bordbuch_bordbuch_daten
  bordbuch_belege:                  # von aussen: bordbuch_bordbuch_belege
