# /opt/stack/bordbuch/aktualisierung.conf

# Eigenes Dockerfile im Ordner, kein fertiges Abbild aus einer Registry.
TYP="build"

# Containername und interner Port - NICHT die oeffentliche Domain, sonst
# haengt die Pruefung an der Anmeldung fest.
# Bordbuch beantwortet "/" bewusst ohne Anmeldekopf (die Seite selbst ist
# leer, alle Daten kommen ueber /api und sind geschuetzt) - genau darum
# funktioniert diese Pruefung.
PRUEF_URL="http://bordbuch:8080/"

# Bordbuch startet ohne Migrationen fremder Dienste und ist schnell da.
PRUEF_WARTEN=20
