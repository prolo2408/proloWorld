# /opt/stack/bordbuch/sicherung.conf

# Zwei benannte Volumes: die Datenbank und - getrennt davon - die Belegbilder.
# Getrennt, weil Belege gross werden und anders behandelt werden duerfen.
# Name pruefen mit: docker volume ls | grep bordbuch
VOLUMES="bordbuch_bordbuch_daten bordbuch_bordbuch_belege"

# Bordbuch benutzt SQLite im Volume, keinen eigenen Datenbank-Container.
DB_CONTAINER=""
DB_USER=""
DB_NAME=""

# Bordbuch hat keine Geheimnisse: keine Schluessel, keine Zugangsdaten, kein
# Token. Die Anmeldung liegt vollstaendig bei Authentik. Darum gibt es hier
# keine .env, die mitgesichert werden muesste.
DATEIEN=""

HINWEIS="SQLite liegt im Volume, kein eigener DB-Container. Bordbuch legt selbst KEINE Sicherungen an - der Volume-Tar ist die Sicherung. Fuer einen garantiert konsistenten Stand den Container vorher kurz anhalten: docker stop bordbuch. Keine ungeschuetzten Webhook-Pfade, kein zweiter Router ohne authentik@file."
