# /opt/stack/bordbuch/sicherung.conf

# Zwei benannte Volumes: die Datenbank und - getrennt davon - die Belegbilder.
# Getrennt, weil Belege gross werden und anders behandelt werden duerfen.
# Name pruefen mit: docker volume ls | grep bordbuch
VOLUMES="bordbuch_bordbuch_daten bordbuch_bordbuch_belege"

# Bordbuch benutzt SQLite im Volume, keinen eigenen Datenbank-Container.
DB_CONTAINER=""
DB_USER=""
DB_NAME=""

# Im Docker-Betrieb hat Bordbuch keine Geheimnisse: keine Schluessel, keine
# Zugangsdaten, kein Token. Die Anmeldung liegt vollstaendig bei Authentik.
# Falls doch einmal eine .env entsteht, wird sie mitgesichert - lieber eine
# Zeile, die meist nichts findet, als ein Geheimnis, das nach einem Ausfall
# weg ist (B-33; der Warnhinweis dazu steht im Skript).
DATEIEN="?.env"

# SQLite-Datenbanken im Container (neu aus B-08). Werden mit sqlite3.backup()
# konsistent gesichert, statt sie im laufenden Betrieb aus dem Volume zu
# kopieren: im WAL-Modus greift ein tar .db, .db-wal und .db-shm zu
# verschiedenen Zeitpunkten ab, und das Ergebnis kann unbrauchbar sein.
SQLITE="bordbuch:/daten/bordbuch.db"

ORDNER=""

HINWEIS="SQLite liegt im Volume, kein eigener DB-Container. Die verlaessliche
Sicherung der Datenbank ist bordbuch.db aus dem SQLITE-Feld, NICHT die
Datenbank im Volume-Tar - der Tar ist fuer die Belege da. Ein Anhalten des
Containers ist dafuer nicht mehr noetig. Keine ungeschuetzten Webhook-Pfade,
kein zweiter Router ohne authentik@file."
