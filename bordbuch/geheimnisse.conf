# GEHEIMNISSE dieses Werkzeugs - gelesen von "prolo geheimnisse".
#
# Eine Zeile je Wert, Felder mit | getrennt:
#
#   NAME | DATEI | FORM | WECHSEL | Erklaerung
#
#   DATEI    relativ zum Werkzeugordner
#   FORM     env   = Zeile "NAME=wert"
#            yaml  = Zeile "Name: \"wert\""
#   WECHSEL  harmlos    das Werkzeug darf ihn neu wuerfeln
#            sitzungen  darf es auch, aber alle muessen sich neu anmelden
#            haende     NUR von Hand - das Werkzeug zeigt ihn und ruehrt
#                       ihn nicht an. Steht der Wert an einer zweiten
#                       Stelle, die nicht in einer Datei liegt (in einer
#                       Datenbank zum Beispiel), ist das immer "haende".
#
# Was hier NICHT hineingehoert: Werte. Nur ihre Namen.
PROLO_EINLASS|.env|env|harmlos|Die Marke der Vertrauensgrenze (N-44). Gemeinsam mit Traefik, Wiki und www.
